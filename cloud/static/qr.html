<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><meta name="robots" content="noindex">
<title>Order at your table</title>
<style>
:root{--ink:#14213a;--mut:#718096;--bg:#f7f7fb;--white:#fff;--line:#e8ebf2;--orange:#f97316;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:110px}
button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}
header{background:linear-gradient(125deg,#12253e,#233959 70%,#29344e);color:#fff;padding:24px max(20px,calc((100% - 1080px)/2));position:relative}
.brand{font-size:11px;font-weight:800;letter-spacing:2px;color:#fb923c;margin-bottom:8px}
header h1{font-size:clamp(22px,4vw,32px);margin:0 0 6px}header .t{display:inline-flex;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:99px;font-weight:700;font-size:12px}header p{font-size:13px;color:#dbe3ef;margin:12px 0 0}
.toolbar{max-width:1080px;margin:0 auto;padding:16px 20px 0}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;outline:none}.search:focus{border-color:var(--orange)}
.cats{max-width:1080px;margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:14px 20px 10px;scrollbar-width:none}.cat{white-space:nowrap;flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 17px;font-weight:700;font-size:13px;color:#344256}.cat.on{background:#172940;color:white;border-color:#172940}
main{max-width:1080px;margin:0 auto;padding:0 20px}main h2{font-size:18px;margin:18px 0 12px}.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.it{display:flex;gap:14px;align-items:center;border:1px solid var(--line);background:#fff;padding:13px;border-radius:18px;box-shadow:0 8px 25px rgba(15,23,42,.04)}
.it img,.img-placeholder{width:92px;height:94px;border-radius:14px;object-fit:cover;flex-shrink:0}.img-placeholder{display:grid;place-items:center;background:#fff1e8;font-size:32px}
.it .n{flex:1;min-width:0}.it b{font-size:15px;display:block;line-height:1.35}.it small{font-size:12px;color:var(--mut);display:block;margin-top:5px}.it .p{font-size:16px;font-weight:800;margin-top:8px}.it .act{display:flex;align-items:center;gap:7px;margin-top:7px}
.veg{display:inline-block;width:12px;height:12px;border:2px solid var(--ok);border-radius:2px;margin-right:5px;vertical-align:-1px}.veg.nv{border-color:var(--bad)}.veg:after{content:"";display:block;margin:2px;width:4px;height:4px;border-radius:50%;background:var(--ok)}.veg.nv:after{background:var(--bad)}
.q{display:inline-flex;align-items:center;gap:8px}.q button{width:31px;height:31px;background:#fff;border:1px solid #d8dde7;border-radius:9px;font-weight:800;font-size:18px}.q span{min-width:18px;text-align:center;font-weight:800}
.add{border:1px solid #fed7aa;color:#c2410c;background:#fff7ed;padding:8px 14px;border-radius:11px;font-weight:800;font-size:13px}
.bar{position:fixed;bottom:0;left:0;right:0;padding:12px max(14px,calc((100% - 1080px)/2)) calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:6;box-shadow:0 -12px 40px rgba(0,0,0,.06)}.bar .row{display:flex;gap:8px}.btn{background:var(--orange);color:#fff;border:0;border-radius:12px;padding:13px 14px;font-size:14px;font-weight:800;flex:1}.btn.g{color:var(--ink);background:#edf1f6}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(15,23,42,.58);display:none;align-items:flex-end}.sheet.open{display:flex}.box{background:#fff;border-radius:24px 24px 0 0;padding:22px max(18px,calc((100% - 680px)/2)) calc(24px + env(safe-area-inset-bottom));width:100%;max-height:90vh;overflow-y:auto}.box h3{font-size:20px;margin:0 0 12px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}textarea,.box input[type=text],.box input:not([type]){width:100%;border:1px solid var(--line);padding:12px;border-radius:12px;margin:8px 0;font-size:14px}
.grp{padding:14px;border:1px solid var(--line);border-radius:14px;margin:12px 0}.grp h4{margin:0 0 8px;font-size:14px}.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px;margin-top:7px;border-radius:10px;background:#f8fafc;border:1px solid #e7ebf1;font-weight:600;font-size:13px}.opt.selected{border-color:var(--orange);background:#fff7ed}.opt input{accent-color:var(--orange)}
.st{border:1px solid var(--line);background:#f8fafc;padding:14px;border-radius:14px;margin:9px 0}.st b{display:block;margin:7px 0}.tag{display:inline-block;padding:4px 10px;border-radius:99px;background:#e2e8f0;font-size:12px;font-weight:800}.tag.ok{background:#dcfce7;color:#166534}.tag.w{background:#ffedd5;color:#9a3412}.tag.bad{background:#fee2e2;color:#991b1b}.msg{padding:55px 10px;text-align:center;color:var(--mut)}.toast{position:fixed;z-index:12;display:none;left:16px;right:16px;bottom:90px;border-radius:12px;background:#172940;color:#fff;text-align:center;padding:13px}.foot{text-align:center;font-size:11px;color:#94a3b8;padding:25px 0}.muted{color:var(--mut);font-size:12px}
@media(max-width:760px){.menu-grid{grid-template-columns:1fr}.it img,.img-placeholder{width:94px;height:98px}header{padding:23px 19px}.bar .btn{padding:12px 9px;font-size:12px}}
</style></head>
<body>
<header><div class="brand">SETU • SCAN & DINE</div><h1 id="h">Menu</h1><div class="t" id="tb"></div><p>Freshly prepared, served at your table. No app needed.</p></header>
<div class="toolbar"><input class="search" id="search" type="search" placeholder="Search dishes, drinks, starters…" autocomplete="off" oninput="draw()"></div>
<div class="cats" id="cats"></div>
<main id="m"><div class="msg">Loading the menu…</div></main>
<div class="bar" id="bar" style="display:none"><div class="row">
  <button class="btn g" onclick="openOrders()">My orders</button>
  <button class="btn g" onclick="openHelp()">Call waiter</button>
  <button class="btn" id="cartbtn" onclick="openCart()" disabled>Cart</button></div></div>
<div class="sheet" id="sh" onclick="if(event.target.id==='sh')closeSheet()"><div class="box" id="box"></div></div>
<div class="toast" id="toast"></div>
<script>
// Guest menu for one table. The address is /q/<HOTEL>/<token>; the token only allows this table's menu, orders and calls.
const parts = location.pathname.split('/').filter(Boolean), HOTEL = parts[1] || '', TOKEN = parts[2] || '';
const $ = s => document.querySelector(s), esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const rs = n => '₹' + (Math.round(n * 100) / 100).toLocaleString('en-IN');
let MENU = null, CART = {}, CAT = '', STATUS = null, NOTE = '', NAME = '';
try{ CART = JSON.parse(sessionStorage.getItem('cart:' + TOKEN) || '{}'); }catch(e){}
const keepCart = () => { try{ sessionStorage.setItem('cart:' + TOKEN, JSON.stringify(CART)); }catch(e){} };
async function call(path, body){
  const r = await fetch(path + (body ? '' : (path.includes('?') ? '&' : '?') + 't=' + TOKEN), {method: body ? 'POST' : 'GET', cache: 'no-store',
    headers: {'X-Setu-Hotel': HOTEL, 'Content-Type': 'application/json'}, body: body ? JSON.stringify({...body, t: TOKEN}) : undefined});
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw Object.assign(new Error(j.error || 'Please try again'), {status: r.status});
  return j;
}
function toast(t){ const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2600); }
async function load(){
  try{ MENU = await call('/api/guest/menu'); }
  catch(e){ $('#m').innerHTML = `<div class="msg"><b>${esc(e.message)}</b><br><br>${e.status === 410 ? 'The QR code may be old. Please ask the staff for help.' : 'Please check the internet and scan again.'}</div>`; return; }
  document.title = MENU.hotel; $('#h').textContent = MENU.hotel; $('#tb').textContent = 'Table ' + MENU.table;
  Object.keys(CART).forEach(k => { if(!MENU.items.some(i => i.id === k)) delete CART[k]; });
  $('#bar').style.display = ''; draw(); poll();
}
function cats(){ return [...new Set(MENU.items.map(i => i.cat))]; }
function draw(){
  const cs = cats();
  $('#cats').innerHTML = cs.map(c => `<button class="cat ${CAT === c ? 'on' : ''}" onclick="jump('${esc(c).replace(/'/g, '&#39;')}')">${esc(c)}</button>`).join('');
  $('#m').innerHTML = cs.map(c => `<h2 id="c-${encodeURIComponent(c)}">${esc(c)}</h2>` + MENU.items.filter(i => i.cat === c).map(i => {
    const n = CART[i.id] || 0;
    return `<div class="it">${i.img ? `<img src="${esc(i.img)}" alt="" loading="lazy">` : ''}<div class="n"><b>${i.veg === true ? '<span class="veg"></span>' : i.veg === false ? '<span class="veg nv"></span>' : ''}${esc(i.name)}</b>${i.desc ? `<small>${esc(i.desc)}</small>` : ''}<div class="p">${rs(i.price)}</div></div>
      ${n ? `<div class="q"><button onclick="qty('${i.id}',-1)">−</button><span>${n}</span><button onclick="qty('${i.id}',1)">+</button></div>` : `<button class="add" onclick="qty('${i.id}',1)">ADD</button>`}</div>`;
  }).join('')).join('') + '<div class="foot">Powered by Setu · Aghanya Devanya Enterprises</div>';
  const n = Object.values(CART).reduce((a, b) => a + b, 0), t = MENU.items.reduce((a, i) => a + (CART[i.id] || 0) * i.price, 0);
  $('#cartbtn').disabled = !n; $('#cartbtn').textContent = n ? `Cart (${n}) · ${rs(t)}` : 'Cart';
}
function jump(c){ CAT = c; draw(); const e = document.getElementById('c-' + encodeURIComponent(c)); if(e) window.scrollTo({top: e.offsetTop - 120, behavior: 'smooth'}); }
function qty(id, d){ CART[id] = Math.max(0, Math.min(50, (CART[id] || 0) + d)); if(!CART[id]) delete CART[id]; keepCart(); draw(); if($('#sh').classList.contains('open') && $('#box').dataset.v === 'cart') openCart(); }
function sheet(v, html){ const b = $('#box'); b.dataset.v = v; b.innerHTML = html; $('#sh').classList.add('open'); }
function closeSheet(){ $('#sh').classList.remove('open'); }
function openCart(){
  const lines = MENU.items.filter(i => CART[i.id]);
  if(!lines.length){ closeSheet(); return; }
  const t = lines.reduce((a, i) => a + CART[i.id] * i.price, 0);
  sheet('cart', `<h3>Your order · Table ${esc(MENU.table)}</h3>${lines.map(i => `<div class="line"><span>${esc(i.name)}<br><small style="color:var(--mut)">${rs(i.price)} each</small></span>
      <div class="q"><button onclick="qty('${i.id}',-1)">−</button><span>${CART[i.id]}</span><button onclick="qty('${i.id}',1)">+</button></div></div>`).join('')}
    <div class="line"><b>Total</b><b>${rs(t)}</b></div>${MENU.gst && !MENU.incl ? `<small style="color:var(--mut)">GST ${MENU.gst}% is added on the bill.</small>` : ''}
    <textarea id="note" rows="2" maxlength="200" placeholder="Cooking notes (less spicy, no onion…)">${esc(NOTE)}</textarea>
    <input id="nm" maxlength="60" placeholder="Your name (optional)" value="${esc(NAME)}">
    <div class="row" style="display:flex;gap:8px;margin-top:12px"><button class="btn g" onclick="closeSheet()">Add more</button><button class="btn" id="place" onclick="place()">Place order</button></div>`);
}
async function place(){
  NOTE = $('#note').value; NAME = $('#nm').value;
  const items = Object.entries(CART).map(([mid, qty]) => ({mid, qty}));
  if(!items.length) return;
  const btn = $('#place'); btn.disabled = true; btn.textContent = 'Sending…';
  // One id per cart: a retry after a slow network sends the same id, so the order is never made twice
  let id = sessionStorage.getItem('oid:' + TOKEN);
  if(!id){ id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, '').slice(0, 32); sessionStorage.setItem('oid:' + TOKEN, id); }
  try{
    await call('/api/guest/order', {id, items, note: NOTE, name: NAME});
    CART = {}; NOTE = ''; keepCart(); sessionStorage.removeItem('oid:' + TOKEN);
    draw(); toast('Order sent! The staff will confirm it.'); await poll(); openOrders();
  }catch(e){ btn.disabled = false; btn.textContent = 'Place order'; toast(e.message); }
}
const ST = {pending: ['Waiting for the staff', 'w'], accepted: ['Accepted', 'ok'], done: ['Sent to the kitchen', 'ok'], rejected: ['Not accepted', 'bad']};
const KT = {preparing: 'Preparing', ready: 'Ready — coming to your table', served: 'Served'};
function openOrders(){
  const os = (STATUS && STATUS.orders || []).slice().reverse();
  sheet('orders', `<h3>My orders · Table ${esc(MENU.table)}</h3>${os.map(o => {
    const s = ST[o.status] || [o.status, ''];
    return `<div class="st"><span class="tag ${s[1]}">${o.kot && o.status === 'done' ? esc(KT[o.kot] || o.kot) : s[0]}</span> <small style="color:var(--mut)">${new Date(o.at).toLocaleTimeString('en-IN', {hour: '2-digit', minute: '2-digit'})}</small>
      <b style="margin-top:6px">${o.items.map(i => esc(i.qty + ' × ' + i.name)).join(', ')}</b>${o.reason ? `<small>${esc(o.reason)}</small>` : ''}</div>`;
  }).join('') || '<p style="color:var(--mut)">No order yet. Choose items from the menu.</p>'}
    <div class="row" style="display:flex;gap:8px;margin-top:12px"><button class="btn g" onclick="closeSheet()">Order more</button><button class="btn" onclick="ask('bill')">Request bill</button></div>`);
}
function openHelp(){
  sheet('help', `<h3>Need help?</h3><div style="display:flex;flex-direction:column;gap:8px">
    <button class="btn" onclick="ask('waiter')">Call waiter</button><button class="btn g" onclick="ask('water')">Water please</button><button class="btn g" onclick="ask('bill')">Request bill</button>
    <button class="btn g" onclick="closeSheet()">Close</button></div>`);
}
async function ask(kind){
  try{ await call('/api/guest/call', {kind}); closeSheet(); toast(kind === 'bill' ? 'The bill is on its way.' : 'The staff has been told. Please wait.'); }
  catch(e){ toast(e.message); }
}
async function poll(){
  clearTimeout(poll.t);
  try{ STATUS = await call('/api/guest/status'); if($('#sh').classList.contains('open') && $('#box').dataset.v === 'orders') openOrders(); }catch(e){}
  const live = STATUS && STATUS.orders.some(o => o.status !== 'rejected' && o.kot !== 'served');
  poll.t = setTimeout(poll, live ? 8000 : 30000);
}
load();
</script>
</body></html>
