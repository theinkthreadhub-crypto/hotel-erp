<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Setu Hotel Admin</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>/* look before the first paint: dark glass unless this device chose light */ try{ document.documentElement.dataset.look = localStorage.getItem('setu_admin_look') || 'glass'; }catch(e){ document.documentElement.dataset.look = 'glass'; }</script>
<link rel="manifest" href="admin.webmanifest">
<meta name="theme-color" content="#1e3a8a">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Setu Hotel Admin — Material 3 style, built for the Android app (also used in a browser) */
  :root{ --bg:#f7f9fc; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --pri:#1e3a8a; --pri2:#2563eb; --pri-ink:#fff; --brand:#1e3a8a;
    --tonal:#e0e7ff; --tonal-ink:#1e3a8a; --ok:#15803d; --bad:#dc2626; --warn:#b45309; --soft:#f1f5f9; --gold:#a16207;
    --e1:0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.05); --e2:0 4px 14px rgba(15,23,42,.10); --e3:0 10px 30px rgba(15,23,42,.18);
    --ease:cubic-bezier(.2,0,0,1); --bar:64px }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  [hidden]{ display:none !important }
  html{ overscroll-behavior-y:contain }
  /* Inter: a clean professional typeface; numbers line up in lists (tabular figures) */
  body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 Inter, Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; font-feature-settings:"cv11", "ss01", "tnum"; letter-spacing:-.005em }
  /* An app does not select text or show the long-press menu, except where you type or copy */
  body{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none }
  input, textarea, code, .keybox, .sel{ -webkit-user-select:text; user-select:text }
  svg.i{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:none }
  button, .hc, .li, .tile, .chip, .plan, a{ touch-action:manipulation }

  /* ---------- top app bar (large title that shrinks on scroll) ---------- */
  header{ position:sticky; top:0; z-index:5; background:var(--bg); display:flex; align-items:center; gap:4px; padding:8px 8px 8px 16px; min-height:var(--bar); transition:box-shadow .2s, background .2s }
  header.lifted{ box-shadow:0 1px 0 var(--line), 0 2px 6px rgba(15,23,42,.05); background:#fff }
  header .t{ flex:1; min-width:0 }
  header h1{ font-size:22px; font-weight:600; margin:0; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:font-size .2s var(--ease) }
  header.lifted h1{ font-size:19px }
  header small{ color:var(--muted); font-size:12.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:opacity .2s, height .2s }
  header.lifted small{ opacity:0; height:0 }
  .ib{ background:transparent; color:var(--ink); border:0; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; padding:0; position:relative; overflow:hidden; flex:none }
  .ib:active{ background:rgba(15,23,42,.08) }
  #hback{ margin-left:-10px; display:none } header.sub #hback{ display:grid }

  /* ---------- bottom navigation bar with the active pill ---------- */
  nav{ display:flex; position:fixed; left:0; right:0; bottom:0; background:#fff; z-index:6; padding:6px 0 calc(8px + env(safe-area-inset-bottom)); box-shadow:0 -1px 0 var(--line) }
  nav button{ flex:1; background:transparent; color:var(--muted); border:0; border-radius:0; padding:4px 2px 2px; font-size:12px; font-weight:500; display:flex; flex-direction:column; align-items:center; gap:4px; position:relative; overflow:visible }
  nav button .pill{ width:60px; height:32px; border-radius:16px; display:grid; place-items:center; transition:background .25s var(--ease); position:relative; overflow:hidden }
  nav button.on{ color:var(--ink); font-weight:700 } nav button.on .pill{ background:var(--tonal); color:var(--tonal-ink) }
  nav .badge{ position:absolute; top:-2px; left:calc(50% + 8px); z-index:1 }
  main{ padding:4px 16px 120px; max-width:760px; margin:0 auto }
  main.enter{ opacity:0; transform:translateY(10px) }
  main.shown{ transition:opacity .22s var(--ease), transform .26s var(--ease) }

  /* ---------- controls ---------- */
  input, button, select, textarea{ font:inherit; padding:12px 14px; border-radius:12px; border:1px solid #cbd5e1; background:var(--card); color:var(--ink); max-width:100% }
  input:focus, select:focus, textarea:focus{ outline:0; border-color:var(--pri); box-shadow:0 0 0 1px var(--pri) }
  button{ cursor:pointer; background:var(--pri); color:var(--pri-ink); border:0; font-weight:600; border-radius:22px; padding:11px 20px; position:relative; overflow:hidden; transition:box-shadow .2s, transform .1s }
  button:active{ transform:scale(.98) }
  button.g{ background:var(--card); color:var(--pri); border:1px solid #cbd5e1 }
  button.bad{ background:var(--bad); color:#fff } button.okb{ background:var(--ok); color:#fff }
  button.big{ width:100%; padding:15px; font-size:16px; border-radius:28px }
  button:disabled{ opacity:.45; cursor:default }
  label{ display:block; font-size:12.5px; color:var(--muted); margin:14px 0 6px; font-weight:600; letter-spacing:.1px }
  .card{ background:var(--card); border-radius:20px; padding:18px; margin-bottom:12px; box-shadow:var(--e1) }
  .card > h2:first-child{ margin-top:0 }
  .card > input:not([type=checkbox]), .card > select, .card > textarea{ width:100% }
  .muted{ color:var(--muted) } .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .err{ color:var(--bad); font-weight:600 } .ok{ color:var(--ok); font-weight:600 }
  code{ font:12px ui-monospace, "Roboto Mono", Consolas, monospace; background:var(--soft); padding:3px 7px; border-radius:6px; word-break:break-all }
  .badge{ background:var(--bad); color:#fff; border-radius:20px; font-size:10px; padding:1px 6px; font-weight:700; min-width:16px; text-align:center }
  h2{ font-size:18px; font-weight:600; margin:0 0 10px; letter-spacing:-.1px } h3{ font-size:14px; margin:18px 0 8px; font-weight:700 }
  /* M3 switch for every checkbox */
  input[type=checkbox]{ -webkit-appearance:none; appearance:none; width:44px !important; height:26px; border-radius:13px; background:#cbd5e1; border:0; padding:0; position:relative; flex:none; transition:background .2s; cursor:pointer; margin:0 }
  input[type=checkbox]::after{ content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .2s var(--ease) }
  input[type=checkbox]:checked{ background:var(--pri) } input[type=checkbox]:checked::after{ transform:translateX(18px) }
  input[type=checkbox]:focus{ box-shadow:none }
  .ripple{ position:absolute; border-radius:50%; transform:scale(0); background:currentColor; opacity:.16; pointer-events:none; animation:rip .5s var(--ease) forwards }
  @keyframes rip{ to{ transform:scale(2.6); opacity:0 } }

  /* ---------- hotels list ---------- */
  .search{ display:flex; align-items:center; gap:10px; background:#e9eef5; border-radius:28px; padding:0 16px; margin:4px 0 12px; color:var(--muted); height:52px }
  .search input{ border:0; flex:1; padding:12px 0; outline:0; background:transparent; box-shadow:none }
  .chips{ display:flex; gap:8px; overflow-x:auto; margin:0 -16px 14px; padding:0 16px; scrollbar-width:none } .chips::-webkit-scrollbar{ display:none }
  .chip{ flex:none; background:var(--card); color:var(--ink); border:1px solid #cbd5e1; border-radius:10px; padding:7px 14px; font-size:13.5px; font-weight:500; height:36px }
  .chip.on{ background:var(--tonal); color:var(--tonal-ink); border-color:transparent; font-weight:700 } .chip b{ margin-left:6px; opacity:.6; font-weight:600 }
  .hc{ background:var(--card); border-radius:20px; padding:14px 16px; margin-bottom:10px; cursor:pointer; box-shadow:var(--e1); position:relative; overflow:hidden; transition:transform .12s var(--ease) }
  .hc:active{ transform:scale(.985) }
  .hc .top{ display:flex; align-items:center; gap:12px }
  .av{ width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:18px; flex:none }
  .hc .mid{ flex:1; min-width:0 } .hc b.nm{ display:block; font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .hc small{ color:var(--muted); font-size:12.5px }
  .tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px }
  .tag{ font-size:11.5px; font-weight:600; padding:4px 9px; border-radius:8px; background:var(--soft); color:#475569 }
  .tag.ok{ background:#dcfce7; color:#166534 } .tag.warn{ background:#fef3c7; color:#92400e } .tag.bad{ background:#fee2e2; color:#991b1b }
  .st{ font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:99px; white-space:nowrap }
  .st.ok{ background:#dcfce7; color:#166534 } .st.warn{ background:#fef3c7; color:#92400e } .st.bad{ background:#fee2e2; color:#991b1b } .st.off{ background:#e2e8f0; color:#334155 }
  .strip{ margin-top:10px; font-size:12.5px; font-weight:600; padding:8px 12px; border-radius:12px }
  .strip.warn{ background:#fef3c7; color:#92400e } .strip.bad{ background:#fee2e2; color:#991b1b }
  .sum{ display:flex; gap:12px; align-items:center; padding:16px; border-radius:20px; background:linear-gradient(135deg, #1e3a8a, #2563eb); color:#fff; margin-bottom:12px; box-shadow:var(--e2) }
  .sum .big{ font-size:28px; font-weight:700; line-height:1 } .sum small{ opacity:.85 } .sum .err{ color:#fecaca }
  .fab{ position:fixed; right:16px; bottom:calc(96px + env(safe-area-inset-bottom)); z-index:7; display:flex; align-items:center; gap:10px; height:56px; padding:0 20px 0 16px; border-radius:16px; background:var(--tonal); color:var(--tonal-ink); box-shadow:var(--e3); font-weight:700; font-size:15px; transition:width .25s var(--ease), padding .25s var(--ease) }
  .fab.mini span{ display:none } .fab.mini{ padding:0 16px }

  /* ---------- one hotel (bottom sheet) ---------- */
  .hero{ display:flex; gap:14px; align-items:center; margin-bottom:14px } .hero .av{ width:56px; height:56px; font-size:22px }
  .hero h2{ margin:0; font-size:20px }
  .quick{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px }
  .quick a{ display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; border-radius:24px; text-decoration:none; font-weight:700; background:var(--tonal); color:var(--tonal-ink); position:relative; overflow:hidden }
  .quick a.wa{ background:#dcfce7; color:#166534 }
  .facts{ background:var(--card); border-radius:20px; overflow:hidden; margin-bottom:14px; box-shadow:var(--e1) }
  .facts div{ display:flex; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--soft); font-size:14px } .facts div:last-child{ border-bottom:0 }
  .facts span{ color:var(--muted) } .facts b{ text-align:right; font-weight:600 }
  .tiles{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px }
  .tile{ background:var(--card); color:var(--ink); border:0; border-radius:20px; padding:14px 6px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12.5px; font-weight:700; text-align:center; line-height:1.2; box-shadow:var(--e1) }
  .tile svg.i{ width:26px; height:26px; padding:8px; box-sizing:content-box; border-radius:50%; background:var(--soft) } .tile small{ font-weight:500; color:var(--muted); font-size:10.5px }
  .tile.blue svg.i{ color:var(--pri); background:var(--tonal) } .tile.red svg.i{ color:var(--bad); background:#fee2e2 } .tile.amber svg.i{ color:var(--warn); background:#fef3c7 } .tile.green svg.i{ color:var(--ok); background:#dcfce7 }
  .tile.on{ outline:2px solid #fecaca }
  /* ---------- keygen ---------- */
  .plans{ display:grid; grid-template-columns:repeat(2, 1fr); gap:8px }
  .plan{ background:var(--card); color:var(--ink); border:1.5px solid #cbd5e1; border-radius:16px; padding:12px 14px; text-align:left; font-weight:700 }
  .plan small{ display:block; color:var(--muted); font-weight:500; font-size:11.5px } .plan.on{ border-color:var(--pri); background:var(--tonal); color:var(--tonal-ink) }
  .keybox{ font:13px/1.5 ui-monospace, "Roboto Mono", Consolas, monospace; background:#0f172a; color:#e2e8f0; padding:14px; border-radius:14px; word-break:break-all }
  .steps{ margin:0; padding-left:20px } .steps li{ margin:6px 0 }
  .switch{ display:flex; align-items:center; gap:12px; margin-top:14px; font-size:14px; color:var(--ink) }
  /* ---------- lists ---------- */
  .li{ display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--card); border:0; border-radius:0; margin:0; cursor:pointer; font-weight:500; width:100%; color:var(--ink); text-align:left; box-shadow:none }
  .group{ background:var(--card); border-radius:20px; overflow:hidden; margin-bottom:14px; box-shadow:var(--e1) } .group .li + .li{ border-top:1px solid var(--soft) }
  .gh{ font-size:12.5px; font-weight:700; color:var(--pri); margin:18px 4px 8px; letter-spacing:.3px }
  .li .ico{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--tonal); color:var(--tonal-ink); flex:none } .li > span:not(.ico){ flex:1 } .li small{ display:block; color:var(--muted); font-weight:400; font-size:12.5px }
  .li .chev{ color:#94a3b8 }
  .lr{ display:flex; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--soft) } .lr:last-child{ border-bottom:0 } .lr .x{ flex:1; min-width:0 } .lr b{ font-weight:600 }
  .lr small{ display:block; color:var(--muted); font-size:12px } .lr.click{ cursor:pointer } .lr.click:active{ background:var(--soft) }
  .msg{ max-width:85%; padding:10px 13px; border-radius:18px; margin:6px 0; white-space:pre-wrap } .msg.hotel{ background:var(--soft); border-bottom-left-radius:6px } .msg.admin{ background:var(--tonal); color:#172554; margin-left:auto; border-bottom-right-radius:6px }
  .msg small{ display:block; color:var(--muted); font-size:11px }
  .hcard{ padding:12px 0; border-bottom:1px solid var(--soft) } .hcard:last-child{ border-bottom:0 }
  /* ---------- bottom sheet, dialog, snackbar ---------- */
  #sheet, #ask{ position:fixed; inset:0; background:rgba(15,23,42,0); display:none; z-index:15; align-items:flex-end; justify-content:center; transition:background .25s }
  #ask{ z-index:30; align-items:center; padding:24px }
  #sheet.open, #ask.open{ display:flex } #sheet.in, #ask.in{ background:rgba(15,23,42,.42) }
  #sheet .box{ background:var(--bg); width:100%; max-width:640px; border-radius:28px 28px 0 0; max-height:94vh; overflow:auto; padding:8px 16px 24px; padding-bottom:max(24px, env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .32s var(--ease); overscroll-behavior:contain }
  #sheet.in .box{ transform:none } #sheet .box.drag{ transition:none }
  #sheet .grab{ width:36px; height:4px; border-radius:9px; background:#94a3b8; margin:8px auto 16px; opacity:.6 }
  #ask .box{ background:#fff; width:100%; max-width:400px; border-radius:28px; padding:24px; transform:scale(.92); opacity:0; transition:transform .22s var(--ease), opacity .18s; box-shadow:var(--e3) }
  #ask.in .box{ transform:none; opacity:1 } #ask h2{ font-size:20px; margin-bottom:12px }
  #sheet textarea, #sheet input:not([type=checkbox]), #sheet select, #ask textarea, #ask input:not([type=checkbox]){ width:100% }
  .btns{ display:flex; gap:8px; margin-top:18px } .btns button{ flex:1; padding:12px }
  #ask .btns{ justify-content:flex-end } #ask .btns button{ flex:none; min-width:96px }
  #toast{ position:fixed; bottom:calc(92px + env(safe-area-inset-bottom)); left:16px; right:16px; margin:0 auto; max-width:560px; background:#1e293b; color:#f1f5f9; padding:14px 16px; border-radius:12px; display:block; z-index:40; font-size:14px; box-shadow:var(--e3); transform:translateY(24px); opacity:0; pointer-events:none; transition:transform .25s var(--ease), opacity .2s }
  #toast.show{ transform:none; opacity:1 } #toast.err{ background:#991b1b }
  /* pull to refresh */
  #ptr{ position:fixed; top:var(--bar); left:50%; width:40px; height:40px; margin-left:-20px; border-radius:50%; background:#fff; box-shadow:var(--e2); z-index:8; display:grid; place-items:center; color:var(--pri); transform:translateY(-70px); opacity:0; pointer-events:none }
  #ptr svg.i{ width:22px; height:22px } #ptr.spin svg.i, .ib.spin svg.i{ animation:spin .8s linear infinite }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  /* skeleton while a screen loads */
  .sk{ border-radius:20px; background:linear-gradient(90deg, #eef2f7 25%, #f8fafc 50%, #eef2f7 75%); background-size:200% 100%; animation:sk 1.2s infinite linear; margin-bottom:10px }
  @keyframes sk{ from{ background-position:200% 0 } to{ background-position:-200% 0 } }
  /* ---------- login ---------- */
  #login{ max-width:420px; margin:0 auto; padding:12vh 20px 24px; min-height:100vh; display:flex; flex-direction:column }
  #login .logo{ width:84px; height:84px; border-radius:24px; box-shadow:var(--e2); background:#fff }
  .field{ position:relative; margin-top:8px }
  .field input{ width:100%; height:56px; padding:22px 48px 6px 16px; border-radius:12px; font-size:16px }
  .field span{ position:absolute; left:16px; top:18px; color:var(--muted); pointer-events:none; transition:all .15s var(--ease); font-size:16px }
  .field input:focus + span, .field input:not(:placeholder-shown) + span{ top:7px; font-size:12px; color:var(--pri); font-weight:600 }
  .field .eye{ position:absolute; right:4px; top:6px; color:var(--muted) }
  /* ---------- full-screen hotel page (all settings) ---------- */
  .grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px }
  .grid > div > input, .grid > div > select{ width:100% }
  .stats{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:12px }
  .stat{ background:var(--card); border-radius:18px; padding:14px; box-shadow:var(--e1) }
  .stat b{ display:block; font-size:22px; font-weight:700 }
  table{ width:100%; border-collapse:collapse }
  th, td{ text-align:left; padding:10px; border-bottom:1px solid var(--soft); vertical-align:middle }
  th{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em }
  tr.click{ cursor:pointer }
  .pill{ padding:3px 9px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap }
  .p-active{ background:#dcfce7; color:#166534 } .p-trial{ background:#e0f2fe; color:#075985 }
  .p-expired{ background:#fee2e2; color:#991b1b } .p-suspended{ background:#e2e8f0; color:#334155 } .p-pending{ background:#fef3c7; color:#92400e }
  .h-ok{ background:#dcfce7; color:#166534 } .h-warn{ background:#fef3c7; color:#92400e } .h-bad{ background:#fee2e2; color:#991b1b }
  .tabs{ display:flex; gap:0; border-bottom:1px solid var(--line); margin:0 -16px 14px; padding:0 8px; overflow-x:auto; scrollbar-width:none; position:sticky; top:var(--bar); background:#fff; z-index:2 }
  .tabs::-webkit-scrollbar{ display:none }
  .tabs button{ flex:none; background:transparent; color:var(--muted); border-radius:0; white-space:nowrap; padding:14px 14px 12px; font-weight:600; border-bottom:3px solid transparent }
  .tabs button.on{ color:var(--pri); border-bottom-color:var(--pri) }
  .feat{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:var(--card); box-shadow:var(--e1) }
  .feat select{ margin-left:auto }
  .two{ display:grid; grid-template-columns:1fr 300px; gap:16px } @media (max-width:820px){ .two{ grid-template-columns:1fr } }
  .rcpt{ background:#fff; color:#000; font:12px/1.35 ui-monospace, Consolas, monospace; padding:10px; border:1px dashed #94a3b8; margin:0 auto }
  .rcpt .c{ text-align:center } .rcpt hr{ border:0; border-top:1px dashed #000 } .rcpt .r{ text-align:right } .rcpt td{ padding:1px 0; border:0 }
  #drawer{ position:fixed; inset:0; background:var(--bg); display:none; z-index:20; overflow:auto; transform:translateX(100%); transition:transform .3s var(--ease); overscroll-behavior:contain }
  #drawer.in{ transform:none }
  #drawer .dbar{ position:sticky; top:0; z-index:3; background:#fff; display:flex; align-items:center; gap:4px; padding:8px; min-height:var(--bar); box-shadow:0 1px 0 var(--line) }
  #drawer .dbar .t{ flex:1; min-width:0 } #drawer .dbar b{ display:block; font-size:18px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis } #drawer .dbar small{ color:var(--muted); font-size:12px }
  #drawer .panel{ max-width:980px; margin:0 auto; padding:0 16px 40px }
  #drawer .panel input:not([type=checkbox]), #drawer .panel select, #drawer .panel textarea{ max-width:100% }
  @media (min-width:900px){ main{ padding-top:12px } }
  /* ================= Dark glass look (default): warm black, frosted cards, orange accent ================= */
  html[data-look=glass]{ --bg:#0e0b09; --card:rgba(255,255,255,.06); --ink:#f8f3ee; --muted:#a39a92; --line:rgba(255,255,255,.10); --soft:rgba(255,255,255,.06);
    --pri:#ff7a18; --pri2:#ff9a3c; --pri-ink:#fff; --tonal:rgba(255,122,24,.16); --tonal-ink:#ffb06b; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24;
    --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.11); --edge:rgba(255,255,255,.12); --orange:linear-gradient(135deg, #ff9a3c 0%, #ff6a00 100%);

<body>
<div id="login">

  <form id="lf">
    <div class="field"><input id="key" type="password" placeholder=" " autocomplete="off" required><span>Admin Key</span>
      <button type="button" class="ib eye" aria-label="Show key" onclick="const k=$('#key');k.type=k.type==='password'?'text':'password'"></button></div>
    <label class="switch" style="margin:18px 2px 22px;font-weight:500"><input id="remember" type="checkbox" checked> Remember on this phone</label>
    <button class="big">Open</button>
    <p id="lerr" class="err" style="text-align:center"></p>
  </form>
  <p class="muted" style="text-align:center;font-size:12px;margin-top:auto;padding-top:24px">Aghanya Devanya Enterprises</p>
</div>

<div id="app" hidden>
  <header id="hdr">
    <button class="ib" id="hback" aria-label="Back" onclick="goBack()"></button>
    <div class="t"><h1 id="htitle">Hotels</h1><small id="hsub">Setu Hotel Admin</small></div>
    <button class="ib" id="hrefresh" onclick="refresh()" title="Refresh" aria-label="Refresh"></button>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="drawer"><div class="dbar"><button class="ib" aria-label="Back" onclick="closeHotel()" id="dback"></button><div class="t"><b id="dtitle"></b><small id="dsub"></small></div></div><div class="panel" id="panel"></div></div>
<div id="sheet"><div class="box"><div class="grab"></div><div id="sbox"></div></div></div>
<div id="ask"><div class="box" id="abox"></div></div>
<div id="ptr"></div>
<div id="toast"></div>

<script>
let KEY = '', META = null, HOTELS = [], VIEW = 'hotels', CUR = null, TAB = 'overview';
// The Setu Hotel Admin app (v2+) keeps the Admin Key in the phone's Keystore (SA.keyGet); a browser uses localStorage
const APP = !!(window.SA && SA.keyGet);
const keyRemember = k => { try{ if(APP) SA.keySet(k); else localStorage.setItem('setu_admin', k); }catch(e){} };
const keyForget = () => { try{ if(APP) SA.keyClear(); localStorage.removeItem('setu_admin'); sessionStorage.removeItem('setu_admin'); }catch(e){} };
try{
  if(APP){ const old = localStorage.getItem('setu_admin'); if(old){ if(!SA.keyGet()) SA.keySet(old); localStorage.removeItem('setu_admin'); } }
  KEY = sessionStorage.getItem('setu_admin') || (APP ? SA.keyGet() : localStorage.getItem('setu_admin')) || '';
}catch(e){}
const haptic = k => { try{ if(APP) SA.haptic(k); }catch(e){} };
// Status / navigation bar colour: the dark glass look keeps them dark with light icons
const glassLook = () => document.documentElement.dataset.look === 'glass';
const bars = c => { try{ if(APP && SA.bars){ const g = glassLook(); SA.bars(g ? '#0E0B09' : c, !g); } }catch(e){} };
function setLook(glass){
  const v = glass ? 'glass' : 'light';
  document.documentElement.dataset.look = v;
  try{ localStorage.setItem('setu_admin_look', v); }catch(e){}
  bars(window.scrollY > 8 ? '#FFFFFF' : '#F7F9FC');
  haptic('tick');
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d8 = ms => ms ? new Date(ms).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : '-';
const dt = ms => ms ? new Date(ms).toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '-';
const rs = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');
const state = h => h.status === 'suspended' ? 'suspended' : ((h.paid_until ?? h.paidUntil) < Date.now() && !h.lifetime ? 'expired' : h.status);
const pill = s => `<span class="pill p-${esc(s)}">${esc(s)}</span>`;
const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' hours ago' : Math.round(m / 1440) + ' days ago'; };
// Backup health = when the hotel's data last reached the cloud
const health = ms => !ms ? '<span class="pill h-bad">No backup yet</span>'
  : Date.now() - ms < 26 * 36e5 ? `<span class="pill h-ok">OK · ${ago(ms)}</span>`
  : Date.now() - ms < 72 * 36e5 ? `<span class="pill h-warn">${ago(ms)}</span>`
  : `<span class="pill h-bad">${ago(ms)}</span>`;
const backupIssue = h => state(h) !== 'suspended' && (!h.seen || Date.now() - h.seen > 48 * 36e5);

// Line icons (no external files)
const ICONS = {
  hotels: 'M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M10 21v-4h4v4',
  key: 'M14.5 4a5.5 5.5 0 1 1-4.3 8.9L4 19v-3h2.5v-2.5H9l1.2-1.2A5.5 5.5 0 0 1 14.5 4zM16 8h.01',
  ticket: 'M4 5h16v11H9l-5 4z',
  cloud: 'M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.6 1.5A3.3 3.3 0 0 0 7 18z',
  more: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',

  unlock: 'M6 11h12v10H6zM8.5 11V8a3.5 3.5 0 0 1 6.8-1.2',
  warn: 'M12 3l9.5 17h-19zM12 10v4.5M12 17.5v.01',
  pause: 'M9 5v14M15 5v14',
  play: 'M8 5l11 7-11 7z',
  msg: 'M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12z',
  download: 'M12 4v11M7 10l5 5 5-5M5 20h14',
  user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 21a7.5 7.5 0 0 1 15 0',
  gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1',
  trash: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',
  phone: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z',
  copy: 'M9 9h11v11H9zM5 15V4h11',
  search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20.5 20.5l-4.5-4.5',
  refresh: 'M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5',
  chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
  plus: 'M12 5v14M5 12h14',
  spark: 'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z',
  list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
  block: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM5.6 5.6l12.8 12.8',
  out: 'M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11',
  share: 'M18 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8.6 13.5l6.8 4M15.4 6.5l-6.8 4',
  back: 'M20 12H5M11 5l-7 7 7 7',
  eye: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  chev: 'M9 6l6 6-6 6',
  finger: 'M12 11v4M8.5 8.5A5 5 0 0 1 17 12v2M7 12.5V15a5 5 0 0 0 2 4M17 17a5 5 0 0 1-1 2.5M12 3a9 9 0 0 1 9 9v1M3 13v-1a9 9 0 0 1 4-7.5'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
$('#hrefresh').innerHTML = ic('refresh'); $('#hback').innerHTML = ic('back'); $('#dback').innerHTML = ic('back');
$('#ptr').innerHTML = ic('refresh'); document.querySelector('#lf .eye').innerHTML = ic('eye');

// Snackbar (bottom, above the navigation bar)
function toast(t, bad){
  const e = $('#toast'); e.textContent = t; e.className = (bad ? 'err ' : '') + 'show';
  haptic(bad ? 'error' : 'tick');
  clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), bad ? 5000 : 2800);
}
// Copy / share work in a browser and in the Setu Hotel Admin phone app (SA bridge)
function copyText(t, label){
  if(window.SA && SA.copy){ SA.copy(t); return toast((label || 'Text') + ' copied'); }
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast((label || 'Text') + ' copied'), () => {
    const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
    try{ document.execCommand('copy'); toast((label || 'Text') + ' copied'); }catch(e){ toast('Could not copy; please select it by hand', true); }
    a.remove(); });
}
function shareText(t){
  if(window.SA && SA.share) return SA.share(t);
  if(navigator.share) return navigator.share({text: t}).catch(() => {});
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}

// Authenticator app: a right 6-digit code gives this device a 30-day session
const otpGet = () => { try{ return localStorage.getItem('setu_admin_otp') || ''; }catch(e){ return ''; } };
const otpSet = v => { try{ v ? localStorage.setItem('setu_admin_otp', v) : localStorage.removeItem('setu_admin_otp'); }catch(e){} };
async function api(path, body, again){
  const r = await fetch(path, {method: 'POST', headers: {'X-Setu-Admin': KEY, 'X-Setu-Otp': otpGet(), 'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  const j = await r.json().catch(() => ({}));
  if(r.status === 401 && j.error === 'otp' && !again){
    otpSet('');
    const v = await ask('Authenticator code', '<p class="muted" style="margin-top:0">Open the Authenticator app on your phone and type the 6-digit code for Setu Super Admin.</p><input id="otp_c" inputmode="numeric" maxlength="6" autocomplete="one-time-code">', 'Verify');
    if(!v) throw new Error('Authenticator code needed');
    const s = await api('/api/admin/totp/login', {code: v.otp_c}, true);
    otpSet(s.session);
    return api(path, body, true);
  }
  if(r.status === 401) throw new Error(j.error === 'otp' || /authenticator/i.test(j.error || '') ? (j.error === 'otp' ? 'Authenticator code needed' : j.error) : 'Invalid Admin Key');
  if(!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
// Errors show in the page: the phone app has no native alert()
const run = fn => async (...a) => { try{ await fn(...a); }catch(e){ toast(e.message, true); } };

// ----- layers: Android back closes the top one -----
let LAYERS = 0;
function pushLayer(){ LAYERS++; try{ history.pushState({layer: LAYERS}, ''); }catch(e){} }
function popLayer(){ if(LAYERS > 0){ try{ history.back(); }catch(e){ closeTop(); } } }
// Open with a slide / fade: 'open' shows it, 'in' (next frame) animates it in; closing reverses
function layerIn(el){ el.classList.add('open'); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in'))); }
function layerOut(el, then){ el.classList.remove('in'); clearTimeout(el._t); el._t = setTimeout(() => { if(!el.classList.contains('in')){ el.classList.remove('open'); then && then(); } }, 280); }
function closeTop(){
  LAYERS = Math.max(0, LAYERS - 1);
  if($('#ask').classList.contains('open')) return askDone(null);
  if($('#drawer').style.display === 'block') return closeHotelNow();
  if($('#sheet').classList.contains('open')) return layerOut($('#sheet'));
}
window.addEventListener('popstate', closeTop);

function sheet(html){
  $('#sbox').innerHTML = html;
  const sh = $('#sheet');
  if(!sh.classList.contains('open') || !sh.classList.contains('in')){ const was = sh.classList.contains('open'); layerIn(sh); if(!was) pushLayer(); }
  $('#sheet .box').scrollTop = 0;
}
function closeSheet(){ if($('#sheet').classList.contains('open')) popLayer(); }
$('#sheet').onclick = e => { if(e.target.id === 'sheet') closeSheet(); };

// In-page confirm: resolves with the box's input values ({id: value}) on OK, null on cancel
let ASK = null;
function ask(title, html, ok, danger){
  $('#abox').innerHTML = `<h2>${title}</h2>${html || ''}<div class="btns"><button class="g" onclick="popLayer()">Cancel</button><button class="${danger ? 'bad' : ''}" id="ask-ok">${ok || 'OK'}</button></div>`;
  layerIn($('#ask')); pushLayer();
  setTimeout(() => { const f = $('#abox input, #abox textarea'); f && f.focus(); }, 250);
  $('#ask-ok').onclick = () => {
    const v = {}; $('#abox').querySelectorAll('input, textarea, select').forEach(x => v[x.id] = x.type === 'checkbox' ? x.checked : x.value);
    // The box closes when its history entry is gone (popstate), so Android back stays in step
    const r = ASK; ASK = null; popLayer(); r && r(v);
  };
  return new Promise(res => ASK = res);
}
function askDone(v){ layerOut($('#ask')); const r = ASK; ASK = null; r && r(v); }

const SUB = {dash: 'Dashboard', add: 'New Hotel', ai: 'Setu AI', audit: 'Activity Log', blocked: 'Blocked computers', backups: 'Backups', security: 'Login security', updates: 'Software updates'};

// Grey placeholder cards while a screen loads (shown only if loading takes a moment)
const SKEL = {hotels: () => '<div class="sk" style="height:84px"></div><div class="sk" style="height:52px;border-radius:28px"></div>' + '<div class="sk" style="height:112px"></div>'.repeat(5),
  def: () => '<div class="sk" style="height:180px"></div><div class="sk" style="height:120px"></div><div class="sk" style="height:120px"></div>'};
let FIRST = true;
const show = run(async v => {
  const changed = v !== VIEW;
  VIEW = v; nav();
  if(changed){ window.scrollTo(0, 0); haptic('tick'); }
  const m = $('#main'), sk = setTimeout(() => { m.innerHTML = (SKEL[v] || SKEL.def)(); }, 140);
  try{ await ({hotels: drawHotels, keygen: drawKeygen, tickets: drawTickets, more: drawMore, dash: drawDash, add: drawAdd, ai: drawAI, audit: drawAudit, blocked: drawBlocked, backups: drawBackups, security: drawSecurity, updates: drawUpdates})[v](); }
  finally{ clearTimeout(sk); }
  nav(); onScroll();
  if(changed || FIRST){ m.classList.remove('shown'); m.classList.add('enter'); requestAnimationFrame(() => requestAnimationFrame(() => { m.classList.add('shown'); m.classList.remove('enter'); })); }
  if(FIRST){ FIRST = false; try{ if(APP && SA.ready) SA.ready(); }catch(e){} }
});
const refresh = () => { $('#hrefresh').classList.add('spin'); return show(VIEW).finally(() => $('#hrefresh').classList.remove('spin')); };
// Sub-screens of More get the app bar's back arrow instead of a button in the page
const backBtn = () => '';
function goBack(){ if(LAYERS) return popLayer(); if(SUB[VIEW]) return show('more'); if(VIEW !== 'hotels') return show('hotels'); }
// Android back (the app asks the page first): close the top layer, then go up a screen; false = on the home list
window.SAback = () => {
  if(!$('#app') || $('#app').hidden) return false;
  if(LAYERS){ popLayer(); return true; }
  if(SUB[VIEW] || VIEW !== 'hotels'){ goBack(); return true; }
  return false;
};

async function loadHotels(){ const j = await api('/api/admin/hotels'); HOTELS = j.hotels; UNREAD = j.ticketsUnread || 0; }

// ---------------- hotels (simple list) ----------------
const DAYMS = 864e5;
// Counter licence from the hotel's data: 'lifetime' or a date (ISO)
const licDays = h => h.lic === 'lifetime' ? Infinity : h.lic ? Math.ceil((Date.parse(h.lic) - Date.now()) / DAYMS) : null;
const payDays = h => h.paid_until ? Math.ceil((h.paid_until - Date.now()) / DAYMS) : null;
const staleH = h => h.seen ? (Date.now() - h.seen) / 36e5 : 1e9;
const telHref = p => 'tel:' + String(p || '').replace(/[^\d+]/g, '');
const waHref = (p, name) => { let d = String(p || '').replace(/\D/g, ''); if(d.length === 10) d = '91' + d;
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent('Hello ' + (name || '') + ', this is Aghanya Devanya Enterprises (Setu POS).'); };
const AVC = ['#2563eb', '#7c3aed', '#db2777', '#ea580c', '#0d9488', '#4f46e5', '#0891b2', '#65a30d'];
const avatar = h => `<div class="av" style="background:${AVC[[...String(h.code)].reduce((a, c) => a + c.charCodeAt(0), 0) % AVC.length]}">${esc((h.name || h.code || '?').trim()[0].toUpperCase())}</div>`;
// One plain word for how the hotel's Setu is right now
function appState(h){
  if(h.status === 'pending' || state(h) === 'pending') return ['Pending Activation', 'warn'];
  const d = licDays(h);
  if(state(h) === 'suspended') return ['Suspended', 'off'];
  if(+h.lockv === 2) return ['Locked', 'bad'];
  if(d !== null && d !== Infinity && d < 0) return ['Licence expired', 'bad'];
  if(+h.lockv === 1) return ['Warning', 'warn'];
  return ['Active', 'ok'];
}
// Usage: bills per day from the counter (registry bdays / ball / lastbill), days in IST like the bills
const istDay = (ms = Date.now()) => new Date(ms + 330 * 60000).toISOString().slice(0, 10);
const bdays = h => { try{ return JSON.parse(h.bdays || '{}') || {}; }catch(e){ return {}; } };
const billsToday = h => +bdays(h)[istDay()] || 0;
const bills7 = h => { const b = bdays(h), from = istDay(Date.now() - 6 * DAYMS); return Object.keys(b).filter(k => k >= from).reduce((a, k) => a + (+b[k] || 0), 0); };
// Days since the last bill (null = no bill ever); a hotel joined less than 3 days ago is not "idle" yet
const idleDays = h => h.lastbill ? Math.floor((Date.parse(istDay()) - Date.parse(h.lastbill)) / DAYMS) : null;
const notUsing = h => state(h) !== 'suspended' && Date.now() - h.created > 3 * DAYMS && (idleDays(h) === null || idleDays(h) >= 3);
// Last 7 days as small bars (oldest left, today right)
function billBars(h){
  const b = bdays(h), days = [...Array(7)].map((_, i) => istDay(Date.now() - (6 - i) * DAYMS)), max = Math.max(1, ...days.map(d => +b[d] || 0));
  const wd = d => ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'][new Date(d + 'T12:00:00Z').getUTCDay()];
  return `<div style="display:flex;gap:6px;align-items:flex-end;height:74px;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--card)">
    ${days.map(d => { const n = +b[d] || 0; return `<div style="flex:1;text-align:center;font-size:10px;color:var(--muted)"><div style="font-weight:700;color:var(--ink)">${n}</div>
      <div style="height:${Math.round(34 * n / max) + 2}px;border-radius:4px;background:${n ? 'var(--pri)' : 'var(--line)'};margin:2px 0"></div>${wd(d)}</div>`; }).join('')}</div>`;
}
const billTag = h => { const t = billsToday(h), w = bills7(h);
  return `<span class="tag ${t ? 'ok' : notUsing(h) ? 'bad' : ''}">Today ${t} bills · 7 days ${w}</span>`; };

// Hotels that need you come first: licence running out, no backup, open tickets
function urgency(h){
  const d = licDays(h), p = payDays(h);
  let u = 0;
  if(d !== null && d !== Infinity){ if(d < 0) u = 200; else if(d <= 5) u = 150 - d; }
  if(p !== null && state(h) !== 'suspended' && h.plan !== 'counter'){ if(p < 0) u = Math.max(u, 120); else if(p <= 5) u = Math.max(u, 100 - p); }
  if(h.tickets) u = Math.max(u, 90);
  if(staleH(h) > 48 && h.seen) u = Math.max(u, 50);
  if(notUsing(h)) u = Math.max(u, 60);
  if(+h.errs) u = Math.max(u, 55);
  return u;
}
let KF = 'all';
const KF_ICON = {all: 'hotels', need: 'warn', locked: 'lock', tk: 'ticket', idle: 'pause', err: 'block', stale: 'cloud'};
const KFS = {all: ['All', () => true], pending: ['Pending Activation', h => h.status === 'pending' || state(h) === 'pending'], need: ['Needs attention', h => urgency(h) > 0], locked: ['Locked / Suspended', h => +h.lockv === 2 || state(h) === 'suspended'],
  tk: ['Tickets', h => h.tickets > 0], idle: ['No bills (3+ days)', notUsing], err: ['Errors (24 hours)', h => +h.errs > 0], stale: ['No backup', h => staleH(h) > 48]};
function setKF(k){ KF = k; drawHotelsBody(); const t = $('.sec b'); if(t) t.textContent = k === 'all' ? 'All hotels' : KFS[k][0]; haptic('tick'); }
async function drawHotels(){
  await loadHotels();
  const live = HOTELS.filter(h => state(h) !== 'suspended'), today = HOTELS.reduce((a, h) => a + billsToday(h), 0), using = live.filter(h => billsToday(h) > 0).length;
  const idle = HOTELS.filter(notUsing).length, errs = HOTELS.filter(h => +h.errs).length;
  // Bills of all hotels for the last 7 days (oldest left) for the banner's small chart
  const days7 = [...Array(7)].map((_, i) => istDay(Date.now() - (6 - i) * DAYMS)), tot7 = days7.map(d => HOTELS.reduce((a, h) => a + (+bdays(h)[d] || 0), 0)), mx = Math.max(1, ...tot7);
  $('#main').innerHTML = `<div class="hello"><small>Welcome back, Admin</small><h1>All Your Hotels<br><span>One Place.</span></h1></div>
    <div class="search">${ic('search')}<input id="q" type="search" placeholder="Search name, code, mobile or Install ID"></div><div id="kpis"></div>
    <div class="sum"><div style="flex:1;position:relative;z-index:1"><div class="eyebrow">TODAY'S BILLS</div><div class="big">${today} <span style="font-size:15px;font-weight:500">bills</span></div>
      <small>${using} / ${live.length} hotels billed today${idle ? ` · <b class="err" onclick="setKF('idle')">${idle} idle (3+ days)</b>` : ''}${errs ? ` · <b class="err" onclick="setKF('err')">${errs} ${errs === 1 ? 'hotel' : 'hotels'} with errors</b>` : ''}</small>
      <br><button class="go" onclick="show('keygen')">${ic('key')} Create key</button></div>
      <div class="bars7" title="Last 7 days">${tot7.map(n => `<i class="${n ? '' : 'z'}" style="height:${Math.round(70 * n / mx) + 8}px"></i>`).join('')}</div></div>
    <div class="sec"><b>${KF === 'all' ? 'All hotels' : esc(KFS[KF][0])}</b><a onclick="setKF('all')">View all</a></div><div id="cards"></div>
    <button class="fab" onclick="show('add')">${ic('plus')}<span>New hotel</span></button>`;
  $('#q').oninput = drawCards;
  drawHotelsBody();
}
function drawHotelsBody(){
  $('#kpis').innerHTML = `<div class="chips">${Object.entries(KFS).map(([k, [l, f]]) => `<button class="chip ${KF === k ? 'on' : ''}" onclick="setKF('${k}')">${ic(KF_ICON[k])}<span>${l}</span><b>${HOTELS.filter(f).length}</b></button>`).join('')}</div>`;
  drawCards();
}
function hotelAlert(h){
  const d = licDays(h);
  if(d !== null && d !== Infinity && d < 0) return ['bad', 'Licence ' + d8(Date.parse(h.lic)) + ' — expired'];
  if(d !== null && d !== Infinity && d <= 5) return ['warn', 'Licence ends in ' + d + ' days (' + d8(Date.parse(h.lic)) + ')'];
  if(h.tickets) return ['warn', h.tickets + ' new ticket messages'];
  if(+h.errs){ const e = lastErr(h); return ['bad', `${h.errs} errors (24 hours)${e ? ' · ' + e.kya : ''}`]; }
  if(notUsing(h)) return ['bad', idleDays(h) === null ? 'No bill made yet' : `No bills for ${idleDays(h)} days (last ${d8(Date.parse(h.lastbill))}) — talk to the client`];
  if(h.seen && staleH(h) > 48) return ['warn', 'No data from the PC since ' + ago(h.seen)];
  return null;
}
function licTag(h){
  const d = licDays(h);
  if(d === Infinity) return '<span class="tag ok">Lifetime</span>';
  if(d === null) return '<span class="tag">Licence -</span>';
  return `<span class="tag ${d < 0 ? 'bad' : d <= 5 ? 'warn' : 'ok'}">Licence ${d < 0 ? 'expired' : d + ' days'}</span>`;
}
// Setu version on the hotel's counter PC; older than the newest one seen = needs the new EXE
const verNum = v => String(v || '').split('.').map(n => +n || 0).reduce((a, n) => a * 10000 + n, 0);
const newestVer = () => HOTELS.reduce((m, h) => verNum(h.appv) > verNum(m) ? h.appv : m, '');
const verTag = h => !h.appv ? '<span class="tag">Version -</span>' : `<span class="tag ${verNum(h.appv) < verNum(newestVer()) ? 'warn' : ''}">v${esc(h.appv)}${verNum(h.appv) < verNum(newestVer()) ? ' · outdated' : ''}</span>`;
// Error Log from the hotel's devices (D.errSync): count in 24 hours + the newest error
const lastErr = h => { try{ return h.lasterr ? JSON.parse(h.lasterr) : null; }catch(e){ return null; } };
const errTag = h => +h.errs ? `<span class="tag bad">${h.errs} error</span>` : '';
const seenTag = h => `<span class="tag ${!h.seen ? 'bad' : staleH(h) > 48 ? 'warn' : ''}">${h.seen ? 'Sync ' + ago(h.seen) : 'Not synced yet'}</span>`;
function drawCards(){
  const q = ($('#q').value || '').trim().toLowerCase();
  const list = HOTELS.filter(KFS[KF][1]).filter(h => !q || [h.name, h.code, h.phone, h.owner, h.iid || ''].join(' ').toLowerCase().includes(q))
    .sort((a, b) => urgency(b) - urgency(a) || b.created - a.created);
  const clearBtn = KF === 'err' && list.length ? `<button class="bad" style="width:100%;margin-bottom:12px" onclick="errClearEvery()">${ic('trash')} Clear errors in all hotels</button>` : '';
  $('#cards').innerHTML = clearBtn + list.map(h => {
    const [sl, sc] = appState(h), al = hotelAlert(h);
    return `<div class="hc" onclick="hotelSheet('${esc(h.code)}')"><div class="top">${avatar(h)}
        <div class="mid"><b class="nm">${esc(h.name)}</b><small>${esc(h.code)}${h.owner ? ' · ' + esc(h.owner) : ''}</small></div><span class="st ${sc}">${sl}</span></div>
      <div class="tags">${errTag(h)}${billTag(h)}${licTag(h)}${seenTag(h)}${verTag(h)}${h.notice ? '<span class="tag warn">Message showing</span>' : ''}</div>
      ${al ? `<div class="strip ${al[0]}">${esc(al[1])}</div>` : ''}</div>`;
  }).join('') || `<div class="card muted" style="text-align:center">${KF === 'all' && !q ? 'No hotels yet. Install the EXE on a new PC and activate it with Keygen.' : 'Nothing in this list'}</div>`;
}

// ---------------- one hotel: big simple actions ----------------

      ${tile('msg', 'Recharge WA', (h.wa_credits ?? 0) + ' msgs', `waRechargePrompt('${C}')`, 'blue')}

const dlBackup = run(async code => {
  const r = await fetch('/api/admin/backup', {method: 'POST', headers: {'X-Setu-Admin': KEY, 'X-Setu-Otp': otpGet(), 'Content-Type': 'application/json'}, body: JSON.stringify({code})});
  if(!r.ok) throw new Error('Backup download failed (HTTP ' + r.status + ')');
  const blob = await r.blob(), name = `setu-${code}-backup.json`;
  // Setu Hotel Admin phone app: hand the file to Android (save to Files / send on WhatsApp, Gmail, Drive)
  if(window.SA && SA.save){
    const u = new Uint8Array(await blob.arrayBuffer());
    let bin = '';
    for(let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    SA.save(name, 'application/json', btoa(bin));
    return toast('Backup ready — choose where to save / send');
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Backup downloaded');
});

// ---------------- backups: one table for all hotels ----------------
let BKF = 'all';
const kb = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round((n || 0) / 1024)) + ' KB';
function bkState(h){
  const day = 864e5, seen = +h.seen || 0, bkAge = h.lastbk ? (Date.now() - Date.parse(h.lastbk)) / day : null;
  if(!seen) return ['never', 'Never synced', 'bad'];
  if(+h.offmode) return ['offline', 'Offline hotel', 'warn'];
  if(Date.now() - seen > 3 * day) return ['offline', 'Offline ' + Math.floor((Date.now() - seen) / day) + ' days', 'bad'];
  if(bkAge === null || bkAge > 3) return ['failed', 'No recent backup', 'bad'];
  if(Date.now() - seen > 2 * 3600e3) return ['delayed', 'Sync delayed', 'warn'];
  return ['ok', 'Backup OK', 'ok'];
}
async function drawBackups(){
  await loadHotels();
  const F = {all: 'All', ok: 'Backup OK', delayed: 'Sync delayed', offline: 'Offline', failed: 'No backup', never: 'Never synced'};
  const q = ($('#bk_q') && $('#bk_q').value || '').toLowerCase();
  const L = HOTELS.filter(h => (BKF === 'all' || bkState(h)[0] === BKF) && (!q || (h.name + ' ' + h.code + ' ' + (h.iid || '')).toLowerCase().includes(q)));
  $('#main').innerHTML = backBtn() + `<div class="card"><h2>Backups</h2>
    <p class="muted" style="margin-top:-6px">Each hotel keeps ${30} end-of-day backups on Hotel Setu Cloud (compressed). Tap a hotel to download its data.</p>
    <input id="bk_q" placeholder="Search name, code or Install ID" value="${esc(q)}" oninput="drawBackups()" style="margin-bottom:8px">
    <div class="chips">${Object.entries(F).map(([k, v]) => `<button class="chip ${BKF === k ? 'on' : ''}" onclick="BKF='${k}';drawBackups()">${v} ${HOTELS.filter(h => k === 'all' || bkState(h)[0] === k).length}</button>`).join('')}</div>
    </div><div class="group">
    ${L.map(h => { const st = bkState(h); return `<div class="lr click" onclick="dlBackup('${esc(h.code)}')">${avatar(h)}<div class="x"><b>${esc(h.name)}</b>
      <small>${esc(h.code)} · sync ${h.seen ? ago(h.seen) : '-'} · backup ${h.lastbk ? esc(h.lastbk) : '-'}</small><small>${+h.bkn || 0} backups · ${h.bksize ? kb(+h.bksize) : '-'}${h.dsize ? ` · live ${kb(+h.dsize)}` : ''}</small></div>
      <span class="tag ${st[2]}">${st[1]}</span></div>`; }).join('') || '<div class="lr muted">Nothing in this list</div>'}</div>`;
  const i = $('#bk_q'); if(q){ i.focus(); i.setSelectionRange(q.length, q.length); }
}

function drawAdd(){
  const tpl = Object.entries(META.templates).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join('');
  const tiers = Object.entries(META.tiers).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join('');
  $('#main').innerHTML = backBtn() + `<div class="card"><h2>Create New Hotel</h2>
    <p class="muted">Customer → Business Type → Plan → Features → Login. The hotel signs in the first time with the Hotel Code and this password, then builds its own data.</p>
    <form id="af"><div class="grid">
      <div><label>Hotel / Restaurant name *</label><input name="name" required></div>
      <div><label>Owner name *</label><input name="owner" required></div>
      <div><label>Mobile (10 digit) *</label><input name="phone" required pattern="[0-9]{10}" inputmode="numeric"></div>
      <div><label>Email</label><input name="email" type="email"></div>
      <div><label>GSTIN (optional)</label><input name="gstin" maxlength="15" style="text-transform:uppercase"></div>
      <div><label>Business Type (Template)</label><select name="businessType" id="a_type">${tpl}</select></div>
      <div><label>Plan</label><select name="tier" id="a_tier">${tiers}</select></div>
      <div><label>Days</label><input name="days" type="number" min="1" max="3650" value="${META.trialDays}"></div>
      <div><label>Payment</label><select name="paid"><option value="">Free trial</option><option value="1">Paid (cash / UPI received)</option></select></div>
      <div><label>Owner initial password (6+ characters) *</label><input name="password" required minlength="6"></div>
    </div><div class="row" style="margin-top:12px"><button>Create Hotel</button><span id="ares"></span></div></form></div>`;
  $('#a_type').onchange = () => $('#a_tier').value = META.templates[$('#a_type').value].tier;
  $('#a_type').onchange();
  $('#af').onsubmit = run(async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    f.paid = !!f.paid;

    $('#ares').innerHTML = '<span class="muted">Creating…</span>';

      <div class="card" style="background:var(--soft)" id="newmsg">Setu POS (mobile) — ${esc(f.name)}<br>1. Install <b>SetuPOS.apk</b>.<br>2. Open the app → <b>Over the internet (Hotel Setu Cloud)</b> → Open Cloud.<br>

      <div class="row" style="margin-bottom:8px"><button class="okb" onclick="shareText($('#newmsg').innerText)">WhatsApp / Share</button><button class="g" onclick="copyText($('#newmsg').innerText, 'Message')">Copy</button></div>

  });
}

    </div><div class="row" style="margin-top:12px"><button onclick="update({rules:{maxDiscPct:r_disc.value,phoneAbove:r_phone.value}}, 'Rules saved')">Save rules</button></div>
    <p class="muted">Rules apply to every device of the hotel; cashiers cannot change them in Settings.</p>`;
}

function tabDomains(){
  const h = CUR;
  $('#tab').innerHTML = `
    <table><tr><th>Domain</th><th>Type</th><th>Status</th><th></th></tr>
    ${(h.domains || []).map(d => `<tr><td><b>${esc(d.host)}</b>${d.status === 'active' ? ` <a href="https://${esc(d.host)}/hotel_erp.html" target="_blank" rel="noopener">open</a>` : ''}</td><td>${d.kind === 'sub' ? 'Subdomain' : 'Custom'}</td><td>${pill(d.status)}</td>
      <td class="row">${d.kind === 'custom' ? `<button class="g" onclick="checkDomain('${esc(d.host)}')">Check Status</button>` : ''}<button class="bad" onclick="removeDomain('${esc(d.host)}')">Remove</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">No domains — the hotel signs in with its Hotel Code</td></tr>'}</table>
    <div id="dns"></div>
    <h3>Subdomain ${META.baseDomain ? `(<code>xxx.${esc(META.baseDomain)}</code>)` : ''}</h3>
    ${META.baseDomain ? `<div class="row"><input id="d_slug" placeholder="royal" style="width:180px"><span>.${esc(META.baseDomain)}</span><button onclick="addDomain('sub', d_slug.value)">Add</button></div>`
      : '<p class="muted">Set BASE_DOMAIN (your Cloudflare domain) in wrangler.toml.</p>'}
    <h3>Hotel custom domain</h3>
    ${META.customDomains ? `<div class="row"><input id="d_host" placeholder="erp.hotelroyal.com" style="width:260px"><button onclick="addDomain('custom', d_host.value)">Add</button></div>
      <p class="muted">If the hotel already has a website, use a subdomain such as <code>erp.</code> — do not replace the main site.</p>`
      : '<p class="muted">Requires Cloudflare for SaaS: secrets CF_API_TOKEN + CF_ZONE_ID and var SAAS_CNAME_TARGET.</p>'}`;
}
function dnsTable(j){
  if(!j.records || !j.records.length) return '';
  return `<div class="card" style="background:var(--soft);margin-top:10px"><b>Add these DNS records at the hotel domain provider:</b>
    <table><tr><th>Type</th><th>Name</th><th>Value</th></tr>${j.records.map(r => `<tr><td>${esc(r.type)}</td><td><code>${esc(r.name)}</code></td><td><code>${esc(r.value)}</code></td></tr>`).join('')}</table>
    <p class="muted">The domain goes live once verification and HTTPS are ready (${esc(j.cf || 'pending')} / ssl ${esc(j.ssl || 'pending')}).</p></div>`;
}
const addDomain = run(async (kind, value) => {
  const j = await api('/api/admin/domain/add', {code: CUR.code, kind, value});
  CUR = await api('/api/admin/hotel', {code: CUR.code});
  tabDomains();
  $('#dns').innerHTML = dnsTable(j);
  toast(j.status === 'active' ? 'Domain live: ' + j.host : 'Add the DNS records, then check the status');
});
const checkDomain = run(async host => {
  const j = await api('/api/admin/domain/check', {code: CUR.code, host});
  CUR = await api('/api/admin/hotel', {code: CUR.code});
  tabDomains();
  $('#dns').innerHTML = dnsTable(j);
});
const removeDomain = run(async host => {
  if(!await ask('Remove ' + esc(host) + '?', '<p class="muted" style="margin-top:0">Setu will no longer open from that address.</p>', 'Remove', true)) return;
  await api('/api/admin/domain/remove', {code: CUR.code, host});
  CUR = await api('/api/admin/hotel', {code: CUR.code});
  tabDomains();
});

function tabSupport(){
  $('#tab').innerHTML = `<p>Support Access gives you <b>read-only</b> access to the hotel Setu (nothing is saved). The link expires automatically, and the hotel can see in Settings when support viewed it.</p>
    <div class="grid"><div><label>Duration</label><select id="s_min"><option value="30">30 minutes</option><option value="60" selected>1 hour</option><option value="120">2 hours</option></select></div>
      <div style="grid-column:span 2"><label>Reason (visible to the hotel)</label><input id="s_why" maxlength="120" placeholder="e.g. checking a GST report issue" style="width:100%"></div></div>
    <div class="row" style="margin-top:10px"><button onclick="supportOpen()">Create Support Link</button></div><div id="s_out"></div>
    <h3>Previous Support Access</h3>
    ${(CUR.supportLog || []).map(x => `<div>${dt(x.at)} · ${x.minutes} min · ${esc(x.reason || '')}</div>`).join('') || '<p class="muted">Never</p>'}
    <h3>Lost keys</h3>
    <p class="muted">New Counter PC Sync Key: the old key stops working; enter the new one on the counter PC (Settings → Hotel Setu Cloud Sync). Owner password: Overview tab.</p>
    <div class="row"><input id="k_set" placeholder="Current Sync Key (40 characters)" maxlength="40" style="min-width:300px"><button class="g" onclick="setSyncKey()">Record This Key</button></div>
    <div class="row" style="margin-top:8px"><button onclick="newSyncKey()">New Counter PC Sync Key</button></div>
    <div id="k_out"></div>`;
}
const newSyncKey = run(async () => {
  if(!await ask('New Sync Key?', '<p class="muted" style="margin-top:0">The counter PC must be updated with it.</p>', 'Create')) return;
  const j = await api('/api/admin/hotel', {code: CUR.code, update: {newSyncKey: true}});
  $('#k_out').innerHTML = `<p>Hotel Code: <b>${esc(CUR.code)}</b><br>New Sync Key (shown only now): <b style="font-family:monospace">${esc(j.syncKey || '')}</b></p>`;
});
const setSyncKey = run(async () => {
  const k = $('#k_set').value.trim();
  if(!k) return;
  CUR = await api('/api/admin/hotel', {code: CUR.code, update: {setSyncKey: k}});
  toast('Sync Key recorded');
  TAB = 'overview'; drawHotel();
});
const ownerPw2 = run(async () => {
  const pw = $('#o_pw2').value.trim();
  if(!pw) return;
  if(!await ask('New owner password for ' + esc(CUR.name) + '?', '', 'Set')) return;
  CUR = await api('/api/admin/hotel', {code: CUR.code, update: {ownerPassword: pw}});
  toast('Owner password set — tell the owner: ' + pw);
  drawHotel();
});
const supportOpen = run(async () => {
  if(!$('#s_why').value.trim()) return toast('Please enter a reason (visible to the hotel)', true);
  const j = await api('/api/admin/support', {code: CUR.code, minutes: +$('#s_min').value, reason: $('#s_why').value});
  $('#s_out').innerHTML = `<p class="ok">Link created (${j.minutes} min): <a href="${esc(j.url)}" target="_blank" rel="noopener">Open the hotel Setu</a></p>`;
});

const tabLog = run(async () => { $('#tab').innerHTML = await drawAudit(CUR.code); });

const askThen = run(async (msg, fn) => { if(await ask(msg, '', 'Yes')) await fn(); });
// Close every open layer at once (e.g. jumping to Keygen from a hotel)
function closeAll(){
  if(ASK){ const r = ASK; ASK = null; r(null); }
  $('#ask').classList.remove('open', 'in'); $('#sheet').classList.remove('open', 'in');
  if($('#drawer').style.display === 'block'){ $('#drawer').classList.remove('in'); $('#drawer').style.display = 'none'; CUR = null; }
  const n = LAYERS; LAYERS = 0;
  if(n) try{ history.go(-n); }catch(e){}
}

// ---------------- feel of a phone app ----------------
// App bar lifts (white + line) once the list scrolls under it; the FAB shrinks to an icon while scrolling down
let lastY = 0;
function onScroll(){
  const y = window.scrollY, h = $('#hdr'), lifted = y > 8;
  if(h && h.classList.contains('lifted') !== lifted){ h.classList.toggle('lifted', lifted); if(!$('#drawer').classList.contains('in')) bars(lifted ? '#FFFFFF' : '#F7F9FC'); }
  // Small jitters do not count: only a real move up / down changes the button
  if(Math.abs(y - lastY) > 6){ const f = $('.fab'); if(f) f.classList.toggle('mini', y > lastY && y > 80); lastY = y; }
}
window.addEventListener('scroll', onScroll, {passive: true});
// Touch ripple on everything you can press
document.addEventListener('pointerdown', e => {
  let b = e.target.closest('button, .hc, .li, .tile, .quick a, .lr.click, .plan, .chip');
  if(!b || b.disabled || e.target.closest('input, select, textarea')) return;
  if(b.matches('nav button')) b = b.querySelector('.pill');
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), sp = document.createElement('span');
  sp.className = 'ripple';
  sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  if(getComputedStyle(b).position === 'static') b.style.position = 'relative';
  b.style.overflow = 'hidden';
  b.appendChild(sp);
  setTimeout(() => sp.remove(), 550);
}, {passive: true});
// Pull down at the top of a list to refresh it
let PT = null;
document.addEventListener('touchstart', e => {
  PT = !$('#app').hidden && !LAYERS && window.scrollY <= 0 && e.touches.length === 1 && !e.target.closest('.chips, input, textarea, select') ? {y: e.touches[0].clientY, d: 0} : null;
}, {passive: true});
document.addEventListener('touchmove', e => {
  if(!PT) return;
  PT.d = Math.max(0, e.touches[0].clientY - PT.y);
  const d = Math.min(PT.d * .5, 110), p = $('#ptr');
  p.style.transition = 'none';
  p.style.opacity = Math.min(1, d / 60);
  p.style.transform = `translateY(${d - 60}px) rotate(${d * 3}deg)`;
}, {passive: true});
document.addEventListener('touchend', () => {
  if(!PT) return;
  const p = $('#ptr'), go = PT.d * .5 > 70;
  PT = null;
  p.style.transition = 'transform .25s, opacity .25s';
  if(!go){ p.style.opacity = 0; p.style.transform = 'translateY(-70px)'; return; }
  haptic('tick');
  p.style.transform = 'translateY(16px)'; p.classList.add('spin');
  show(VIEW).finally(() => { p.classList.remove('spin'); p.style.opacity = 0; p.style.transform = 'translateY(-70px)'; });
});
// Bottom sheet: swipe down on it (when scrolled to its top) to close
(() => {
  const box = $('#sheet .box'); let y0 = null, dy = 0;
  box.addEventListener('touchstart', e => { y0 = box.scrollTop <= 0 && !e.target.closest('input, textarea, select') ? e.touches[0].clientY : null; dy = 0; }, {passive: true});
  box.addEventListener('touchmove', e => {
    if(y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if(dy > 0){ box.classList.add('drag'); box.style.transform = `translateY(${dy}px)`; }
  }, {passive: true});
  box.addEventListener('touchend', () => {
    if(y0 === null) return;
    box.classList.remove('drag'); box.style.transform = '';
    if(dy > 110){ haptic('tick'); closeSheet(); }
    y0 = null;
  });
})();

// ---------------- start ----------------
function logout(){ keyForget(); try{ localStorage.removeItem('setu_admin_otp'); }catch(e){} location.reload(); }
async function openPanel(){
  try{
    META = await api('/api/admin/meta');
    try{ sessionStorage.setItem('setu_admin', KEY); }catch(e){}
    if(!$('#remember') || $('#remember').checked) keyRemember(KEY);
    $('#login').hidden = true;
    $('#app').hidden = false;
    show('hotels');   // like Library ERP: open on the list, most urgent first
  }catch(e){
    // A remembered key that no longer works must not keep trying (it would lock this device)
    if(/Invalid Admin Key/.test(e.message)){ keyForget(); KEY = ''; }
    $('#lerr').textContent = e.message;
    haptic('error');
    try{ if(APP && SA.ready) SA.ready(); }catch(x){}
  }
}
$('#lf').onsubmit = e => { e.preventDefault(); KEY = $('#key').value.trim(); openPanel(); };
$('#drawer').onclick = e => { if(e.target.id === 'drawer') closeHotel(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape' && LAYERS) popLayer(); });
bars('#F7F9FC');
if(KEY) openPanel();
else try{ if(APP && SA.ready) SA.ready(); }catch(e){}
</script>
