<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Setu Hotel Admin</title>
<link rel="manifest" href="admin.webmanifest">
<meta name="theme-color" content="#1e3a8a">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{ --bg:#f3f5f9; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e5e9f0; --pri:#2563eb; --pri-ink:#fff; --brand:#1e3a8a; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; --soft:#f8fafc; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif }
  svg.i{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none }
  header{ padding:14px 16px 16px; padding-top:max(14px, env(safe-area-inset-top)); background:linear-gradient(135deg, #1e3a8a, #2563eb); color:#fff; position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px }
  header .t{ flex:1; min-width:0 } header h1{ font-size:18px; margin:0 } header small{ opacity:.8; font-size:12px }
  header button{ background:#ffffff26; color:#fff; border:0; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; padding:0 }
  h2{ font-size:17px; margin:0 0 10px } h3{ font-size:14px; margin:16px 0 8px }
  nav{ display:flex; position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); z-index:6; padding-bottom:env(safe-area-inset-bottom) }
  nav button{ flex:1; background:transparent; color:var(--muted); border:0; border-radius:0; padding:8px 2px 9px; font-size:11px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:2px; position:relative }
  nav button svg.i{ width:22px; height:22px } nav button.on{ color:var(--pri) }
  nav .badge{ position:absolute; top:4px; left:calc(50% + 6px) }
  main{ padding:14px 14px 96px; max-width:760px; margin:0 auto }
  input, button, select, textarea{ font:inherit; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); max-width:100% }
  input:focus, select:focus, textarea:focus{ outline:2px solid #bfdbfe; border-color:var(--pri) }
  button{ cursor:pointer; background:var(--pri); color:var(--pri-ink); border:0; font-weight:600 }
  button.g{ background:var(--card); color:var(--ink); border:1px solid var(--line) }
  button.bad{ background:var(--bad); color:#fff } button.okb{ background:var(--ok); color:#fff }
  button.big{ width:100%; padding:14px; font-size:16px; border-radius:14px }
  button:disabled{ opacity:.5; cursor:default }
  label{ display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; font-weight:600 }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px }
  .muted{ color:var(--muted) } .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .err{ color:var(--bad); font-weight:600 } .ok{ color:var(--ok); font-weight:600 }
  code{ font:12px ui-monospace, Consolas, monospace; background:var(--soft); padding:2px 6px; border-radius:6px; word-break:break-all }
  .badge{ background:var(--bad); color:#fff; border-radius:20px; font-size:10px; padding:1px 6px; font-weight:700 }
  /* hotels list */
  .search{ display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:0 12px; margin-bottom:10px; color:var(--muted) }
  .search input{ border:0; flex:1; padding:12px 0; outline:0 }
  .chips{ display:flex; gap:8px; overflow-x:auto; margin:0 -14px 12px; padding:0 14px; scrollbar-width:none } .chips::-webkit-scrollbar{ display:none }
  .chip{ flex:none; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:99px; padding:7px 14px; font-size:13px; font-weight:600 }
  .chip.on{ background:var(--ink); color:#fff; border-color:var(--ink) } .chip b{ margin-left:4px; opacity:.7 }
  .hc{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:10px; cursor:pointer }
  .hc:active{ transform:scale(.99) }
  .hc .top{ display:flex; align-items:center; gap:12px }
  .av{ width:42px; height:42px; border-radius:12px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:17px; flex:none }
  .hc .mid{ flex:1; min-width:0 } .hc b.nm{ display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .hc small{ color:var(--muted); font-size:12px }
  .tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px }
  .tag{ font-size:11px; font-weight:600; padding:3px 8px; border-radius:8px; background:var(--soft); color:var(--muted) }
  .tag.ok{ background:#dcfce7; color:#166534 } .tag.warn{ background:#fef3c7; color:#92400e } .tag.bad{ background:#fee2e2; color:#991b1b }
  .st{ font-size:11px; font-weight:700; padding:4px 9px; border-radius:99px; white-space:nowrap }
  .st.ok{ background:#dcfce7; color:#166534 } .st.warn{ background:#fef3c7; color:#92400e } .st.bad{ background:#fee2e2; color:#991b1b } .st.off{ background:#e2e8f0; color:#334155 }
  .strip{ margin-top:8px; font-size:12px; font-weight:600; padding:6px 10px; border-radius:10px }
  .strip.warn{ background:#fef3c7; color:#92400e } .strip.bad{ background:#fee2e2; color:#991b1b }
  /* one hotel */
  .hero{ display:flex; gap:12px; align-items:center; margin-bottom:12px } .hero .av{ width:52px; height:52px; font-size:21px; border-radius:14px }
  .hero h2{ margin:0; font-size:18px }
  .quick{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px }
  .quick a{ display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; border-radius:14px; text-decoration:none; font-weight:700; background:var(--soft); color:var(--ink); border:1px solid var(--line) }
  .quick a.wa{ background:#16a34a; color:#fff; border-color:#16a34a }
  .facts{ border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:14px }
  .facts div{ display:flex; justify-content:space-between; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px } .facts div:last-child{ border-bottom:0 }
  .facts span{ color:var(--muted) } .facts b{ text-align:right }
  .tiles{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px }
  .tile{ background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:14px; padding:12px 6px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; font-weight:700; text-align:center; line-height:1.2 }
  .tile svg.i{ width:24px; height:24px } .tile small{ font-weight:500; color:var(--muted); font-size:10px }
  .tile.blue{ color:var(--pri) } .tile.red{ color:var(--bad) } .tile.amber{ color:var(--warn) } .tile.green{ color:var(--ok) }
  .tile.on{ background:#fef2f2; border-color:#fecaca }
  /* keygen */
  .plans{ display:grid; grid-template-columns:repeat(2, 1fr); gap:8px }
  .plan{ background:var(--card); color:var(--ink); border:2px solid var(--line); border-radius:14px; padding:12px; text-align:left; font-weight:700 }
  .plan small{ display:block; color:var(--muted); font-weight:500; font-size:11px } .plan.on{ border-color:var(--pri); background:#eff6ff }
  .keybox{ font:13px/1.5 ui-monospace, Consolas, monospace; background:#0f172a; color:#e2e8f0; padding:12px; border-radius:12px; word-break:break-all; user-select:all }
  .steps{ margin:0; padding-left:20px } .steps li{ margin:4px 0 }
  .switch{ display:flex; align-items:center; gap:10px; margin-top:12px; font-size:14px } .switch input{ width:20px; height:20px }
  /* lists */
  .li{ display:flex; align-items:center; gap:12px; padding:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:8px; cursor:pointer; font-weight:600; width:100%; color:var(--ink); text-align:left }
  .li .ico{ width:38px; height:38px; border-radius:11px; display:grid; place-items:center; background:#eff6ff; color:var(--pri) } .li > span:not(.ico){ flex:1 } .li .ico{ flex:none } .li small{ display:block; color:var(--muted); font-weight:500; font-size:12px }
  .msg{ max-width:85%; padding:8px 11px; border-radius:12px; margin:6px 0; white-space:pre-wrap } .msg.hotel{ background:var(--soft); border:1px solid var(--line) } .msg.admin{ background:#dcfce7; color:#14532d; margin-left:auto }
  .msg small{ display:block; color:var(--muted); font-size:11px }
  /* sheets */
  #sheet, #ask{ position:fixed; inset:0; background:rgba(15,23,42,.5); display:none; z-index:15; align-items:flex-end; justify-content:center }
  #ask{ z-index:30; align-items:center; padding:16px }
  #sheet.open, #ask.open{ display:flex }
  #sheet .box{ background:var(--bg); width:100%; max-width:640px; border-radius:20px 20px 0 0; max-height:94vh; overflow:auto; padding:10px 16px 24px; padding-bottom:max(24px, env(safe-area-inset-bottom)) }
  #sheet .grab{ width:42px; height:5px; border-radius:9px; background:#cbd5e1; margin:0 auto 12px }
  #ask .box{ background:var(--card); width:100%; max-width:420px; border-radius:18px; padding:18px }
  #sheet textarea, #sheet input, #sheet select, #ask textarea, #ask input{ width:100% }
  .btns{ display:flex; gap:8px; margin-top:14px } .btns button{ flex:1; padding:12px }
  #toast{ position:fixed; bottom:84px; left:50%; transform:translateX(-50%); background:#0f172a; color:#fff; padding:10px 16px; border-radius:12px; display:none; z-index:40; max-width:90vw; text-align:center; font-size:14px }
  #toast.err{ background:var(--bad) }
  /* login */
  #login{ max-width:400px; margin:0 auto; padding:10vh 16px 0 }
  #login input{ width:100% }
  /* advanced (old full settings) */
  .grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px }
  .grid > div > input, .grid > div > select{ width:100% }
  .stats{ display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:12px }
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px }
  .stat b{ display:block; font-size:21px }
  table{ width:100%; border-collapse:collapse }
  th, td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle }
  th{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em }
  tr.click{ cursor:pointer }
  .pill{ padding:2px 8px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap }
  .p-active{ background:#dcfce7; color:#166534 } .p-trial{ background:#e0f2fe; color:#075985 }
  .p-expired{ background:#fee2e2; color:#991b1b } .p-suspended{ background:#e2e8f0; color:#334155 } .p-pending{ background:#fef3c7; color:#92400e }
  .h-ok{ background:#dcfce7; color:#166534 } .h-warn{ background:#fef3c7; color:#92400e } .h-bad{ background:#fee2e2; color:#991b1b }
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin:12px 0; overflow-x:auto }
  .tabs button{ background:transparent; color:var(--muted); border-radius:10px 10px 0 0; white-space:nowrap }
  .tabs button.on{ color:var(--ink); background:var(--soft); border:1px solid var(--line); border-bottom-color:var(--soft) }
  .feat{ display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:12px; background:var(--soft) }
  .feat select{ margin-left:auto }
  .two{ display:grid; grid-template-columns:1fr 300px; gap:16px } @media (max-width:820px){ .two{ grid-template-columns:1fr } }
  .rcpt{ background:#fff; color:#000; font:12px/1.35 ui-monospace, Consolas, monospace; padding:10px; border:1px dashed #94a3b8; margin:0 auto }
  .rcpt .c{ text-align:center } .rcpt hr{ border:0; border-top:1px dashed #000 } .rcpt .r{ text-align:right } .rcpt td{ padding:1px 0; border:0 }
  #drawer{ position:fixed; inset:0; background:rgba(15,23,42,.55); display:none; z-index:20; overflow:auto; padding:16px 10px }
  #drawer .panel{ max-width:980px; margin:0 auto; background:var(--card); border-radius:16px; padding:16px; border:1px solid var(--line) }
</style>
</head>
<body>
<div id="login">
  <div style="text-align:center"><img src="icon-192.png" alt="" style="width:72px;height:72px;border-radius:18px;box-shadow:0 8px 24px #1e3a8a33">
    <h2 style="margin:14px 0 2px;font-size:21px">Setu Hotel Admin</h2>
    <p class="muted" style="margin:0 0 18px">Sab hotels ek jagah se chalaiye</p></div>
  <div class="card"><form id="lf"><label style="margin-top:0">Admin Key</label><input id="key" type="password" placeholder="Apni Admin Key daaliye" autocomplete="off" required>
    <label style="display:flex;gap:8px;align-items:center;margin:12px 0;font-size:13px;color:var(--ink);font-weight:500"><input id="remember" type="checkbox" style="width:20px;height:20px" checked> Is phone par yaad rakho</label>
    <button class="big">Kholo</button></form>
  <p id="lerr" class="err"></p></div>
  <p class="muted" style="text-align:center;font-size:12px">Aghanya Devanya Enterprises</p>
</div>

<div id="app" hidden>
  <header>
    <div class="t"><h1 id="htitle">Hotels</h1><small id="hsub">Setu Hotel Admin</small></div>
    <button onclick="show(VIEW)" title="Refresh" aria-label="Refresh"></button>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="drawer"><div class="panel" id="panel"></div></div>
<div id="sheet"><div class="box"><div class="grab"></div><div id="sbox"></div></div></div>
<div id="ask"><div class="box" id="abox"></div></div>
<div id="toast"></div>

<script>
let KEY = '', META = null, HOTELS = [], VIEW = 'hotels', CUR = null, TAB = 'overview';
// Remembered only on a device the vendor ticked (e.g. the Setu Admin phone app)
try{ KEY = sessionStorage.getItem('setu_admin') || localStorage.getItem('setu_admin') || ''; }catch(e){}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const d8 = ms => ms ? new Date(ms).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : '-';
const dt = ms => ms ? new Date(ms).toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '-';
const rs = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');
const state = h => h.status === 'suspended' ? 'suspended' : ((h.paid_until ?? h.paidUntil) < Date.now() && !h.lifetime ? 'expired' : h.status);
const pill = s => `<span class="pill p-${esc(s)}">${esc(s)}</span>`;
const ago = ms => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'abhi' : m < 60 ? m + ' min pehle' : m < 1440 ? Math.round(m / 60) + ' ghante pehle' : Math.round(m / 1440) + ' din pehle'; };
// Backup health = when the hotel's data last reached the cloud
const health = ms => !ms ? '<span class="pill h-bad">No backup yet</span>'
  : Date.now() - ms < 26 * 36e5 ? `<span class="pill h-ok">OK · ${ago(ms)}</span>`
  : Date.now() - ms < 72 * 36e5 ? `<span class="pill h-warn">${ago(ms)}</span>`
  : `<span class="pill h-bad">${ago(ms)}</span>`;
const backupIssue = h => state(h) !== 'suspended' && (!h.seen || Date.now() - h.seen > 48 * 36e5);

// Line icons (no external files)
const ICONS = {
  hotels: 'M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M10 21v-4h4v4',
  key: 'M14.5 4a5.5 5.5 0 1 1-4.3 8.9L4 19v-3h2.5v-2.5H9l1.2-1.2A5.5 5.5 0 0 1 14.5 4zM16 8h.01',
  ticket: 'M4 5h16v11H9l-5 4z',
  more: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',
  lock: 'M6 11h12v10H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3',
  unlock: 'M6 11h12v10H6zM8.5 11V8a3.5 3.5 0 0 1 6.8-1.2',
  warn: 'M12 3l9.5 17h-19zM12 10v4.5M12 17.5v.01',
  pause: 'M9 5v14M15 5v14',
  play: 'M8 5l11 7-11 7z',
  msg: 'M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12z',
  download: 'M12 4v11M7 10l5 5 5-5M5 20h14',
  user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 21a7.5 7.5 0 0 1 15 0',
  gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1',
  trash: 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13',
  phone: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z',
  copy: 'M9 9h11v11H9zM5 15V4h11',
  search: 'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20.5 20.5l-4.5-4.5',
  refresh: 'M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5',
  chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
  plus: 'M12 5v14M5 12h14',
  spark: 'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z',
  list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
  block: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM5.6 5.6l12.8 12.8',
  out: 'M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11',
  share: 'M18 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM6 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8.6 13.5l6.8 4M15.4 6.5l-6.8 4'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
document.querySelector('header button').innerHTML = ic('refresh');

function toast(t, bad){ const e = $('#toast'); e.textContent = t; e.className = bad ? 'err' : ''; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', bad ? 5000 : 2600); }
// Copy / share work in a browser and in the Setu Hotel Admin phone app (SA bridge)
function copyText(t, label){
  if(window.SA && SA.copy){ SA.copy(t); return toast((label || 'Text') + ' copy ho gaya'); }
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast((label || 'Text') + ' copy ho gaya'), () => {
    const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
    try{ document.execCommand('copy'); toast((label || 'Text') + ' copy ho gaya'); }catch(e){ toast('Copy nahi hua, haath se select karein', true); }
    a.remove(); });
}
function shareText(t){
  if(window.SA && SA.share) return SA.share(t);
  if(navigator.share) return navigator.share({text: t}).catch(() => {});
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}

async function api(path, body){
  const r = await fetch(path, {method: 'POST', headers: {'X-Setu-Admin': KEY, 'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  if(r.status === 401) throw new Error('Invalid Admin Key');
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
// Errors show in the page: the phone app has no native alert()
const run = fn => async (...a) => { try{ await fn(...a); }catch(e){ toast(e.message, true); } };

// ----- layers: Android back closes the top one -----
let LAYERS = 0;
function pushLayer(){ LAYERS++; try{ history.pushState({layer: LAYERS}, ''); }catch(e){} }
function popLayer(){ if(LAYERS > 0){ try{ history.back(); }catch(e){ closeTop(); } } }
function closeTop(){
  LAYERS = Math.max(0, LAYERS - 1);
  if($('#ask').classList.contains('open')) return askDone(null);
  if($('#drawer').style.display === 'block') return closeHotelNow();
  if($('#sheet').classList.contains('open')) return $('#sheet').classList.remove('open');
}
window.addEventListener('popstate', closeTop);

function sheet(html){ $('#sbox').innerHTML = html; if(!$('#sheet').classList.contains('open')){ $('#sheet').classList.add('open'); pushLayer(); } $('#sheet .box').scrollTop = 0; }
function closeSheet(){ if($('#sheet').classList.contains('open')) popLayer(); }
$('#sheet').onclick = e => { if(e.target.id === 'sheet') closeSheet(); };

// In-page confirm: resolves with the box's input values ({id: value}) on OK, null on cancel
let ASK = null;
function ask(title, html, ok, danger){
  $('#abox').innerHTML = `<h2>${title}</h2>${html || ''}<div class="btns"><button class="g" onclick="popLayer()">Cancel</button><button class="${danger ? 'bad' : ''}" id="ask-ok">${ok || 'OK'}</button></div>`;
  $('#ask').classList.add('open'); pushLayer();
  $('#ask-ok').onclick = () => {
    const v = {}; $('#abox').querySelectorAll('input, textarea, select').forEach(x => v[x.id] = x.type === 'checkbox' ? x.checked : x.value);
    // The box closes when its history entry is gone (popstate), so Android back stays in step
    const r = ASK; ASK = null; popLayer(); r && r(v);
  };
  return new Promise(res => ASK = res);
}

// ---------------- hotels (simple list) ----------------
const DAYMS = 864e5;
// Counter licence from the hotel's data: 'lifetime' or a date (ISO)
const licDays = h => h.lic === 'lifetime' ? Infinity : h.lic ? Math.ceil((Date.parse(h.lic) - Date.now()) / DAYMS) : null;
const payDays = h => h.paid_until ? Math.ceil((h.paid_until - Date.now()) / DAYMS) : null;
const staleH = h => h.seen ? (Date.now() - h.seen) / 36e5 : 1e9;
const telHref = p => 'tel:' + String(p || '').replace(/[^\d+]/g, '');
const waHref = (p, name) => { let d = String(p || '').replace(/\D/g, ''); if(d.length === 10) d = '91' + d;
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent('Namaste ' + (name || '') + ' ji, Aghanya Devanya Enterprises (Setu POS) se baat ho rahi hai.'); };
const AVC = ['#2563eb', '#7c3aed', '#db2777', '#ea580c', '#0d9488', '#4f46e5', '#0891b2', '#65a30d'];
const avatar = h => `<div class="av" style="background:${AVC[[...String(h.code)].reduce((a, c) => a + c.charCodeAt(0), 0) % AVC.length]}">${esc((h.name || h.code || '?').trim()[0].toUpperCase())}</div>`;
// One plain word for how the hotel's Setu is right now
function appState(h){
  const d = licDays(h);
  if(state(h) === 'suspended') return ['Suspended', 'off'];
  if(+h.lockv === 2) return ['Locked', 'bad'];
  if(d !== null && d !== Infinity && d < 0) return ['Licence khatam', 'bad'];
  if(+h.lockv === 1) return ['Warning', 'warn'];
  return ['Chal raha', 'ok'];
}
// Hotels that need you come first: licence running out, no backup, open tickets
function urgency(h){
  const d = licDays(h), p = payDays(h);
  let u = 0;
  if(d !== null && d !== Infinity){ if(d < 0) u = 200; else if(d <= 5) u = 150 - d; }
  if(p !== null && state(h) !== 'suspended' && h.plan !== 'counter'){ if(p < 0) u = Math.max(u, 120); else if(p <= 5) u = Math.max(u, 100 - p); }
  if(h.tickets) u = Math.max(u, 90);
  if(staleH(h) > 48 && h.seen) u = Math.max(u, 50);
  return u;
}
let KF = 'all';
const KFS = {all: ['Sab', () => true], need: ['Dhyan do', h => urgency(h) > 0], locked: ['Locked / Suspended', h => +h.lockv === 2 || state(h) === 'suspended'],
  tk: ['Tickets', h => h.tickets > 0], stale: ['Backup nahi', h => staleH(h) > 48]};
function setKF(k){ KF = k; drawHotelsBody(); }

}
function hotelAlert(h){
  const d = licDays(h);
  if(d !== null && d !== Infinity && d < 0) return ['bad', 'Licence ' + d8(Date.parse(h.lic)) + ' ko khatam ho gaya'];
  if(d !== null && d !== Infinity && d <= 5) return ['warn', 'Licence ' + d + ' din mein khatam (' + d8(Date.parse(h.lic)) + ')'];
  if(h.tickets) return ['warn', h.tickets + ' naya ticket message'];
  if(h.seen && staleH(h) > 48) return ['warn', 'PC se ' + ago(h.seen) + ' se data nahi aaya'];

}
function licTag(h){
  const d = licDays(h);

}
// Setu version on the hotel's counter PC; older than the newest one seen = needs the new EXE
const verNum = v => String(v || '').split('.').map(n => +n || 0).reduce((a, n) => a * 10000 + n, 0);
const newestVer = () => HOTELS.reduce((m, h) => verNum(h.appv) > verNum(m) ? h.appv : m, '');

const seenTag = h => `<span class="tag ${!h.seen ? 'bad' : staleH(h) > 48 ? 'warn' : ''}">${h.seen ? 'Sync ' + ago(h.seen) : 'Abhi sync nahi'}</span>`;

const dlBackup = run(async code => {
  const r = await fetch('/api/admin/backup', {method: 'POST', headers: {'X-Setu-Admin': KEY, 'Content-Type': 'application/json'}, body: JSON.stringify({code})});
  if(!r.ok) throw new Error('Backup download failed (HTTP ' + r.status + ')');
  const blob = await r.blob(), name = `setu-${code}-backup.json`;
  // Setu Hotel Admin phone app: hand the file to Android (save to Files / send on WhatsApp, Gmail, Drive)
  if(window.SA && SA.save){
    const u = new Uint8Array(await blob.arrayBuffer());
    let bin = '';
    for(let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    SA.save(name, 'application/json', btoa(bin));
    return toast('Backup ready — choose where to save / send');
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Backup downloaded');
});

  ({overview: tabOverview, features: tabFeatures, billing: tabBilling, rules: tabRules, domains: tabDomains, support: tabSupport, log: tabLog})[TAB]();
}

    ${(h.counter || {}).installId ? '' : `<p class="muted" style="margin:6px 0 0">Install ID appears here after the hotel's Setu connects: Setu → Settings (G) → Hotel Setu Cloud Sync → Hotel Code <b>${esc(h.code)}</b> + the Sync Key above → Save &amp; Connect.</p>`}

      <div class="stat"><span class="muted">Daily cloud backups</span><b>${h.backups.length}</b><span class="muted">${h.backups[0] ? 'Latest: ' + esc(h.backups[0]) : 'Starts from the 2nd day'}</span></div>

function tabFeatures(){
  const c = CUR.config, ov = c.overrides || {};
  const tiers = Object.entries(META.tiers).map(([k, v]) => `<option value="${k}" ${k === c.tier ? 'selected' : ''}>${esc(v.label)}</option>`).join('');
  const tpl = Object.entries(META.templates).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join('');
  const inTier = k => META.tiers[c.tier].features.includes(k);
  $('#tab').innerHTML = `
    <div class="row"><label style="margin:0">Plan</label><select id="f_tier">${tiers}</select>
      <button onclick="update({tier:f_tier.value}, 'Plan changed')">Plan Save</button>
      <span class="muted" style="margin-left:12px">Template:</span><select id="f_tpl">${tpl}</select>
      <button class="g" onclick="askThen('Apply this template? Features, bill template and rules go back to the template defaults.', () => update({applyTemplate:f_tpl.value}, 'Template applied'))">Apply Template</button></div>
    <h3>Feature Manager</h3>
    <p class="muted">"Per plan" follows the plan automatically. ON / OFF overrides it for this hotel only. The server does not save data for disabled modules.</p>
    <div class="grid">${Object.entries(META.features).map(([k, label]) => `<div class="feat">
      <span>${CUR.features[k] ? '✅' : '⛔'}</span><span>${esc(label)}</span>
      <select data-f="${k}"><option value="">Per plan (${inTier(k) ? 'ON' : 'OFF'})</option><option value="1" ${ov[k] === true ? 'selected' : ''}>ON</option><option value="0" ${ov[k] === false ? 'selected' : ''}>OFF</option></select></div>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button onclick="saveFeatures()">Features Save</button></div>`;
}
function saveFeatures(){
  const o = {};
  document.querySelectorAll('[data-f]').forEach(s => { if(s.value) o[s.dataset.f] = s.value === '1'; });
  update({overrides: o}, 'Features save — hotel par lag gaye');
}

function tabBilling(){
  const b = CUR.config.billing;
  $('#tab').innerHTML = `<div class="two"><div>
    <div class="grid">
      <div><label>Paper</label><select id="b_paper">${[['80', '80 mm Thermal'], ['58', '58 mm Thermal'], ['A6', 'A6 (105 × 148 mm)']].map(([v, l]) => `<option value="${v}" ${b.paper === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div><label>Logo URL (https, optional)</label><input id="b_logo" value="${esc(b.logoUrl)}" placeholder="https://..."></div>
      <div><label><input type="checkbox" id="b_showLogo" ${b.showLogo ? 'checked' : ''}> Logo dikhayein (A6 / print box)</label>
        <label><input type="checkbox" id="b_table" ${b.showTable ? 'checked' : ''}> Table No dikhayein</label>
        <label><input type="checkbox" id="b_cust" ${b.showCustomer ? 'checked' : ''}> Customer naam dikhayein</label></div>
      <div><label>Header line (below the name)</label><input id="b_head" value="${esc(b.headerNote)}" maxlength="100" placeholder="Pure Veg · Since 1998"></div>
      <div style="grid-column:1/-1"><label>Footer (blank = hotel setting)</label><input id="b_foot" value="${esc(b.footer)}" maxlength="200" style="width:100%"></div>
    </div>
    <h3>Custom Fields (bill par, max 6)</h3>

    <div class="row" style="margin-top:8px"><button class="g" onclick="addField()">+ Field</button><button onclick="saveBilling()">Billing Template Save</button></div>

  </div><div><label>Preview</label><div id="b_prev"></div></div></div>`;

  drawFields();

  $('#tab').addEventListener('change', preview);
}
let FIELDS = [];
function drawFields(){
  $('#b_fields').innerHTML = FIELDS.map((f, i) => `<div class="row" style="margin-bottom:6px">
    <input value="${esc(f.label)}" maxlength="30" placeholder="e.g. Vehicle No / Room No" oninput="FIELDS[${i}].label=this.value">
    <label style="margin:0"><input type="checkbox" ${f.required ? 'checked' : ''} onchange="FIELDS[${i}].required=this.checked"> Zaroori</label>
    <button class="g" onclick="FIELDS.splice(${i},1);drawFields()">Remove</button></div>`).join('') || '<p class="muted">No custom fields</p>';
  preview();
}
function addField(){ if(FIELDS.length < 6){ FIELDS.push({label: '', required: false}); drawFields(); } }
function billingForm(){
  return {paper: $('#b_paper').value, logoUrl: $('#b_logo').value.trim(), showLogo: $('#b_showLogo').checked, showTable: $('#b_table').checked,
    showCustomer: $('#b_cust').checked, headerNote: $('#b_head').value, footer: $('#b_foot').value, fields: FIELDS.filter(f => f.label.trim())};
}
function preview(){
  const b = billingForm(), w = {58: '200px', 80: '270px', A6: '300px'}[b.paper];
  const logo = b.showLogo && /^https:\/\//.test(b.logoUrl) ? `<div class="c"><img src="${esc(b.logoUrl)}" alt="" style="max-height:44px;max-width:70%"></div>` : '';
  $('#b_prev').innerHTML = `<div class="rcpt" style="width:${w}">${logo}<div class="c"><b>${esc(CUR.name)}</b></div><div class="c">Main Road, Shahar</div>
    ${b.headerNote ? `<div class="c">${esc(b.headerNote)}</div>` : ''}<hr><div class="c"><b>TAX INVOICE</b></div>
    <div>Bill No: #1024 &nbsp; 09/10/2026 8:15 PM</div>${b.showTable ? '<div>Table/Ref: <b>T-4</b></div>' : ''}${b.showCustomer ? '<div>Customer: Rahul</div>' : ''}
    ${b.fields.map(f => `<div>${esc(f.label)}: <b>……</b></div>`).join('')}<hr>
    <table style="width:100%"><tr><td>Paneer Tikka</td><td class="r">1</td><td class="r">240.00</td></tr><tr><td>Butter Naan</td><td class="r">4</td><td class="r">200.00</td></tr></table><hr>
    <table style="width:100%"><tr><td>Sub Total</td><td class="r">440.00</td></tr><tr><td>CGST @2.5%</td><td class="r">11.00</td></tr><tr><td>SGST @2.5%</td><td class="r">11.00</td></tr><tr><td><b>TOTAL</b></td><td class="r"><b>₹462.00</b></td></tr></table><hr>
    <div class="c">${esc(b.footer || 'Thank you! Visit again')}</div><div class="c" style="font-size:10px">Powered by Aghanya Devanya Enterprises</div></div>
    <p class="muted" style="font-size:11px">${b.paper === 'A6' ? 'A6 via print dialog' : b.paper + ' mm thermal'} · the logo does not print in thermal "Direct print" mode</p>`;
}
function saveBilling(){ update({billing: billingForm()}, 'Billing template saved — applies to new bills'); }

function tabRules(){
  const r = CUR.config.rules;
  $('#tab').innerHTML = `<div class="grid">
      <div><label>Cashier max discount % (above this needs Manager PIN)</label><input id="r_disc" type="number" min="0" max="100" value="${r.maxDiscPct ?? ''}" placeholder="blank = hotel setting"></div>
      <div><label>Customer mobile required for bills above ₹</label><input id="r_phone" type="number" min="0" value="${r.phoneAbove ?? ''}" placeholder="blank = off"></div>
    </div><div class="row" style="margin-top:12px"><button onclick="update({rules:{maxDiscPct:r_disc.value,phoneAbove:r_phone.value}}, 'Rules save')">Rules Save</button></div>
    <p class="muted">Rules apply to every device of the hotel; cashiers cannot change them in Settings.</p>`;

function tabDomains(){
  const h = CUR;
  $('#tab').innerHTML = `
    <table><tr><th>Domain</th><th>Type</th><th>Status</th><th></th></tr>
    ${(h.domains || []).map(d => `<tr><td><b>${esc(d.host)}</b>${d.status === 'active' ? ` <a href="https://${esc(d.host)}/hotel_erp.html" target="_blank" rel="noopener">open</a>` : ''}</td><td>${d.kind === 'sub' ? 'Subdomain' : 'Custom'}</td><td>${pill(d.status)}</td>
      <td class="row">${d.kind === 'custom' ? `<button class="g" onclick="checkDomain('${esc(d.host)}')">Check Status</button>` : ''}<button class="bad" onclick="removeDomain('${esc(d.host)}')">Remove</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">No domains — the hotel signs in with its Hotel Code</td></tr>'}</table>
    <div id="dns"></div>
    <h3>Subdomain ${META.baseDomain ? `(<code>xxx.${esc(META.baseDomain)}</code>)` : ''}</h3>
    ${META.baseDomain ? `<div class="row"><input id="d_slug" placeholder="royal" style="width:180px"><span>.${esc(META.baseDomain)}</span><button onclick="addDomain('sub', d_slug.value)">Add</button></div>`
      : '<p class="muted">Set BASE_DOMAIN (your Cloudflare domain) in wrangler.toml.</p>'}
    <h3>Hotel custom domain</h3>
    ${META.customDomains ? `<div class="row"><input id="d_host" placeholder="erp.hotelroyal.com" style="width:260px"><button onclick="addDomain('custom', d_host.value)">Add</button></div>
      <p class="muted">If the hotel already has a website, use a subdomain such as <code>erp.</code> — do not replace the main site.</p>`
      : '<p class="muted">Requires Cloudflare for SaaS: secrets CF_API_TOKEN + CF_ZONE_ID and var SAAS_CNAME_TARGET.</p>'}`;
}
function dnsTable(j){
  if(!j.records || !j.records.length) return '';
  return `<div class="card" style="background:var(--soft);margin-top:10px"><b>Add these DNS records at the hotel domain provider:</b>
    <table><tr><th>Type</th><th>Name</th><th>Value</th></tr>${j.records.map(r => `<tr><td>${esc(r.type)}</td><td><code>${esc(r.name)}</code></td><td><code>${esc(r.value)}</code></td></tr>`).join('')}</table>
    <p class="muted">The domain goes live once verification and HTTPS are ready (${esc(j.cf || 'pending')} / ssl ${esc(j.ssl || 'pending')}).</p></div>`;
}
const addDomain = run(async (kind, value) => {
  const j = await api('/api/admin/domain/add', {code: CUR.code, kind, value});
  CUR = await api('/api/admin/hotel', {code: CUR.code});
  tabDomains();
  $('#dns').innerHTML = dnsTable(j);
  toast(j.status === 'active' ? 'Domain live: ' + j.host : 'Add the DNS records, then check the status');
});
const checkDomain = run(async host => {
  const j = await api('/api/admin/domain/check', {code: CUR.code, host});
  CUR = await api('/api/admin/hotel', {code: CUR.code});
  tabDomains();
  $('#dns').innerHTML = dnsTable(j);
});
const removeDomain = run(async host => {
  if(!await ask('Remove ' + esc(host) + '?', '<p class="muted" style="margin-top:0">Setu will no longer open from that address.</p>', 'Remove', true)) return;
  await api('/api/admin/domain/remove', {code: CUR.code, host});
  CUR = await api('/api/admin/hotel', {code: CUR.code});
  tabDomains();
});

function tabSupport(){
  $('#tab').innerHTML = `<p>Support Access gives you <b>read-only</b> access to the hotel Setu (nothing is saved). The link expires automatically, and the hotel can see in Settings when support viewed it.</p>
    <div class="grid"><div><label>Duration</label><select id="s_min"><option value="30">30 minutes</option><option value="60" selected>1 hour</option><option value="120">2 hours</option></select></div>
      <div style="grid-column:span 2"><label>Reason (visible to the hotel)</label><input id="s_why" maxlength="120" placeholder="e.g. checking a GST report issue" style="width:100%"></div></div>
    <div class="row" style="margin-top:10px"><button onclick="supportOpen()">Create Support Link</button></div><div id="s_out"></div>
    <h3>Previous Support Access</h3>
    ${(CUR.supportLog || []).map(x => `<div>${dt(x.at)} · ${x.minutes} min · ${esc(x.reason || '')}</div>`).join('') || '<p class="muted">Never</p>'}
    <h3>Lost keys</h3>
    <p class="muted">New Counter PC Sync Key: the old key stops working; enter the new one on the counter PC (Settings → Hotel Setu Cloud Sync). Owner password: Overview tab.</p>
    <div class="row"><input id="k_set" placeholder="Current Sync Key (40 characters)" maxlength="40" style="min-width:300px"><button class="g" onclick="setSyncKey()">Record This Key</button></div>
    <div class="row" style="margin-top:8px"><button onclick="newSyncKey()">New Counter PC Sync Key</button></div>
    <div id="k_out"></div>`;
}
const newSyncKey = run(async () => {
  if(!await ask('New Sync Key?', '<p class="muted" style="margin-top:0">The counter PC must be updated with it.</p>', 'Create')) return;
  const j = await api('/api/admin/hotel', {code: CUR.code, update: {newSyncKey: true}});
  $('#k_out').innerHTML = `<p>Hotel Code: <b>${esc(CUR.code)}</b><br>New Sync Key (shown only now): <b style="font-family:monospace">${esc(j.syncKey || '')}</b></p>`;
});
const setSyncKey = run(async () => {
  const k = $('#k_set').value.trim();
  if(!k) return;
  CUR = await api('/api/admin/hotel', {code: CUR.code, update: {setSyncKey: k}});
  toast('Sync Key recorded');
  TAB = 'overview'; drawHotel();
});
const ownerPw2 = run(async () => {
  const pw = $('#o_pw2').value.trim();
  if(!pw) return;
  if(!await ask('New owner password for ' + esc(CUR.name) + '?', '', 'Set')) return;
  CUR = await api('/api/admin/hotel', {code: CUR.code, update: {ownerPassword: pw}});
  toast('Owner password set — tell the owner: ' + pw);
  drawHotel();
});
const supportOpen = run(async () => {
  if(!$('#s_why').value.trim()) return toast('Please enter a reason (visible to the hotel)', true);
  const j = await api('/api/admin/support', {code: CUR.code, minutes: +$('#s_min').value, reason: $('#s_why').value});
  $('#s_out').innerHTML = `<p class="ok">Link created (${j.minutes} min): <a href="${esc(j.url)}" target="_blank" rel="noopener">Open the hotel Setu</a></p>`;
});

const tabLog = run(async () => { $('#tab').innerHTML = '<div style="overflow-x:auto">' + await drawAudit(CUR.code) + '</div>'; });

const askThen = run(async (msg, fn) => { if(await ask(msg, '', 'Yes')) await fn(); });
// Close every open layer at once (e.g. jumping to Keygen from a hotel)
function closeAll(){
  if(ASK){ const r = ASK; ASK = null; r(null); }
  $('#ask').classList.remove('open'); $('#sheet').classList.remove('open');
  if($('#drawer').style.display === 'block'){ $('#drawer').style.display = 'none'; CUR = null; }
  const n = LAYERS; LAYERS = 0;
  if(n) try{ history.go(-n); }catch(e){}
}

// ---------------- start ----------------
function logout(){ try{ sessionStorage.removeItem('setu_admin'); localStorage.removeItem('setu_admin'); }catch(e){} location.reload(); }
async function openPanel(){
  try{
    META = await api('/api/admin/meta');
    try{ sessionStorage.setItem('setu_admin', KEY); if($('#remember') && $('#remember').checked) localStorage.setItem('setu_admin', KEY); }catch(e){}
    $('#login').hidden = true;
    $('#app').hidden = false;
    show('hotels');   // like Library ERP: open on the list, most urgent first
  }catch(e){
    // A remembered key that no longer works must not keep trying (it would lock this device)
    if(/Invalid Admin Key/.test(e.message)){ try{ sessionStorage.removeItem('setu_admin'); localStorage.removeItem('setu_admin'); }catch(x){} KEY = ''; }
    $('#lerr').textContent = e.message;
  }
}
$('#lf').onsubmit = e => { e.preventDefault(); KEY = $('#key').value.trim(); openPanel(); };
$('#drawer').onclick = e => { if(e.target.id === 'drawer') closeHotel(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape' && LAYERS) popLayer(); });
if(KEY) openPanel();
</script>
