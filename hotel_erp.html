<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotel ERP</title>
<style>
:root{
  --bar:#1d5c63; --bar2:#174a50; --bg:#fffdf0; --panel:#fff; --line:#d9d2b0; --ink:#1d1d1d; --muted:#6b6b6b;
  --hi:#fff3b0; --sel:#1d5c63; --ok:#1e7d32; --bad:#c62828; --warn:#ef6c00; --side:#e8f1ee;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.4 "Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #bdb59a;border-radius:3px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #f5c400;background:var(--hi)}
#top{background:var(--bar);color:#fff;display:flex;align-items:center;gap:16px;padding:6px 14px}
#top b{font-size:17px;letter-spacing:.3px}
#top .scr{background:var(--bar2);padding:2px 10px;border-radius:3px;font-size:13px}
#top .clock{margin-left:auto;font-size:13px;opacity:.9}
#wrap{flex:1;display:flex;min-height:0}
#main{flex:1;overflow:auto;padding:14px}
#side{width:170px;background:var(--side);border-left:1px solid var(--line);overflow:auto;padding:6px}
#side button{display:flex;width:100%;text-align:left;background:#fff;border:1px solid #b9cfc8;margin:0 0 4px;padding:6px 8px;border-radius:3px;font-size:13px}
#side button:hover{background:var(--hi)}
#side button u{font-weight:700;color:var(--bar);text-decoration:none;width:26px;flex:none}
.title{background:var(--bar);color:#fff;padding:6px 12px;font-weight:600;display:flex;align-items:center;gap:10px;margin:-14px -14px 14px}
.title .r{margin-left:auto;font-weight:400;font-size:13px}
.title input[type=date]{width:auto;padding:2px 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:6px 8px;border-bottom:1px solid #eee8cf;text-align:left;vertical-align:middle}
th{background:#f3eed3;font-weight:600;font-size:13px;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#fffbe0}
tfoot td{font-weight:700;background:#f8f4de}
.btn{background:var(--bar);color:#fff;border:0;padding:8px 14px;border-radius:3px}
.btn:hover{background:var(--bar2)}
.btn.g{background:#fff;color:var(--bar);border:1px solid var(--bar)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.wa{background:#1fa855}
.btn.sm{padding:3px 8px;font-size:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.muted{color:var(--muted)}.red{color:var(--bad);font-weight:600}.green{color:var(--ok);font-weight:600}
/* gateway */
.gw{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start;padding-top:10px}
.gwbox{width:330px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px #0001}
.gwbox h3{margin:0;background:var(--bar);color:#fff;text-align:center;padding:8px;font-size:15px}
.gwbox .sec{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 18px 2px}
.gwbox .it{padding:5px 18px;cursor:pointer;display:flex;gap:6px}
.gwbox .it u{color:var(--bad);font-weight:700;text-decoration:none}
.gwbox .it.on,.gwbox .it:hover{background:var(--hi)}
.stats{width:300px}
.stat{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px dashed #e6dfbf}
.stat b{font-variant-numeric:tabular-nums}
/* billing */
.bill{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.cat{background:#fff;border:1px solid #bdb59a;border-radius:14px;padding:4px 12px;font-size:13px}
.cat.on{background:var(--bar);color:#fff;border-color:var(--bar)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px;text-align:left;min-height:62px}
.item:hover,.item.first{background:var(--hi);border-color:#e0c200}
.item small{display:block;color:var(--bar);font-weight:700;margin-top:3px}
.qty{display:flex;align-items:center;gap:3px}
.qty button{width:26px;height:26px;border:1px solid #bdb59a;background:#fff;border-radius:3px}
.qty input{width:46px;text-align:center;padding:3px}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .big{font-size:22px;font-weight:700;color:var(--bar);border-top:2px solid var(--bar);margin-top:4px;padding-top:6px}
.modes{display:flex;gap:6px}
.modes button{flex:1;padding:8px;border:1px solid var(--bar);background:#fff;color:var(--bar);border-radius:3px}
.modes button.on{background:var(--bar);color:#fff}
/* modal */
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.open{display:flex}
#modal .box{background:#fff;border-radius:4px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 10px 40px #0004}
#modal .box h3{margin:0;background:var(--bar);color:#fff;padding:9px 14px;font-size:15px}
#modal .box .in{padding:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;border-radius:4px;display:none;z-index:60}
pre.wa{background:#e7fbe9;border:1px solid #b7e3bd;padding:12px;border-radius:6px;white-space:pre-wrap;font:13px/1.45 "Segoe UI",sans-serif;margin:0}
.den input{width:90px;text-align:right}
/* growth features */
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.kcard{background:#fff;border:2px solid var(--line);border-radius:6px;padding:10px}
.kcard.new{border-color:var(--warn)}.kcard.late{border-color:var(--bad);background:#fff4f4}.kcard.ready{border-color:var(--ok);background:#f1fbf2}
.kcard h4{margin:0 0 6px;display:flex;justify-content:space-between;font-size:15px}
.kcard ul{margin:6px 0;padding-left:18px;font-size:15px;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#e8f1ee;color:var(--bar);font-weight:600}
.tag.sw{background:#ffe6cc;color:#b45309}.tag.zo{background:#fde2e2;color:#b91c1c}.tag.qr{background:#e0e7ff;color:#3730a3}
.pts{background:#fff8d6;border:1px dashed #e0c200;border-radius:4px;padding:6px 10px;margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13px}
.att button{min-width:34px;padding:4px 6px;border:1px solid #bdb59a;background:#fff;border-radius:3px;font-weight:700}
.att button.P.on{background:var(--ok);color:#fff;border-color:var(--ok)}.att button.H.on{background:var(--warn);color:#fff;border-color:var(--warn)}.att button.A.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.qrbox{display:inline-block;text-align:center}.qrbox svg{display:block;margin:0 auto}
.qrsheet{display:grid;grid-template-columns:repeat(2,1fr);gap:8mm;padding:8mm;width:190mm;font:14px Arial,sans-serif;color:#000}
.qrsheet .t{border:2px solid #000;border-radius:6px;padding:6mm;text-align:center;break-inside:avoid}
.qrsheet .t b{font-size:22px;display:block}.qrsheet svg{width:55mm;height:55mm;margin:4mm auto}
#print{display:none}
@media (max-width:900px){.bill{grid-template-columns:1fr}#side{display:none}}
/* thermal receipt */
.rcpt{width:var(--pw,72mm);font:12px/1.35 "Courier New",monospace;color:#000;padding:2mm 0}
.rcpt .c{text-align:center}.rcpt .h{font-size:15px;font-weight:700}
.rcpt hr{border:0;border-top:1px dashed #000;margin:4px 0}
.rcpt table{background:none}.rcpt td,.rcpt th{padding:1px 0;border:0;font-size:12px;background:none!important}
.rcpt .r{text-align:right}
.rcpt .big{font-size:16px;font-weight:700}
.rcpt.kot td{font-size:15px;font-weight:700;padding:2px 0}
.rcpt{page:thermal}
/* A6 = 105 x 148 mm */
.rcpt.a6{page:a6;width:93mm;font:13px/1.45 Arial,sans-serif;padding:0}
.rcpt.a6 .h{font-size:20px}
.rcpt.a6 hr{border-top:1px solid #000;margin:6px 0}
.rcpt.a6 td,.rcpt.a6 th{font-size:13px;padding:3px 0}
.rcpt.a6 th{border-bottom:1px solid #000!important}
.rcpt.a6 .big,.rcpt.a6 .big td{font-size:18px}
.rcpt.a6.kot td{font-size:17px}
.rcpt .qr{display:flex;justify-content:center;gap:4mm;text-align:center;font-size:10px;margin:2mm 0}
.rcpt .qr svg{width:24mm;height:24mm;display:block;margin:0 auto 1mm}
.cut{break-after:page;page-break-after:always;height:0}
@page thermal{margin:0}
@page a6{size:105mm 148mm;margin:6mm}
@media print{
  @page{margin:0}
  body{display:block;background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block}
}
</style>
</head>
<body>
<header id="top"><b id="hname">Hotel ERP</b><span class="scr" id="scrname">Gateway</span><span class="clock" id="clock"></span></header>
<div id="wrap"><main id="main"></main><aside id="side"></aside></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<div id="print"></div>

<script>
/* ================= DATA ================= */
const KEY='hotelerp_v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const dmy=d=>d?d.split('-').reverse().join('-'):'';
const r2=n=>Math.round((+n||0)*100)/100;
const money=n=>'₹'+r2(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const rs=n=>'₹'+r2(n).toLocaleString('en-IN');
const fq=n=>String(+(+n||0).toFixed(3));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+(+(typeof f==='function'?f(x):x[f])||0),0);
const $=s=>document.querySelector(s);
const MODES=['Cash','UPI','Card','Credit','Online'];
const SOURCES=['Dine-in','Parcel','QR Order','Swiggy','Zomato'];
const srcTag=s=>s&&s!=='Dine-in'?`<span class="tag ${s==='Swiggy'?'sw':s==='Zomato'?'zo':s==='QR Order'?'qr':''}">${esc(s)}</span>`:'';
const normPh=p=>{p=String(p||'').replace(/\D/g,'');return p.length>10?p.slice(-10):p;};
function qrSvg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:2,margin:2,scalable:true});}catch(e){return '';}}
const upiLink=amt=>{const s=D.settings;return s.upi?`upi://pay?pa=${String(s.upi).trim().replace(/[^\w.@-]/g,'')}&pn=${encodeURIComponent(s.name)}${amt?`&am=${(+amt).toFixed(2)}`:''}&cu=INR`:'';};
const DEN=[500,200,100,50,20,10,5,2,1];

function seed(){
  const stock=[['Paneer','kg',5,1,320],['Atta (Flour)','kg',25,5,35],['Rice','kg',20,5,60],['Milk','ltr',10,3,56],
    ['Tea Leaves','kg',2,0.5,400],['Cold Drink','pcs',48,12,30],['Dal','kg',10,2,110],['Oil','ltr',15,3,140]]
    .map(([name,unit,qty,min,rate])=>({id:uid(),name,unit,qty,min,rate}));
  const S=n=>stock.find(x=>x.name.startsWith(n)).id;
  const menu=[
    ['Paneer Butter Masala','Main Course',220,[['Paneer',0.2],['Oil',0.03]]],
    ['Dal Tadka','Main Course',150,[['Dal',0.1],['Oil',0.02]]],
    ['Veg Thali','Thali',180,[['Rice',0.15],['Dal',0.05],['Atta',0.1]]],
    ['Jeera Rice','Rice',120,[['Rice',0.2]]],
    ['Butter Naan','Roti',40,[['Atta',0.08]]],
    ['Tandoori Roti','Roti',20,[['Atta',0.06]]],
    ['Masala Chai','Beverages',20,[['Milk',0.1],['Tea',0.005]]],
    ['Cold Drink','Beverages',40,[['Cold',1]]],
  ].map(([name,cat,price,r])=>({id:uid(),name,cat,price,recipe:r.map(([n,qty])=>({sid:S(n),qty}))}));
  return {settings:{name:'Hotel Annapurna',address:'Main Road, Your City',phone:'',gstin:'',gst:5,owner:'',
    footer:'Thank you! Visit again',width:80,billPaper:'A6',kotPaper:'A6',...DEF_SET},menu,stock,bills:[],txns:[],cash:{},seq:{bill:0,kot:0},staff:[],att:{}};
}
const DEF_SET={upi:'',review:'',orderWa:'',menuUrl:'',loyalty:true,ptsPer100:5,ptValue:1,minRedeem:50,swiggyPct:25,zomatoPct:25,kotLate:20};
function migrate(s){s.settings={...DEF_SET,...s.settings};s.staff=s.staff||[];s.att=s.att||{};
  (s.bills||[]).forEach(b=>{b.source=b.source||'Dine-in';if(!b.kotStatus)b.kotStatus='served';b.ptsEarned=b.ptsEarned||0;b.ptsUsed=b.ptsUsed||0;});return s;}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.settings)return migrate(s);}catch(e){}return seed();}
let D=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){alert('Data save nahi hua: '+e.message);}}
save();

/* ================= UI HELPERS ================= */
const main=$('#main');
let cur='gateway', gwSel=0;
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200);}
function modal(title,html){$('#mbox').innerHTML=`<h3>${esc(title)}</h3><div class="in">${html}</div>`;$('#modal').classList.add('open');
  setTimeout(()=>{const f=$('#mbox [autofocus]')||$('#mbox input,#mbox select,#mbox button');f&&f.focus();},30);}
function closeModal(){$('#modal').classList.remove('open');}
const isModal=()=>$('#modal').classList.contains('open');
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal();});
function waOpen(num,text){
  let n=String(num||'').replace(/\D/g,'');
  if(n.length===10)n='91'+n;
  if(!n){toast('WhatsApp number nahi hai — Settings mein daalein');return;}
  window.open('https://wa.me/'+n+'?text='+encodeURIComponent(text),'_blank');
}
function waOwner(text){if(!D.settings.owner){toast('Owner ka WhatsApp number Settings (G) mein daalein');return;}waOpen(D.settings.owner,text);}

const MENU=[
  ['B','Billing (New Bill)','bill','Transactions'],
  ['L','Bill List / Reprint','bills'],
  ['K','Kitchen Display (KOT)','kitchen'],
  ['P','Purchase / Stock In','purchase'],
  ['E','Expense / Payment Out','expense'],
  ['I','Other Income / Receipt','income'],
  ['D','Day Book','daybook','Reports'],
  ['C','Cash Counter','cash'],
  ['W','Day Report → WhatsApp','report'],
  ['S','Stock Summary','stock'],
  ['R','Customers & Loyalty','customers','Growth'],
  ['Q','QR Menu & Online Orders','qr'],
  ['A','Staff Attendance & Salary','staff'],
  ['M','Menu Items','menu','Masters'],
  ['G','Settings & Backup','settings','Utilities'],
];
const SCREENS={gateway:scrGateway,bill:scrBill,bills:scrBills,purchase:scrPurchase,expense:()=>scrVoucher('Expense'),
  income:()=>scrVoucher('Receipt'),daybook:scrDaybook,cash:scrCash,report:scrReport,stock:scrStock,menu:scrMenu,settings:scrSettings,
  kitchen:scrKitchen,customers:scrCustomers,qr:scrQR,staff:scrStaff};
let kdsTimer=null;
function go(s){cur=s;closeModal();clearInterval(kdsTimer);const m=MENU.find(x=>x[2]===s);$('#scrname').textContent=m?m[1]:'Gateway of Hotel';
  $('#hname').textContent=D.settings.name;main.scrollTop=0;SCREENS[s]();}
function drawSide(){$('#side').innerHTML=`<button onclick="go('gateway')"><u>Esc</u>Gateway</button>`+
  MENU.map(m=>`<button onclick="go('${m[2]}')"><u>${m[0]}</u>${m[1]}</button>`).join('');}
setInterval(()=>{const d=new Date();$('#clock').textContent=d.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})+'  '+d.toLocaleTimeString('en-IN');},1000);

document.addEventListener('keydown',e=>{
  const typing=['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);
  if(e.key==='Escape'){e.preventDefault();if(isModal())closeModal();else if(cur!=='gateway')go('gateway');return;}
  if(isModal())return;
  if(e.altKey){const m=MENU.find(x=>x[0]===e.key.toUpperCase());if(m){e.preventDefault();go(m[2]);return;}}
  if(cur==='gateway'&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();gwSel=(gwSel+(e.key==='ArrowDown'?1:MENU.length-1))%MENU.length;scrGateway();return;}
    if(e.key==='Enter'){e.preventDefault();go(MENU[gwSel][2]);return;}
    const m=MENU.find(x=>x[0]===e.key.toUpperCase());if(m){e.preventDefault();go(m[2]);}
  }
  if(cur==='bill'&&e.ctrlKey&&e.key==='Enter'){e.preventDefault();saveBill();}
});

/* ================= CALCULATIONS ================= */
function calc(items,disc,rate){
  const sub=sum(items,i=>i.price*i.qty);disc=Math.min(+disc||0,sub);
  const taxable=sub-disc,tax=r2(taxable*(+rate||0)/100),raw=taxable+tax,total=Math.round(raw);
  return {sub:r2(sub),disc:r2(disc),taxable:r2(taxable),tax,round:r2(total-raw),total};
}
function summary(d){
  const bills=D.bills.filter(b=>b.date===d&&!b.cancelled),tx=D.txns.filter(t=>t.date===d);
  const by={};MODES.forEach(m=>by[m]=sum(bills.filter(b=>b.mode===m),'total'));
  const bySrc={};SOURCES.forEach(x=>bySrc[x]=sum(bills.filter(b=>(b.source||'Dine-in')===x),'total'));
  const comm=r2(bySrc.Swiggy*(+D.settings.swiggyPct||0)/100+bySrc.Zomato*(+D.settings.zomatoPct||0)/100);
  const rec=tx.filter(t=>t.type==='Receipt'),exp=tx.filter(t=>t.type==='Expense'),pur=tx.filter(t=>t.type==='Purchase');
  const isCash=t=>t.mode==='Cash';
  const cashIn=by.Cash+sum(rec.filter(isCash),'amount'),cashOut=sum(exp.filter(isCash),'amount')+sum(pur.filter(isCash),'amount');
  const items={};bills.forEach(b=>b.items.forEach(i=>{items[i.name]=(items[i.name]||0)+i.qty;}));
  const cr=cashRec(d),counted=countTotal(cr);
  return {bills,by,bySrc,comm,pts:sum(bills,'ptsUsed'),sales:sum(bills,'total'),disc:sum(bills,'disc'),tax:sum(bills,'tax'),rec,exp,pur,
    recT:sum(rec,'amount'),expT:sum(exp,'amount'),purT:sum(pur,'amount'),cashIn,cashOut,
    opening:+cr.opening||0,expected:(+cr.opening||0)+cashIn-cashOut,counted,countedSaved:!!D.cash[d],
    top:Object.entries(items).sort((a,b)=>b[1]-a[1]),cancelled:D.bills.filter(b=>b.date===d&&b.cancelled).length};
}
const lowStock=()=>D.stock.filter(s=>+s.qty<=+s.min);
const pendingKots=()=>D.bills.filter(b=>!b.cancelled&&b.date===today()&&b.kotStatus&&b.kotStatus!=='served');
function ptsBal(phone){const p=normPh(phone);if(p.length<10)return 0;
  return D.bills.filter(b=>!b.cancelled&&normPh(b.phone)===p).reduce((t,b)=>t+(+b.ptsEarned||0)-(+b.ptsUsed||0),0);}
function customers(){const m={};
  D.bills.filter(b=>!b.cancelled&&normPh(b.phone).length===10).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(b=>{
    const p=normPh(b.phone),c=m[p]||(m[p]={phone:p,name:'',visits:0,spend:0,first:b.date,last:b.date,pts:0,fav:{}});
    if(b.cust)c.name=b.cust;c.visits++;c.spend+=b.total;c.last=b.date;c.pts+=(+b.ptsEarned||0)-(+b.ptsUsed||0);
    b.items.forEach(i=>c.fav[i.name]=(c.fav[i.name]||0)+i.qty);});
  return Object.values(m).map(c=>({...c,spend:r2(c.spend),fav:Object.entries(c.fav).sort((a,b)=>b[1]-a[1])[0]?.[0]||''}));}

    <div style="height:10px"></div></div>
    <div class="gwbox stats"><h3>Aaj ka Hisaab — ${dmy(today())}</h3>
      <div class="stat"><span>Bills</span><b>${s.bills.length}</b></div>
      <div class="stat"><span>Total Sales</span><b>${money(s.sales)}</b></div>
      ${MODES.map(m=>`<div class="stat"><span class="muted">&nbsp;&nbsp;${m}</span><b>${money(s.by[m])}</b></div>`).join('')}
      <div class="stat"><span>Expenses</span><b class="red">${money(s.expT)}</b></div>
      <div class="stat"><span>Purchases</span><b class="red">${money(s.purT)}</b></div>
      <div class="stat"><span>Cash in Hand (expected)</span><b class="green">${money(s.expected)}</b></div>
      <div class="stat"><span>Low Stock Items</span><b class="${lowStock().length?'red':''}">${lowStock().length}</b></div>
      <div class="stat"><span>Pending KOT (Kitchen)</span><b class="${pendingKots().length?'red':''}">${pendingKots().length}</b></div>
      ${SOURCES.filter(x=>s.bySrc[x]&&x!=='Dine-in').map(x=>`<div class="stat"><span class="muted">&nbsp;&nbsp;${x}</span><b>${money(s.bySrc[x])}</b></div>`).join('')}

/* ================= BILLING ================= */
let B=newB(),billCat=0;
function newB(){return {table:'',cust:'',phone:'',disc:0,mode:'Cash',note:'',cart:[],source:'Dine-in',redeem:0};}
const redeemRs=()=>r2((+B.redeem||0)*(+D.settings.ptValue||0));
const totDisc=()=>(+B.disc||0)+redeemRs();
function onPhone(v){B.phone=v;B.redeem=0;const p=normPh(v);
  if(p.length===10){const old=D.bills.filter(b=>normPh(b.phone)===p&&b.cust).pop();if(old&&!B.cust){B.cust=old.cust;const i=$('#b_cust');if(i)i.value=old.cust;}}
  drawPts();drawTotals();}
function drawPts(){const e=$('#pts');if(!e)return;const st=D.settings,p=normPh(B.phone);
  if(!st.loyalty||p.length!==10||B.source==='Swiggy'||B.source==='Zomato'){e.innerHTML='';return;}
  const bal=ptsBal(p),visits=D.bills.filter(b=>!b.cancelled&&normPh(b.phone)===p).length;
  e.innerHTML=`<div class="pts">⭐ <span>${visits?`Purana customer · ${visits} visit`:'Naya customer'} · Points: <b>${bal}</b> (= ${money(bal*st.ptValue)})</span>
    ${B.redeem?`<b class="green">−${money(redeemRs())} redeemed</b><button class="btn g sm" onclick="B.redeem=0;drawPts();drawTotals()">Undo</button>`:
    bal>=(+st.minRedeem||0)&&bal>0?`<button class="btn sm" onclick="redeemPts()">Redeem</button>`:`<span class="muted">min ${st.minRedeem} pts</span>`}</div>`;}
function redeemPts(){const st=D.settings,bal=ptsBal(B.phone),t=calc(B.cart,B.disc,st.gst);
  const maxPts=Math.floor(t.taxable/(+st.ptValue||1));B.redeem=Math.max(0,Math.min(bal,maxPts));
  if(!B.redeem){toast('Pehle item add karein');return;}drawPts();drawTotals();}
function scrBill(){
  const cats=['All',...new Set(D.menu.map(m=>m.cat))];if(billCat>=cats.length)billCat=0;
  main.innerHTML=`<div class="title">Sales Voucher — New Bill <span class="r">Bill No: <b>${D.seq.bill+1}</b> · KOT No: <b>${D.seq.kot+1}</b> · ${dmy(today())}</span></div>
  <div class="bill">
    <div>
      <input id="q" placeholder="🔍 Item search karein, Enter = add (e.g. naan)" autocomplete="off">
      <div class="cats">${cats.map((c,i)=>`<button class="cat ${i===billCat?'on':''}" onclick="billCat=${i};scrBill()">${esc(c)}</button>`).join('')}</div>
      <div id="items" class="items"></div>
    </div>
    <div class="card">
      <div class="grid" style="grid-template-columns:90px 1fr 1fr">
        <div><label>Table No</label><input id="b_table" value="${esc(B.table)}" oninput="B.table=this.value"></div>
        <div><label>Customer Name</label><input id="b_cust" value="${esc(B.cust)}" oninput="B.cust=this.value"></div>
        <div><label>Mobile (WhatsApp)</label><input value="${esc(B.phone)}" oninput="onPhone(this.value)" inputmode="tel"></div>
      </div>
      <label style="margin-top:8px">Order Type</label>
      <div class="modes" id="srcs">${SOURCES.map(x=>`<button class="${B.source===x?'on':''}" onclick="setSource('${x}')">${x}</button>`).join('')}</div>
      <div id="pts"></div>
      <div id="cart" style="margin-top:10px"></div>
      <div class="grid" style="grid-template-columns:120px 1fr;margin-top:10px">
        <div><label>Discount (₹)</label><input type="number" min="0" value="${B.disc||''}" oninput="B.disc=+this.value||0;drawTotals()"></div>
        <div><label>Kitchen Note (KOT par chhapega)</label><input value="${esc(B.note)}" oninput="B.note=this.value" placeholder="e.g. less spicy"></div>
      </div>
      <div id="tot" class="tot" style="margin-top:10px"></div>
      <label style="margin-top:8px">Payment Mode</label>
      <div class="modes" id="pmodes">${MODES.map(m=>`<button class="${B.mode===m?'on':''}" onclick="B.mode='${m}';scrBillModes()">${m==='Credit'?'Credit (Udhaar)':m}</button>`).join('')}</div>
      <div class="btns">
        <button class="btn ok" style="flex:1;padding:12px" onclick="saveBill()">💾 Save & Print (Bill + KOT) <small>Ctrl+Enter</small></button>
        <button class="btn g" onclick="if(confirm('Bill clear karein?')){B=newB();scrBill();}">Clear</button>
      </div>
    </div>
  </div>`;
  const q=$('#q');q.oninput=drawItems;
  q.onkeydown=e=>{if(e.key==='Enter'&&!e.ctrlKey&&q.value.trim()){e.preventDefault();const f=filtered()[0];if(f){addItem(f.id);q.value='';drawItems();}}};
  drawItems();drawCart();drawPts();q.focus();
}
function scrBillModes(){document.querySelectorAll('#pmodes button').forEach((b,i)=>b.classList.toggle('on',MODES[i]===B.mode));}
function setSource(x){B.source=x;if(x==='Swiggy'||x==='Zomato'){B.mode='Online';B.redeem=0;drawPts();drawTotals();}else if(B.mode==='Online')B.mode='Cash';
  document.querySelectorAll('#srcs button').forEach((b,i)=>b.classList.toggle('on',SOURCES[i]===x));scrBillModes();}
function filtered(){
  const cats=['All',...new Set(D.menu.map(m=>m.cat))],q=($('#q')?.value||'').toLowerCase().trim();
  return D.menu.filter(m=>(billCat===0||m.cat===cats[billCat])&&(!q||m.name.toLowerCase().includes(q)));
}
function drawItems(){const f=filtered(),q=$('#q').value.trim();
  $('#items').innerHTML=f.map((m,i)=>`<button class="item ${q&&i===0?'first':''}" onclick="addItem('${m.id}')">${esc(m.name)}<small>${rs(m.price)}</small></button>`).join('')||'<p class="muted">Koi item nahi mila. Menu Items (M) mein add karein.</p>';}
function addItem(id){const m=D.menu.find(x=>x.id===id);if(!m)return;
  const c=B.cart.find(x=>x.mid===id);if(c)c.qty++;else B.cart.push({mid:id,name:m.name,price:+m.price,qty:1});drawCart();}
function setQty(i,v){v=+v;if(!(v>0))B.cart.splice(i,1);else B.cart[i].qty=v;drawCart();}
function drawCart(){
  $('#cart').innerHTML=B.cart.length?`<table><thead><tr><th>Item</th><th class="n">Rate</th><th>Qty</th><th class="n">Amount</th><th></th></tr></thead><tbody>
    ${B.cart.map((c,i)=>`<tr><td>${esc(c.name)}</td><td class="n">${c.price}</td>
      <td><div class="qty"><button onclick="setQty(${i},${c.qty-1})">−</button><input value="${c.qty}" onchange="setQty(${i},this.value)"><button onclick="setQty(${i},${c.qty+1})">+</button></div></td>
      <td class="n">${r2(c.price*c.qty)}</td><td><button class="btn bad sm" onclick="setQty(${i},0)">✕</button></td></tr>`).join('')}</tbody></table>`
    :'<p class="muted" style="text-align:center;padding:20px;border:1px dashed var(--line)">Left side se item select karein</p>';
  drawTotals();
}
function drawTotals(){
  if(B.redeem){const room=sum(B.cart,i=>i.price*i.qty)-(+B.disc||0),mx=Math.max(0,Math.floor(room/(+D.settings.ptValue||1)));if(B.redeem>mx){B.redeem=mx;drawPts();}}
  const t=calc(B.cart,totDisc(),D.settings.gst),g=+D.settings.gst,rr=redeemRs();
  $('#tot').innerHTML=`<div><span>Sub Total (${sum(B.cart,'qty')} items)</span><b>${money(t.sub)}</b></div>
  ${t.disc-rr>0?`<div><span>Discount</span><b>− ${money(t.disc-rr)}</b></div>`:''}
  ${rr?`<div><span>⭐ Loyalty (${B.redeem} pts)</span><b>− ${money(rr)}</b></div>`:''}
  ${g?`<div><span>CGST ${g/2}% + SGST ${g/2}%</span><b>${money(t.tax)}</b></div>`:''}
  ${t.round?`<div><span>Round Off</span><b>${t.round>0?'+':''}${t.round}</b></div>`:''}
  <div class="big"><span>TOTAL</span><span>${money(t.total)}</span></div>`;}
function saveBill(){
  if(!B.cart.length){toast('Pehle item add karein');return;}
  const st=D.settings,t=calc(B.cart,totDisc(),st.gst),used={};
  B.cart.forEach(c=>{const m=D.menu.find(x=>x.id===c.mid);(m?.recipe||[]).forEach(r=>{used[r.sid]=(used[r.sid]||0)+r.qty*c.qty;});});
  const hasPh=normPh(B.phone).length===10,ptsUsed=hasPh?Math.min(+B.redeem||0,ptsBal(B.phone)):0;
  const ptsEarned=st.loyalty&&hasPh&&B.source!=='Swiggy'&&B.source!=='Zomato'?Math.floor(t.total/100*(+st.ptsPer100||0)):0;
  const bill={id:uid(),no:++D.seq.bill,kot:++D.seq.kot,date:today(),time:nowTime(),table:B.table.trim(),cust:B.cust.trim(),phone:B.phone.trim(),
    note:B.note.trim(),mode:B.mode,source:B.source,kotStatus:'new',kotAt:Date.now(),ptsUsed,ptsEarned,loyaltyDisc:r2(ptsUsed*(+st.ptValue||0)),
    gstRate:+st.gst,items:B.cart.map(c=>({...c})),...t,used:Object.entries(used).map(([sid,qty])=>({sid,qty}))};
  applyStock(bill.used,-1);D.bills.push(bill);save();B=newB();
  afterSave(bill);
}
function applyStock(used,sign){(used||[]).forEach(u=>{const s=D.stock.find(x=>x.id===u.sid);if(s)s.qty=+(+s.qty+sign*u.qty).toFixed(3);});}
function afterSave(b){
  scrBill();
  modal(`Bill #${b.no} Saved — ${money(b.total)}`,`
    <p>Bill save ho gaya aur stock update ho gaya. Ab print / WhatsApp karein:</p>
    <div class="btns" style="flex-direction:column">
      <button class="btn ok" autofocus onclick="printBill('${b.id}','both')">🖨️ Print Customer Bill + Kitchen KOT (2 receipts)</button>
      <button class="btn g" onclick="printBill('${b.id}','bill')">🧾 Sirf Customer Bill</button>
      <button class="btn g" onclick="printBill('${b.id}','kot')">👨‍🍳 Sirf Kitchen KOT</button>
      ${b.phone?`<button class="btn wa" onclick="waOpen('${esc(b.phone)}',billText(getBill('${b.id}')))">📲 Customer ko WhatsApp Bill</button>`:''}
      <button class="btn wa" onclick="waOwner(billText(getBill('${b.id}')))">📲 Owner ko WhatsApp Bill</button>
      <button class="btn g" onclick="closeModal();$('#q').focus()">➕ Naya Bill (Esc)</button>
    </div>`);
}
const getBill=id=>D.bills.find(b=>b.id===id);

/* ================= RECEIPTS ================= */
function head(){const s=D.settings;return `<div class="c h">${esc(s.name)}</div><div class="c">${esc(s.address)}</div>
  ${s.phone?`<div class="c">Ph: ${esc(s.phone)}</div>`:''}${s.gstin?`<div class="c">GSTIN: ${esc(s.gstin)}</div>`:''}`;}
function billHTML(b){const g=b.gstRate;
  return `<div class="rcpt${paper('bill')}">${head()}<hr><div class="c"><b>TAX INVOICE${b.cancelled?' (CANCELLED)':''}</b></div>
  <div>Bill No: <b>${b.no}</b> &nbsp; ${dmy(b.date)} ${b.time}</div>
  ${b.table?`<div>Table: <b>${esc(b.table)}</b></div>`:''}${b.source&&b.source!=='Dine-in'?`<div>Order: <b>${esc(b.source)}</b></div>`:''}${b.cust?`<div>Customer: ${esc(b.cust)}</div>`:''}<hr>
  <table><tr><th>Item</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amt</th></tr>
  ${b.items.map(i=>`<tr><td>${esc(i.name)}</td><td class="r">${i.qty}</td><td class="r">${i.price}</td><td class="r">${r2(i.price*i.qty)}</td></tr>`).join('')}</table><hr>
  <table><tr><td>Sub Total</td><td class="r">${b.sub.toFixed(2)}</td></tr>
  ${b.disc-(b.loyaltyDisc||0)>0?`<tr><td>Discount</td><td class="r">-${(b.disc-(b.loyaltyDisc||0)).toFixed(2)}</td></tr>`:''}
  ${b.loyaltyDisc?`<tr><td>Loyalty (${b.ptsUsed} pts)</td><td class="r">-${b.loyaltyDisc.toFixed(2)}</td></tr>`:''}
  ${g?`<tr><td>CGST @${g/2}%</td><td class="r">${(b.tax/2).toFixed(2)}</td></tr><tr><td>SGST @${g/2}%</td><td class="r">${(b.tax/2).toFixed(2)}</td></tr>`:''}
  ${b.round?`<tr><td>Round Off</td><td class="r">${b.round.toFixed(2)}</td></tr>`:''}</table><hr>
  <table><tr class="big"><td>TOTAL</td><td class="r">₹${b.total.toFixed(2)}</td></tr></table>
  <div>Paid by: ${b.mode}</div>${ptsLine(b)}<hr>${billQR(b)}<div class="c">${esc(D.settings.footer)}</div></div>`;}
function ptsLine(b){if(!b.ptsEarned&&!b.ptsUsed)return '';
  return `<div>⭐ Points earned: ${b.ptsEarned}${b.ptsUsed?` · used: ${b.ptsUsed}`:''} · Balance: <b>${ptsBalAt(b)}</b></div>`;}
function ptsBalAt(b){const p=normPh(b.phone);return D.bills.filter(x=>!x.cancelled&&normPh(x.phone)===p&&x.no<=b.no)
  .reduce((t,x)=>t+(+x.ptsEarned||0)-(+x.ptsUsed||0),0);}
function billQR(b){const s=D.settings,q=[];
  if(s.upi&&!b.cancelled&&['Cash','UPI','Credit'].includes(b.mode))q.push(`<div>${qrSvg(upiLink(b.total))}Scan & Pay ₹${b.total}</div>`);
  if(s.review)q.push(`<div>${qrSvg(s.review)}Google par rating dein ⭐</div>`);
  return q.length?`<div class="qr">${q.join('')}</div><hr>`:'';}
function kotHTML(b){
  return `<div class="rcpt kot${paper('kot')}"><div class="c h">*** KITCHEN ORDER (KOT) ***</div><hr>
  <div>KOT No: <b>${b.kot}</b> &nbsp; Bill: ${b.no}</div><div>${dmy(b.date)} &nbsp; ${b.time}</div>
  <div class="big">Table: ${esc(b.table||'Parcel / Counter')}</div>${b.source&&b.source!=='Dine-in'?`<div class="big">** ${esc(b.source).toUpperCase()} **</div>`:''}<hr>
  <table><tr><th>Qty</th><th>Item</th></tr>${b.items.map(i=>`<tr><td>${i.qty} ×</td><td>${esc(i.name)}</td></tr>`).join('')}</table><hr>
  ${b.note?`<div class="big">Note: ${esc(b.note)}</div><hr>`:''}<div class="c">Chef copy</div></div>`;}
const paper=k=>(D.settings[k+'Paper']||'A6')==='A6'?' a6':'';
function printDoc(parts){const p=$('#print');p.style.setProperty('--pw',(D.settings.width==58?'50mm':'72mm'));
  p.innerHTML=parts.join('<div class="cut"></div>');setTimeout(()=>window.print(),60);}
function printBill(id,what){const b=getBill(id);if(!b)return;
  printDoc(what==='both'?[billHTML(b),kotHTML(b)]:what==='kot'?[kotHTML(b)]:[billHTML(b)]);}
function billText(b){const s=D.settings;
  return `*${s.name}*\n🧾 Bill No: ${b.no}  |  ${dmy(b.date)} ${b.time}${b.table?`\nTable: ${b.table}`:''}${b.cust?`\nCustomer: ${b.cust}`:''}\n--------------------\n`+
  b.items.map(i=>`${i.name} × ${i.qty} = ₹${r2(i.price*i.qty)}`).join('\n')+
  `\n--------------------\nSub Total: ₹${b.sub}${b.disc?`\nDiscount: -₹${b.disc}`:''}${b.tax?`\nGST (${b.gstRate}%): ₹${b.tax}`:''}\n*TOTAL: ₹${b.total}*\nPaid by: ${b.mode}`+
  (b.ptsEarned||b.ptsUsed?`\n\n⭐ Points earned: ${b.ptsEarned}${b.ptsUsed?` | used: ${b.ptsUsed}`:''}\n⭐ Total points: *${ptsBalAt(b)}* (= ₹${r2(ptsBalAt(b)*(+s.ptValue||0))})`:'')+
  (s.upi&&b.mode==='Credit'?`\n\n💳 UPI se pay karein: ${s.upi}`:'')+
  (s.review?`\n\n🙏 Khana kaisa laga? Google par rating dein:\n${s.review}`:'')+`\n\n${s.footer}`;}

/* ================= BILL LIST ================= */
let listDate=today();
function scrBills(){
  const bs=D.bills.filter(b=>b.date===listDate).sort((a,b)=>b.no-a.no);
  main.innerHTML=`<div class="title">Bill List / Reprint <span class="r">Date: <input type="date" value="${listDate}" onchange="listDate=this.value;scrBills()"></span></div>
  <div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Bill</th><th>Time</th><th>Table</th><th>Customer</th><th>Items</th><th>Mode</th><th class="n">Total</th><th>Actions</th></tr></thead><tbody>
  ${bs.map(b=>`<tr style="${b.cancelled?'opacity:.5;text-decoration:line-through':''}"><td><b>#${b.no}</b></td><td>${b.time}</td><td>${esc(b.table)} ${srcTag(b.source)}</td><td>${esc(b.cust)} ${b.phone?`<span class="muted">${esc(b.phone)}</span>`:''}</td>
    <td>${b.items.map(i=>esc(i.name)+'×'+i.qty).join(', ')}</td><td>${b.mode}</td><td class="n">${money(b.total)}</td>
    <td style="white-space:nowrap"><button class="btn sm" onclick="printBill('${b.id}','bill')">Bill</button>
      <button class="btn sm" onclick="printBill('${b.id}','kot')">KOT</button>

}
function cancelBill(id){const b=getBill(id);if(!b||b.cancelled)return;
  if(!confirm(`Bill #${b.no} (${money(b.total)}) cancel karein? Stock wapas jud jayega.`))return;
  b.cancelled=true;applyStock(b.used,+1);save();toast('Bill cancel ho gaya');scrBills();}

/* ================= PURCHASE / VOUCHERS ================= */
function stockOpts(sel){return D.stock.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)} (${fq(s.qty)} ${esc(s.unit)})</option>`).join('');}
function txList(type){const t=D.txns.filter(x=>x.type===type&&x.date===today()).reverse();

let ccDate=today();
function prevClosing(d){const k=Object.keys(D.cash).filter(x=>x<d).sort().pop();return k?countTotal(D.cash[k]):0;}
function cashRec(d){return D.cash[d]||{opening:prevClosing(d),den:{}};}
function countTotal(c){return sum(DEN,v=>v*(+c.den?.[v]||0));}
function scrCash(){
  const d=ccDate,c=cashRec(d),s=summary(d);
  main.innerHTML=`<div class="title">Cash Counter — Note Ginti <span class="r">Date: <input type="date" value="${d}" onchange="ccDate=this.value;scrCash()"></span></div>
  <div class="bill">
    <div class="card den"><table><thead><tr><th>Note / Coin</th><th></th><th>Kitne</th><th class="n">Amount</th></tr></thead><tbody>
      ${DEN.map(v=>`<tr><td><b>₹ ${v}</b> <span class="muted">${v>=10?'note':'coin'}</span></td><td>×</td>
        <td><input type="number" min="0" data-den="${v}" value="${c.den?.[v]||''}" oninput="ccCalc()"></td><td class="n" id="dl${v}"></td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="3">Total Cash Counted</td><td class="n" id="ccTot"></td></tr></tfoot></table></div>
    <div class="card tot">
      <div><span>Opening Cash</span><input id="cc_open" type="number" step="any" value="${c.opening||0}" style="width:130px;text-align:right" oninput="ccCalc()"></div>
      <div><span>+ Cash Sales</span><b>${money(s.by.Cash)}</b></div>
      <div><span>+ Other Cash Receipts</span><b>${money(s.cashIn-s.by.Cash)}</b></div>
      <div><span>− Cash Expenses / Purchases</span><b>${money(s.cashOut)}</b></div>
      <div class="big"><span>Expected Cash</span><span id="ccExp"></span></div>
      <div><span>Counted Cash</span><b id="ccCnt"></b></div>
      <div style="font-size:18px"><span>Difference</span><b id="ccDiff"></b></div>
      <p class="muted">UPI ${money(s.by.UPI)} · Card ${money(s.by.Card)} · Udhaar ${money(s.by.Credit)} · Online ${money(s.by.Online)} (cash mein nahi)</p>
      <div class="btns"><button class="btn ok" onclick="saveCash()">💾 Save Cash Count</button>
      <button class="btn wa" onclick="saveCash(true)">📲 Save & WhatsApp Owner</button></div>
    </div>
  </div>`;
  ccCalc();
}
function ccGet(){const den={};document.querySelectorAll('[data-den]').forEach(i=>{if(+i.value)den[i.dataset.den]=+i.value;});return {opening:+$('#cc_open').value||0,den};}
function ccCalc(){const c=ccGet(),s=summary(ccDate),tot=countTotal(c),exp=c.opening+s.cashIn-s.cashOut,df=tot-exp;
  DEN.forEach(v=>$('#dl'+v).textContent=c.den[v]?money(v*c.den[v]):'');
  $('#ccTot').textContent=money(tot);$('#ccExp').textContent=money(exp);$('#ccCnt').textContent=money(tot);
  const e=$('#ccDiff');e.textContent=(df===0?'✔ Match ':df>0?'Excess +':'Short ')+money(Math.abs(df));e.className=df===0?'green':'red';}
function saveCash(send){const c=ccGet();c.time=nowTime();D.cash[ccDate]=c;save();toast('Cash count save ho gaya');
  if(send){const s=summary(ccDate),df=s.counted-s.expected;
    waOwner(`*${D.settings.name}* — 💵 Cash Counter\n📅 ${dmy(ccDate)} ${c.time}\n\n`+DEN.filter(v=>c.den[v]).map(v=>`₹${v} × ${c.den[v]} = ₹${v*c.den[v]}`).join('\n')+
      `\n--------------------\n*Counted: ₹${s.counted}*\nExpected: ₹${r2(s.expected)}\nDifference: ${df===0?'✔ Match':(df>0?'Excess +₹':'Short ₹')+Math.abs(r2(df))}`);}
  scrCash();}

function importOrder(txt){txt=String(txt||'');if(!txt.trim()){toast('Order text paste karein');return;}
  const get=k=>(txt.match(new RegExp('^\\W*'+k+'\\s*[:\\-]\\s*(.+)$','im'))||[])[1]?.replace(/\*/g,'').trim()||'';
  const cart=[],miss=[];
  txt.split(/\r?\n/).forEach(l=>{const m=l.replace(/\*/g,'').match(/^\s*(\d+(?:\.\d+)?)\s*[x×X]\s*(.+?)\s*(?:[-=–:]\s*₹.*)?$/);if(!m)return;
    const n=m[2].toLowerCase().trim(),it=D.menu.find(x=>x.name.toLowerCase()===n)||D.menu.find(x=>x.name.toLowerCase().startsWith(n))||D.menu.find(x=>n.startsWith(x.name.toLowerCase()));
    if(!it){miss.push(m[2]);return;}const c=cart.find(x=>x.mid===it.id);if(c)c.qty+=+m[1];else cart.push({mid:it.id,name:it.name,price:+it.price,qty:+m[1]});});
  if(!cart.length){toast('Koi item match nahi hua. Format: 2 x Butter Naan');return;}
  B=newB();B.cart=cart;B.source='QR Order';const tb=get('Table');B.table=/parcel/i.test(tb)?'':tb;if(/parcel/i.test(tb))B.source='Parcel';
  B.cust=get('Name');B.phone=get('Phone')||get('Mobile');B.note=get('Note');go('bill');
  if(miss.length)setTimeout(()=>alert('Ye items menu mein nahi mile, khud add karein:\n• '+miss.join('\n• ')),100);else toast('Order bill mein aa gaya — check karke Save karein');}

const daysInMonth=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
function staffMonth(s,m){const days=Object.keys(D.att).filter(d=>d.startsWith(m)).map(d=>D.att[d][s.id]).filter(Boolean);
  const P=days.filter(x=>x==='P').length,H=days.filter(x=>x==='H').length,A=days.filter(x=>x==='A').length;
  const earned=r2((+s.salary||0)/daysInMonth(m)*(P+H/2));
  const tx=D.txns.filter(t=>t.staffId===s.id),adv=sum(tx.filter(t=>t.head==='Staff Advance'&&t.date.startsWith(m)),'amount'),
    paid=sum(tx.filter(t=>t.head==='Salary / Wages'&&t.salMonth===m),'amount');
  return {P,H,A,earned,adv,paid,payable:r2(Math.max(0,earned-adv-paid))};}

    <p class="muted">P = Present · H = Half day · A = Absent</p></div>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">👥 Staff List</h3><button class="btn sm" onclick="editStaff()">➕ Add Staff</button></div>
    <table style="margin-top:8px"><thead><tr><th>Naam</th><th>Kaam</th><th class="n">Salary/Month</th><th></th></tr></thead><tbody>
    ${D.staff.map(s=>`<tr style="${s.left?'opacity:.5':''}"><td>${esc(s.name)}${s.left?' (left)':''}</td><td>${esc(s.role||'')}</td><td class="n">${rs(s.salary)}</td><td><button class="btn sm" onclick="editStaff('${s.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div></div>
  <div class="card" style="padding:0;overflow:auto"><div class="title" style="margin:0">Salary Sheet <span class="r">Month: <input type="month" value="${stMonth}" onchange="stMonth=this.value;scrStaff()"></span></div>
    <table><thead><tr><th>Naam</th><th class="n">Salary</th><th class="n">P</th><th class="n">H</th><th class="n">A</th><th class="n">Earned</th><th class="n">Advance</th><th class="n">Paid</th><th class="n">Payable</th><th></th></tr></thead><tbody>
    ${D.staff.map(s=>{const m=staffMonth(s,stMonth);if(s.left&&!m.P&&!m.H&&!m.adv&&!m.paid)return '';
      return `<tr><td><b>${esc(s.name)}</b></td><td class="n">${rs(s.salary)}</td><td class="n green">${m.P}</td><td class="n">${m.H}</td><td class="n red">${m.A}</td>
      <td class="n">${money(m.earned)}</td><td class="n">${m.adv?money(m.adv):''}</td><td class="n">${m.paid?money(m.paid):''}</td><td class="n"><b>${money(m.payable)}</b></td>
      <td style="white-space:nowrap">${m.payable>0?`<button class="btn ok sm" onclick="paySalary('${s.id}')">Pay</button>`:''} ${s.phone?`<button class="btn wa sm" onclick="waOpen('${esc(s.phone)}',slipText('${s.id}'))">Slip</button>`:''}</td></tr>`;}).join('')}
    </tbody></table></div>
  <p class="muted">Salary = (Monthly salary ÷ mahine ke din) × (Present + Half/2). Paid leave / weekly off ke din P mark karein. Advance aur salary payment Expense mein bhi jud jaate hain.</p>`;}
function markAtt(id,k){const a=D.att[stDate]=D.att[stDate]||{};if(a[id]===k)delete a[id];else a[id]=k;save();scrStaff();}
function staffAdv(id){const s=D.staff.find(x=>x.id===id),v=+prompt(`${s.name} ko kitna advance diya? (₹, Cash)`);if(!(v>0))return;
  D.txns.push({id:uid(),type:'Expense',date:today(),time:nowTime(),head:'Staff Advance',desc:s.name,party:s.name,amount:v,mode:'Cash',staffId:id});save();toast('Advance save — Expense mein juda');scrStaff();}
function paySalary(id){const s=D.staff.find(x=>x.id===id),m=staffMonth(s,stMonth);
  const v=+prompt(`${s.name} — ${stMonth} salary\nEarned ${m.earned} − Advance ${m.adv} − Paid ${m.paid}\n\nKitna dena hai? (₹)`,m.payable);if(!(v>0))return;
  const mode=confirm('Cash mein diya? (Cancel = UPI)')?'Cash':'UPI';
  D.txns.push({id:uid(),type:'Expense',date:today(),time:nowTime(),head:'Salary / Wages',desc:`${s.name} — ${stMonth}`,party:s.name,amount:v,mode,staffId:id,salMonth:stMonth});
  save();toast('Salary entry save');scrStaff();}
function slipText(id){const s=D.staff.find(x=>x.id===id),m=staffMonth(s,stMonth);
  return `*${D.settings.name} — Salary Slip*\n👤 ${s.name}${s.role?' ('+s.role+')':''}\n📅 ${stMonth}\n\nMonthly Salary: ₹${s.salary}\nPresent: ${m.P} · Half: ${m.H} · Absent: ${m.A}\nEarned: ₹${m.earned}\nAdvance: −₹${m.adv}\nPaid: ₹${m.paid}\n*Baaki: ₹${m.payable}*`;}
function editStaff(id){const s=D.staff.find(x=>x.id===id)||{name:'',role:'',phone:'',salary:''};
  modal(id?'Edit Staff':'New Staff',`<div class="grid">
    <div><label>Naam</label><input id="sf_name" value="${esc(s.name)}" autofocus></div>
    <div><label>Kaam</label><input id="sf_role" list="roles" value="${esc(s.role)}"><datalist id="roles"><option>Chef</option><option>Helper</option><option>Waiter</option><option>Cashier</option><option>Cleaner</option><option>Delivery</option></datalist></div>
    <div><label>Mobile (WhatsApp)</label><input id="sf_phone" value="${esc(s.phone)}" inputmode="tel"></div>
    <div><label>Monthly Salary (₹)</label><input id="sf_sal" type="number" value="${s.salary}"></div></div>
    <div class="btns"><button class="btn ok" onclick="saveStaff('${id||''}')">Save</button>
    ${id?`<button class="btn bad" onclick="const x=D.staff.find(y=>y.id==='${id}');x.left=!x.left;save();closeModal();scrStaff()">${s.left?'Wapas Active':'Kaam chhod diya'}</button>`:''}
    <button class="btn g" onclick="closeModal()">Cancel</button></div>`);}
function saveStaff(id){const name=$('#sf_name').value.trim();if(!name){toast('Naam daalein');return;}
  const v={name,role:$('#sf_role').value.trim(),phone:$('#sf_phone').value.trim(),salary:+$('#sf_sal').value||0};
  if(id)Object.assign(D.staff.find(x=>x.id===id),v);else D.staff.push({id:uid(),...v});save();closeModal();scrStaff();}

/* ================= SETTINGS ================= */
function scrSettings(){const s=D.settings;
  const f=(k,l,t='text')=>`<div><label>${l}</label><input id="st_${k}" type="${t}" value="${esc(s[k])}"></div>`;
  main.innerHTML=`<div class="title">Settings & Backup</div>
  <div class="card"><h3 style="margin-top:0">Hotel Details (bill par chhapega)</h3><div class="grid">
    ${f('name','Hotel Name')}${f('address','Address')}${f('phone','Phone')}${f('gstin','GSTIN (optional)')}
    ${f('gst','GST % (0 = no GST)','number')}${f('owner','Owner WhatsApp Number','tel')}${f('footer','Bill Footer Message')}
    ${['bill','kot'].map(k=>`<div><label>${k==='bill'?'Customer Bill':'Kitchen KOT'} Paper</label><select id="st_${k}Paper"><option value="A6" ${(s[k+'Paper']||'A6')==='A6'?'selected':''}>A6 (105 × 148 mm)</option><option value="thermal" ${s[k+'Paper']==='thermal'?'selected':''}>Thermal roll</option></select></div>`).join('')}
    <div><label>Thermal Roll Size</label><select id="st_width"><option value="80" ${s.width!=58?'selected':''}>80 mm thermal</option><option value="58" ${s.width==58?'selected':''}>58 mm thermal</option></select></div>
  </div><div class="btns"><button class="btn ok" onclick="saveSettings()">💾 Save Settings</button></div></div>
  <div class="card"><h3 style="margin-top:0">Growth Features</h3><div class="grid">
    ${f('upi','UPI ID (bill par Scan & Pay QR)')}${f('review','Google Review Link')}${f('orderWa','Order WhatsApp Number (QR orders)','tel')}${f('menuUrl','Online Menu Page Link')}
    <div><label>Loyalty Points</label><select id="st_loyalty"><option value="1" ${s.loyalty?'selected':''}>ON</option><option value="0" ${s.loyalty?'':'selected'}>OFF</option></select></div>
    ${f('ptsPer100','Points per ₹100 bill','number')}${f('ptValue','1 Point = ₹','number')}${f('minRedeem','Min points to redeem','number')}
    ${f('swiggyPct','Swiggy commission %','number')}${f('zomatoPct','Zomato commission %','number')}${f('kotLate','KOT late alert (minutes)','number')}
  </div><div class="btns"><button class="btn ok" onclick="saveSettings()">💾 Save Settings</button></div></div>
  <div class="card"><h3 style="margin-top:0">Backup / Restore</h3>
    <p class="muted">Saara data isi computer ke browser mein save hota hai. Roz ek backup file download kar lein.</p>
    <div class="btns"><button class="btn" onclick="backup()">⬇️ Download Backup</button>
    <label class="btn g" style="margin:0;color:var(--bar);font-size:14px">⬆️ Restore Backup<input type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"></label>
    <button class="btn bad" onclick="resetAll()">🗑️ Reset All Data</button></div></div>`;}
function saveSettings(){['name','address','phone','gstin','owner','footer','upi','review','orderWa','menuUrl'].forEach(k=>D.settings[k]=$('#st_'+k).value.trim());
  ['ptsPer100','ptValue','minRedeem','swiggyPct','zomatoPct','kotLate'].forEach(k=>D.settings[k]=+$('#st_'+k).value||0);D.settings.loyalty=$('#st_loyalty').value==='1';
  D.settings.gst=+$('#st_gst').value||0;D.settings.width=+$('#st_width').value;D.settings.billPaper=$('#st_billPaper').value;D.settings.kotPaper=$('#st_kotPaper').value;save();$('#hname').textContent=D.settings.name;toast('Settings save ho gayi');}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));
  a.download=`hotel-erp-backup-${today()}.json`;a.click();}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.settings||!x.bills)throw 0;
  if(!confirm('Current data replace ho jayega. Restore karein?'))return;D=migrate(x);save();toast('Restore ho gaya');go('gateway');}catch(e){alert('Galat backup file');}};r.readAsText(f);}
function resetAll(){if(prompt('Saara data delete hoga. Confirm ke liye RESET likhein')!=='RESET')return;D=seed();save();go('gateway');}

drawSide();go('gateway');
</script>
</body>
</html>
