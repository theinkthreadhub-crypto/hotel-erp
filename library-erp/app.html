<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library ERP</title>
<style>
:root{
  --bar:#2b4c7e; --bar2:#1f3a63; --bg:#fffdf0; --panel:#fff; --line:#d9d2b0; --ink:#1d1d1d; --muted:#6b6b6b;
  --hi:#fff3b0; --ok:#1e7d32; --bad:#c62828; --warn:#ef6c00; --side:#e9eef6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.4 "Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #bdb59a;border-radius:3px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #f5c400;background:var(--hi)}
button:focus-visible{outline:3px solid #f5c400;outline-offset:2px}
input[readonly]{background:#f6f3e4}
#top{background:var(--bar);color:#fff;display:flex;align-items:center;gap:14px;padding:6px 14px}
#top b{font-size:17px;letter-spacing:.3px}
#top .scr{background:var(--bar2);padding:2px 10px;border-radius:3px;font-size:13px}
#top .lic{font-size:12px;padding:2px 8px;border-radius:3px;background:#ffffff22}
#top .lic.low{background:var(--bad)}#top .lic:empty{display:none}
#top .cd{font:600 13px Consolas,monospace;background:#ef6c00;order:0}
#top .cd.last{background:var(--bad);animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{background:#7f1d1d}}
#top .clock{margin-left:auto;font-size:13px;opacity:.9}
#wrap{flex:1;display:flex;min-height:0}
#main{flex:1;overflow:auto;padding:14px}
#side{width:190px;background:var(--side);border-left:1px solid var(--line);overflow:auto;padding:6px}
#side button{display:flex;width:100%;text-align:left;background:#fff;border:1px solid #bccbe0;margin:0 0 4px;padding:6px 8px;border-radius:3px;font-size:13px}
#side button:hover{background:var(--hi)}
#side button u{font-weight:700;color:var(--bar);text-decoration:none;width:42px;flex:none}
#side .keys{font-size:11px;color:var(--muted);padding:6px 4px;border-top:1px solid #bccbe0;margin-top:6px}
.title{background:var(--bar);color:#fff;padding:6px 12px;font-weight:600;display:flex;align-items:center;gap:10px;margin:-14px -14px 14px;flex-wrap:wrap}
.title .r{margin-left:auto;font-weight:400;font-size:13px;display:flex;gap:6px;align-items:center}
.title input,.title select{width:auto;padding:2px 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:12px}
.card h4{margin:0 0 8px;color:var(--bar)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.grid .w2{grid-column:span 2}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:start}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>.fix{flex:none;width:auto}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
label i{color:var(--bad);font-style:normal}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:6px 8px;border-bottom:1px solid #eee8cf;text-align:left;vertical-align:middle}
th{background:#f3eed3;font-weight:600;font-size:13px;position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#fffbe0}
tr.sel td{background:var(--hi)!important;box-shadow:inset 0 1px 0 #e0c200,inset 0 -1px 0 #e0c200}
tr.cx td{color:#999;text-decoration:line-through}
tfoot td{font-weight:700;background:#f8f4de}
.btn{background:var(--bar);color:#fff;border:0;padding:8px 14px;border-radius:3px}
.btn:hover{background:var(--bar2)}
.btn.g{background:#fff;color:var(--bar);border:1px solid var(--bar)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.wa{background:#1fa855}
.btn.sm{padding:3px 8px;font-size:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.muted{color:var(--muted)}.red{color:var(--bad);font-weight:600}.green{color:var(--ok);font-weight:600}
.small{font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600;white-space:nowrap}
.tag.ok{background:#e3f4e5;color:var(--ok)}.tag.due{background:#fde2e2;color:var(--bad)}.tag.soon{background:#ffe9cc;color:#b45309}.tag.left{background:#eee;color:#666}
.hint{background:#eef3fb;border:1px solid #c9d6ea;border-radius:4px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.hint b{color:var(--bar)}
kbd{background:#fff;border:1px solid #bbb;border-bottom-width:2px;border-radius:3px;padding:0 4px;font:11px Consolas,monospace}
/* gateway */
.gw{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start;padding-top:10px}
.gwbox{width:340px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px #0001}
.gwbox h3{margin:0;background:var(--bar);color:#fff;text-align:center;padding:8px;font-size:15px}
.gwbox .sec{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 18px 2px}
.gwbox .it{padding:5px 18px;cursor:pointer;display:flex;gap:6px}
.gwbox .it u{color:var(--bad);font-weight:700;text-decoration:none}
.gwbox .it.on,.gwbox .it:hover{background:var(--hi)}
.stats{width:310px}
.stat{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px dashed #e6dfbf}
.stat b{font-variant-numeric:tabular-nums}
.stat.link{cursor:pointer}.stat.link:hover{background:var(--hi)}
/* student picker */
.pick{position:relative}
#sugg,.sugg{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #bdb59a;z-index:5;max-height:300px;overflow:auto;box-shadow:0 6px 18px #0002}
#sugg div,.sugg div{padding:6px 10px;cursor:pointer;border-bottom:1px solid #f1ecd6}
#sugg div.on,#sugg div:hover,.sugg div.on,.sugg div:hover{background:var(--hi)}
.info td{border:0;padding:3px 6px}.info td:first-child{color:var(--muted);width:40%}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .big{font-size:22px;font-weight:700;color:var(--bar);border-top:2px solid var(--bar);margin-top:4px;padding-top:6px}
.scan{font-size:20px;padding:10px 12px}
.agrid td,.agrid th{padding:3px 2px;text-align:center;font-size:11px;border:1px solid #eee8cf}
.agrid td.nm,.agrid th.nm{text-align:left;white-space:nowrap;padding:3px 6px}
.agrid .p{color:var(--ok);font-weight:700}
.err td{background:#fff0f0}
/* dashboard */
.dash{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
.dash .gwbox{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:default}
.kpi.link{cursor:pointer}.kpi.link:hover{border-color:#e0c200;background:#fffdf3}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi.hero .v{font-size:30px;color:var(--bar)}
.kpi .s{font-size:12px;color:var(--muted)}
.meter{height:12px;background:#d6e6fa;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:#2a78d6;border-radius:6px}
.charts{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.chart h4{margin:0 0 2px}.chart .sub{font-size:12px;color:var(--muted);margin-bottom:6px}
.chart svg{display:block;width:100%;height:auto;max-height:300px;overflow:visible}
.chart svg text{font:11px "Segoe UI",Arial,sans-serif;fill:#6b6b6b}
.chart svg text.v{fill:#1d1d1d;font-weight:600}
.chart svg [data-tip]{cursor:pointer}.chart svg [data-tip]:hover{opacity:.82}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
#tip{position:fixed;pointer-events:none;background:#1d1d1d;color:#fff;font-size:12px;padding:5px 9px;border-radius:4px;z-index:70;display:none;white-space:nowrap}
@media (max-width:1100px){.dash{grid-template-columns:1fr}.charts{grid-template-columns:1fr}}
/* gateway dropdown */
.gwbox .gh{padding:7px 14px;cursor:pointer;display:flex;gap:8px;font-weight:600;border-top:1px solid #f0ebd5}
.gwbox .gh:first-child{border-top:0}
.gwbox .gh u{color:var(--bad);text-decoration:none;width:14px}
.gwbox .gh span{margin-left:auto;color:var(--muted)}
.gwbox .gh.open{background:#eef3fb}
.gwbox .gh.on,.gwbox .gh:hover{background:var(--hi)}
.gwbox .it.sub{padding:5px 14px 5px 36px;font-size:13.5px}
#side .sg{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:8px 2px 3px}
#top .lic.sess{background:#ffffff33;padding:1px 4px 1px 8px}
#top .lic.sess select{width:auto;padding:1px 4px;font-size:12px;border:0;border-radius:3px;margin-left:4px;background:#fff;color:var(--ink)}
/* month chips */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.mc{display:flex;align-items:flex-start;gap:6px;border:1px solid #cfc7a6;border-radius:4px;padding:6px 8px;background:#fff;cursor:pointer;font-size:13px;margin:0;color:var(--ink)}
.mc input{width:auto;margin:2px 0 0}
.mc small{display:block;font-size:11px;color:var(--muted)}
.mc.paid{background:#e3f4e5;border-color:#9ccfa3;cursor:default}.mc.paid small{color:var(--ok)}
.mc.due{background:#fdecec;border-color:#f0b4b4}.mc.due small{color:var(--bad)}
.mc.on{background:var(--hi);border-color:#e0c200;font-weight:600}
.mc:focus-within{outline:2px solid #f5c400}
.xgrid{display:flex;flex-wrap:wrap;gap:6px}
/* modal */
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.open{display:flex}
#mbox{background:#fff;border-radius:4px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 10px 40px #0004}
#mbox h3{margin:0;background:var(--bar);color:#fff;padding:9px 14px;font-size:15px}
#mbox .in{padding:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:4px;display:none;z-index:60;font-size:15px}
#toast.bad{background:var(--bad)}#toast.ok{background:var(--ok)}
/* activation */
.act{max-width:560px;margin:40px auto}
.mcode{font:700 30px Consolas,monospace;letter-spacing:3px;text-align:center;background:#f3eed3;border:2px dashed var(--bar);padding:12px;border-radius:6px;user-select:all}
#print{display:none}
.lhead{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;box-shadow:0 1px 4px #1d2b4a1a;padding:12px;margin-bottom:12px}
.lhead img,.lhead span{width:52px;height:52px;border-radius:12px;object-fit:contain;flex:none;background:#eef3fb;display:flex;align-items:center;justify-content:center;font-size:28px}
.lhead b{display:block;font-size:17px;color:var(--bar)}.lhead small{color:var(--muted)}
.logobox{display:flex;gap:14px;align-items:center;margin-top:4px}
.logobox img{width:88px;height:88px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff;padding:4px}
.logobox .nologo{width:88px;height:88px;border:1px dashed #bdb59a;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.rcpt .rlogo{max-width:60%;max-height:18mm;object-fit:contain;margin-bottom:2px}
#drawer .dlogo img{width:100%;height:100%;object-fit:contain;border-radius:12px;background:#fff}
#mhome{display:none;background:#ffffff22;color:#fff;border:0;border-radius:4px;font-size:18px;padding:2px 10px}
@media (max-width:700px){
  #mhome{display:block}
  #top{flex-wrap:wrap;gap:6px 8px;padding:6px 10px}#top b{font-size:15px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #top .clock{display:none}#top .scr{font-size:12px}
  #main{padding:10px}.title{margin:-10px -10px 10px;padding:8px 10px}
  .card{overflow-x:auto}.grid{grid-template-columns:1fr 1fr}.grid .w2{grid-column:1/-1}
  table{font-size:13px}td,th{white-space:nowrap}
  .btn{padding:9px 12px}input,select,textarea{font-size:16px;padding:8px}
  .kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:19px}.kpi.hero .v{font-size:24px}
  #toast{width:max-content;max-width:92vw;text-align:center}
}
@media (max-width:900px){.two{grid-template-columns:1fr}#side{display:none}}
/* ===== receipt slip ===== */
.rcpt{font:12px/1.35 "Courier New",monospace;color:#000;padding:2mm 0}
.rcpt.w58{width:48mm;font-size:11px}.rcpt.w80{width:72mm}
.rcpt .c{text-align:center}.rcpt .r{text-align:right}
.rcpt td.r{white-space:nowrap}
.rcpt .h{font-size:16px;font-weight:700}
.rcpt .tt{font-weight:700;border-top:1px dashed #000;border-bottom:1px dashed #000;margin:4px 0;padding:2px 0;letter-spacing:1px}
.rcpt table{background:none;width:100%}
.rcpt td,.rcpt th{padding:1px 0;border:0;font-size:inherit;background:none!important;vertical-align:top}
.rcpt th{border-bottom:1px dashed #000!important;text-align:left}
.rcpt tfoot td{font-weight:400}
.rcpt tfoot tr:first-child td{border-top:1px dashed #000}
.rcpt .bg td{font-size:1.25em;font-weight:700}
.rcpt .vt{margin:4px 0;border:1px solid #000;padding:2px}
.rcpt .ft{margin-top:4px;font-size:.9em}
.rcpt.big{font:13px/1.5 Arial,sans-serif;border:1.5px solid #000;padding:5mm}
.rcpt.wA6{width:93mm}.rcpt.wA5{width:128mm;font-size:14px}.rcpt.wA4{width:180mm;font-size:15px}
.rcpt.big .h{font-size:1.8em}
.rcpt.big .tt{border-top-style:solid;border-bottom-style:solid;font-size:1.1em}
.rcpt.big td,.rcpt.big th{padding:3px 4px}
.rcpt.big .it td,.rcpt.big .it th{border:1px solid #000!important}
.rcpt .sign{display:flex;justify-content:space-between;margin-top:12mm;font-size:.9em}
.rcpt .sign span{border-top:1px solid #000;padding-top:2px;min-width:30%;text-align:center}
.rep{font:12px Arial,sans-serif;color:#000}
.rep table td,.rep table th{border:1px solid #999;padding:3px 5px}

/* ===== phone app (html.mobile — Android app) ===== */
#drawer,#dmask,#bnav{display:none}
html.mobile{--bg:#f3f5f9;--line:#e3e7ef;--hi:#fff6c7}
html.mobile body{font-size:15px;background:var(--bg)}
html.mobile #side{display:none}
html.mobile #top{position:sticky;top:0;z-index:30;flex-wrap:nowrap;gap:8px;padding:8px 10px;box-shadow:0 2px 6px #0002}
html.mobile #mhome{display:block;font-size:22px;padding:4px 10px;background:none}
html.mobile #libname{display:none}
html.mobile #top .scr{background:none;font-size:18px;font-weight:600;padding:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.mobile #top .clock,html.mobile #top #lic:not(.low){display:none}
html.mobile #top .lic.sess{font-size:0;padding:0;background:none}
html.mobile #top .lic.sess select{font-size:13px;margin:0;padding:4px 6px;border-radius:6px}
html.mobile #wrap{padding-bottom:64px}
html.mobile #main{padding:12px}
html.mobile .title{margin:-12px -12px 12px;background:#fff;color:var(--bar);font-size:17px;padding:10px 12px;border-bottom:1px solid var(--line)}
html.mobile .title .r{margin-left:0;width:100%;flex-wrap:wrap}
html.mobile .card,html.mobile .kpi{border:0;border-radius:14px;box-shadow:0 1px 4px #1d2b4a1a;overflow-x:auto}
html.mobile .hint{border-radius:12px}
html.mobile .two,html.mobile .charts,html.mobile .dash{display:block}
html.mobile .grid{grid-template-columns:1fr 1fr}html.mobile .grid .w2{grid-column:1/-1}
html.mobile input,html.mobile select,html.mobile textarea{font-size:16px;padding:10px 12px;border-radius:10px;border-color:#cfd6e3}
html.mobile input:focus,html.mobile select:focus,html.mobile textarea:focus{outline:2px solid var(--bar);background:#fff}
html.mobile .btn{border-radius:10px;padding:11px 16px;font-weight:600}
html.mobile .btn.sm{padding:7px 11px;border-radius:8px}
html.mobile .btns{gap:8px;flex-wrap:wrap}
html.mobile table{font-size:14px}html.mobile td,html.mobile th{white-space:nowrap;padding:8px}
html.mobile tr.sel td{background:transparent}
html.mobile .kpis{grid-template-columns:1fr 1fr;gap:10px}
html.mobile .kpi .v{font-size:20px}html.mobile .kpi.hero{grid-column:1/-1}html.mobile .kpi.hero .v{font-size:28px}
html.mobile kbd,html.mobile .keys{display:none}
html.mobile #modal{align-items:flex-end;padding:0}
html.mobile #mbox{width:100%;border-radius:18px 18px 0 0;max-height:88vh}
html.mobile #mbox h3{border-radius:18px 18px 0 0;padding:14px 16px}
html.mobile .rq .btn{flex:1 1 100%;padding:14px;font-size:16px}
html.mobile #toast{bottom:auto;top:64px;border-radius:10px;width:max-content;max-width:92vw;text-align:center}
html.mobile .pick #sugg,html.mobile .sugg{max-height:50vh}
html.mobile #sugg div,html.mobile .sugg div{padding:11px 12px}
html.mobile .khelp{display:none}
.astat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.astat div{background:#fff;border-radius:14px;box-shadow:0 1px 4px #1d2b4a1a;padding:10px;text-align:center}.astat b{display:block;font-size:22px}.astat span{font-size:12px;color:var(--muted)}
.slist .av.in{background:#dff3e3;color:var(--ok)}.slist .av.out{background:#eceff4;color:#6b7385}
.slist .sa .btn{min-width:64px}
.slist .scard.done{opacity:.75;background:#f6fbf7}
.remsum{margin:10px 0 2px;font-size:15px}
.rprev{white-space:pre-wrap;background:#e9fbe9;border-radius:10px;padding:10px 12px;font:14px/1.45 "Segoe UI",Arial,sans-serif;margin:6px 0 0}
.tpk{display:inline-block;background:#eef3fb;border-radius:6px;padding:2px 6px;margin:2px 1px;text-decoration:none;font-family:Consolas,monospace;font-size:12px}
html.mobile .title{font-size:0;padding:8px 12px}html.mobile .title .r{font-size:14px}
html.mobile .title:has(.r:empty){display:none}
.slist .scard{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;box-shadow:0 1px 4px #1d2b4a1a;padding:12px;margin-bottom:10px;cursor:pointer}
.slist .av{width:42px;height:42px;border-radius:50%;background:#e3ebf7;color:var(--bar);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.slist .sc{flex:1;min-width:0}.slist .sc b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slist .sc small{display:block;color:var(--muted);font-size:12.5px;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slist .sa{display:flex;flex-direction:column;gap:6px}
/* drawer */
html.mobile #dmask{display:block;position:fixed;inset:0;background:#0006;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
html.mobile #dmask.open{opacity:1;pointer-events:auto}
html.mobile #drawer{display:block;position:fixed;top:0;bottom:0;left:0;width:82vw;max-width:320px;background:#fff;z-index:41;overflow:auto;
  transform:translateX(-102%);transition:transform .22s ease;box-shadow:4px 0 18px #0003;padding-bottom:20px}
html.mobile #drawer.open{transform:none}
#drawer .dhead{background:var(--bar);color:#fff;padding:22px 16px 16px;display:flex;gap:12px;align-items:center}
#drawer .dhead b{display:block;font-size:17px}#drawer .dhead small{opacity:.85;font-size:12px}
#drawer .dlogo{font-size:30px;background:#ffffff26;border-radius:12px;width:50px;height:50px;display:flex;align-items:center;justify-content:center;flex:none}
#drawer .dsec{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:14px 18px 4px}
#drawer a{display:flex;align-items:center;gap:14px;padding:11px 18px;color:var(--ink);text-decoration:none;font-size:15px}
#drawer a i{font-style:normal;width:24px;text-align:center;font-size:18px}
#drawer a.on{background:#e8eef8;color:var(--bar);font-weight:600;border-radius:0 24px 24px 0;margin-right:10px}
/* bottom tabs */
html.mobile #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;height:62px;background:#fff;border-top:1px solid var(--line);z-index:30;box-shadow:0 -2px 8px #0000000f}
#bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#6b7385;font-size:11px;text-decoration:none}
#bnav a i{font-style:normal;font-size:20px;line-height:1;filter:grayscale(1);opacity:.7}
#bnav a.on{color:var(--bar);font-weight:700}#bnav a.on i{filter:none;opacity:1}
/* home tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.tiles a{background:#fff;border-radius:14px;box-shadow:0 1px 4px #1d2b4a1a;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;
  text-align:center;color:var(--ink);text-decoration:none;font-size:12.5px;font-weight:600;cursor:pointer}
.tiles a i{font-style:normal;font-size:26px;width:46px;height:46px;border-radius:14px;background:#eef3fb;display:flex;align-items:center;justify-content:center}
.tiles a:active{transform:scale(.97);background:#f6f8fc}
@media print{
  body{display:block;background:#fff}
  #top,#wrap,#modal,#toast{display:none!important}
  #print{display:block}
}

<body>
<div id="top"><button id="mhome" onclick="window.MOBILE?drawer():D&&go('home')" title="Menu">☰</button><b id="libname" onclick="D&&go('home')" title="Go to Dashboard" style="cursor:pointer">Library ERP</b><span class="scr" id="scr">Gateway of Library</span><span class="lic sess" id="sess"></span><span class="lic" id="lic"></span><span class="lic cd" id="cd"></span><span class="clock" id="clock"></span></div>
<div id="dmask" onclick="drawer(false)"></div><div id="drawer"></div><nav id="bnav"></nav>
<div id="wrap"><div id="main"><p class="muted">Loading…</p></div><div id="side"></div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<div id="tip"></div>
<div id="print"></div>
<script>
/* ================= HELPERS ================= */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const dmy=d=>d?d.split('-').reverse().join('-'):'';
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const diff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const r2=n=>Math.round((+n||0)*100)/100;
const rs=n=>'₹'+r2(n).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+(+(typeof f==='function'?f(x):x[f])||0),0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
const num=id=>+val(id)||0;
const normPh=p=>{p=String(p||'').replace(/\D/g,'');return p.length>10?p.slice(-10):p;};
const MODES=['Cash','UPI','Card','Bank'];
const main=$('#main');

const DEF_SET={name:'My Library',address:'',contact:'',footer:'Fee non-refundable. Thank you!',slip:'80',autoPrint:true,autoWa:false,
  waMode:'web',owner:'',shifts:'Morning,Evening,Full Day',expDays:3,issueDays:15,finePerDay:0,maxBooks:2,
  mail:{user:'',pass:'',to:'',auto:true,host:'smtp.gmail.com',port:465}};
function seed(){return {settings:{...DEF_SET,mail:{...DEF_SET.mail}},plans:[],students:[],receipts:[],att:{},seq:{rcpt:0}};}
function migrate(s){
  s=s&&s.settings?s:seed();
  s.settings={...DEF_SET,...s.settings,mail:{...DEF_SET.mail,...(s.settings.mail||{})}};
  ['plans','students','receipts','expenses','books','issues'].forEach(k=>s[k]=s[k]||[]);s.att=s.att||{};s.seq=s.seq||{rcpt:0};
  if(!s.expHeads)s.expHeads=['Rent','Electricity','WiFi / Internet','Salary','Cleaning','Water','Stationery','Repair & Maintenance','Other']
    .map((n,i)=>({id:uid(),name:n,order:i+1,note:''}));
  if(!s.sessions||!s.sessions.length)s.sessions=[sessionFor(today())];
  if(!s.sessions.some(x=>x.id===s.settings.curSession))s.settings.curSession=(s.sessions.find(x=>x.from<=today()&&x.to>=today())||s.sessions[s.sessions.length-1]).id;
  // Purani entries ko date se session do
  const sessOf=d=>(s.sessions.find(x=>x.from<=d&&x.to>=d)||{}).id||s.settings.curSession;
  s.receipts.forEach(r=>{if(!r.sess)r.sess=sessOf(r.date);});
  s.expenses.forEach(x=>{if(!x.sess)x.sess=sessOf(x.date);});
  // Purana data: period (from-to) se paid mahine banao
  s.receipts.forEach(r=>{if(!r.mlist)r.mlist=r.from&&r.to?monthsCovered(r.from,r.to):[];});
  s.students.forEach(st=>{
    if(!Array.isArray(st.paid)){
      const P=new Set();s.receipts.filter(r=>r.sid===st.id&&!r.cancel).forEach(r=>r.mlist.forEach(m=>P.add(m)));
      if(!P.size&&st.validTill&&st.join)monthsCovered(st.join,st.validTill).forEach(m=>P.add(m));
      st.paid=[...P].sort();
    }
    syncValid(st);
  });
  return s;
}

let D=null,LIC=null,INFO={};
async function api(p,body){
  const r=await fetch('/api/'+p,body===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;
}
let saving=Promise.resolve();
function save(){
  const snap=JSON.stringify(D);
  saving=saving.then(()=>fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:snap}))
    .then(r=>{if(!r.ok)return r.json().then(j=>{throw new Error(j.error);});})
    .catch(e=>toast('Could not save data: '+e.message,'bad'));
  return saving;
}

function toast(t,cls){const e=$('#toast');e.textContent=t;e.className=cls||'';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',cls==='bad'?4000:2200);}
let askRes=null,lastFocus=null;
function modal(title,html){if(!isModal())lastFocus=document.activeElement;$('#mbox').innerHTML=`<h3>${esc(title)}</h3><div class="in">${html}</div>`;$('#modal').classList.add('open');
  setTimeout(()=>{const f=$('#mbox [autofocus]')||$('#mbox input,#mbox select,#mbox button');f&&f.focus();},30);}
function closeModal(){if(!isModal())return;$('#modal').classList.remove('open');
  setTimeout(()=>{if(isModal())return;const f=lastFocus&&document.contains(lastFocus)&&lastFocus!==document.body?lastFocus:main.querySelector('input,select,textarea');f&&f.focus();},10);if(askRes){const r=askRes;askRes=null;r(false);}}
const isModal=()=>$('#modal').classList.contains('open');
function ask(msg,yes='Yes',no='No'){return new Promise(res=>{
  modal('Confirm',`<p style="font-size:15px">${msg}</p><div class="btns"><button class="btn" data-k="Y" autofocus id="ay">${yes} (Y)</button><button class="btn g" data-k="N" id="an">${no} (N)</button></div>`);
  askRes=res;$('#ay').onclick=()=>{askRes=null;closeModal();res(true);};$('#an').onclick=()=>closeModal();});}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(text instanceof Blob?text:new Blob([text],{type:type||'text/plain'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
const csvCell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
const toCsv=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');

function waOpen(num,text){
  let n=String(num||'').replace(/\D/g,'');
  if(n.length===10)n='91'+n;
  if(!n){toast('Mobile number missing','bad');return;}
  const t=encodeURIComponent(text);
  if(window.MOBILE)window.open(`whatsapp://send?phone=${n}&text=${t}`);  // phone: seedha WhatsApp app ki chat
  else if(D&&D.settings&&D.settings.waMode==='app')location.href=`whatsapp://send?phone=${n}&text=${t}`;
  else window.open(`https://wa.me/${n}?text=${t}`,'_blank');
}
function words(n){
  n=Math.round(+n||0);if(!n)return 'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  const o=[],cr=Math.floor(n/1e7),l=Math.floor(n%1e7/1e5),th=Math.floor(n%1e5/1e3),h=n%1e3;
  if(cr)o.push(three(cr)+' Crore');if(l)o.push(two(l)+' Lakh');if(th)o.push(two(th)+' Thousand');if(h)o.push(three(h));
  return o.join(' ');
}

/* ================= MONTHS ================= */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mName=m=>MON[+m.slice(5)-1]+' '+m.slice(0,4);
const mAdd=(m,n)=>{let y=+m.slice(0,4),k=+m.slice(5)-1+n;y+=Math.floor(k/12);k=((k%12)+12)%12;return y+'-'+pad(k+1);};
const mEnd=m=>ymd(new Date(+m.slice(0,4),+m.slice(5),0));
const curMonth=()=>today().slice(0,7);
function mRange(a,b){const o=[];for(let m=a;m<=b&&o.length<600;m=mAdd(m,1))o.push(m);return o;}
// Date range ke mahine: aakhri mahina tab gina jab usme 15+ din cover hon
function monthsCovered(from,to){
  if(!from||!to||to<from)return [];
  let a=from.slice(0,7),b=to.slice(0,7);
  if(b>a&&+to.slice(8)<15)b=mAdd(b,-1);
  return mRange(a,b);
}
// "Oct 2026 – Dec 2026 (3 mahine)"
function mText(list){
  if(!list||!list.length)return '';
  const L=[...list].sort(),g=[];let st=L[0],pv=L[0];
  for(const m of L.slice(1)){if(m===mAdd(pv,1)){pv=m;continue;}g.push([st,pv]);st=pv=m;}g.push([st,pv]);
  return g.map(([a,b])=>a===b?mName(a):`${mName(a)} – ${mName(b)}`).join(', ')+(L.length>1?` (${L.length} months)`:'');
}

/* ================= SESSIONS ================= */
// Session = April se March (jaise 2026-27). Client khud naya bana sakta hai.
function sessionFor(d){const y=+d.slice(0,4),st=+d.slice(5,7)>=4?y:y-1;
  return {id:uid(),name:st+'-'+String(st+1).slice(2),from:st+'-04-01',to:(st+1)+'-03-31'};}
const curSess=()=>D.sessions.find(x=>x.id===D.settings.curSession)||D.sessions[0];
const sessById=id=>D.sessions.find(x=>x.id===id);
const sessOfDate=d=>(D.sessions.find(x=>x.from<=d&&x.to>=d)||curSess()).id;
const nextNo=(list,sess)=>1+Math.max(0,...list.filter(x=>x.sess===sess).map(x=>+x.no||0));
// Session ke mahine (Apr..Mar) aur us session ka "aaj ka mahina"
const sessMonths=(x=curSess())=>[x.from.slice(0,7),x.to.slice(0,7)];
function sessRefMonth(x=curSess()){const [a,b]=sessMonths(x),c=curMonth();return c<a?a:c>b?b:c;}
const sessSorted=()=>D.sessions.slice().sort((a,b)=>b.from.localeCompare(a.from));
function sessBar(){const e=$('#sess');if(!e)return;const c=curSess();
  e.innerHTML=`Session <select id="sesssel" title="Switch session — the whole ERP shows this session">${sessSorted().map(x=>`<option value="${x.id}"${x.id===c.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select>`;
  $('#sesssel').onchange=ev=>switchSession(ev.target.value);}
function resetRanges(){rFrom=rTo=dbFrom=dbTo=xFrom=xTo=null;plSess=null;}
function switchSession(id){const x=sessById(id);if(!x)return;D.settings.curSession=id;save();resetRanges();sessBar();
  toast(`Session ${x.name}`,'ok');go(cur,cur==='collect'?colSid:curArg);}

/* ================= STUDENT LOGIC ================= */
const plan=id=>D.plans.find(p=>p.id===id);
const stu=id=>D.students.find(s=>s.id===id);
const byOrder=(a,b)=>(+a.order||999)-(+b.order||999)||a.name.localeCompare(b.name);
const plansSorted=()=>D.plans.slice().sort(byOrder);
const periodic=()=>plansSorted().filter(p=>+p.days>0);
const oneTime=()=>plansSorted().filter(p=>!(+p.days>0));
const active=()=>D.students.filter(s=>s.status!=='left');
function nextCode(){return String(Math.max(1000,...D.students.map(s=>parseInt(s.code,10)||0))+1);}
// Ek mahine ki fee (90 din wale plan ki fee / 3)
function monthRate(s,pid){
  const p=plan(pid||s.planId);if(!p)return 0;
  const amt=(!pid||pid===s.planId)?+s.fee:+p.amount;
  return +p.days>31?Math.round(amt*30/p.days):amt;
}
function syncValid(s){const p=(s.paid||[]).slice().sort();s.paid=p;s.validTill=p.length?mEnd(p[p.length-1]):'';}
// Due mahine: sirf chune hue session ke (join se pehle ke nahi, aaj ke baad ke nahi)
function unpaidMonths(s,x=curSess()){
  const P=new Set(s.paid||[]),[a,b]=sessMonths(x),jm=(s.join||today()).slice(0,7),st=a>jm?a:jm,en=b<curMonth()?b:curMonth();
  return st>en?[]:mRange(st,en).filter(m=>!P.has(m));
}
// Doosre sessions ki due: [{x, u, amt}]
function otherDues(s){return s.status==='left'?[]:sessSorted().filter(x=>x.id!==D.settings.curSession).map(x=>{const u=unpaidMonths(s,x);return {x,u,amt:u.length*monthRate(s)};}).filter(d=>d.u.length);}
function otherDueHtml(s){const L=otherDues(s);return L.length?`<div class="hint" style="background:#fff4e5;border-color:#f3c98b">Other session dues: ${L.map(d=>`<b>${esc(d.x.name)}</b> — ${esc(mText(d.u))} (${rs(d.amt)}) <button class="btn sm" onclick="switchSession('${d.x.id}');go('collect','${s.id}')">Switch to ${esc(d.x.name)} &amp; collect</button>`).join(' &nbsp; ')}</div>`:'';}
function stStatus(s){
  if(s.status==='left')return {k:'left',t:'Left'};
  const u=unpaidMonths(s);
  if(u.length)return {k:'due',t:u.length===1?`${mName(u[0])} due`:`${u.length} months due`,od:u.length,u};
  const left=diff(today(),s.validTill);
  if(left<=(+D.settings.expDays||0))return {k:'soon',t:left?left+' days left':'Ends today',left};
  return {k:'ok',t:'Paid',left};
}
const tag=s=>{const st=stStatus(s);return `<span class="tag ${st.k}">${esc(st.t)}</span>`+(s.bal>0?` <span class="tag due">Balance ${rs(s.bal)}</span>`:'');};
function dueAmt(s){const st=stStatus(s);return (st.k==='due'?st.od*monthRate(s):0)+(+s.bal||0);}
function findStudents(q,all){
  q=String(q||'').trim().toLowerCase();const list=all?D.students:active();
  if(!q)return list;
  const qd=q.replace(/\D/g,'');
  return list.filter(s=>String(s.code).toLowerCase()===q||s.name.toLowerCase().includes(q)||(s.father||'').toLowerCase().includes(q)||
    (qd.length>=4&&String(s.mobile).includes(qd))||String(s.seat||'').toLowerCase()===q);
}
/* ---- reminder templates: {name} jaise shabd student ki jaankari se badal jaate hain ---- */
const TPL_DEF=[
  {id:'month',name:"This month's fee due",text:'Dear {name},\nYour library fee for *{month}* is due.\nAmount: *{amount}*\nPlease pay by {last_date}.\n\nThank you,\n{library}\n{contact}'},
  {id:'old',name:'Old fee pending',text:'Dear {name},\nYour library fee for {due_months} is pending.\nTotal due: *{amount}*\nPlease pay at the earliest to keep your seat {seat}.\n\n{library}\n{contact}'},
  {id:'soon',name:'Fee expiring soon',text:'Dear {name},\nYour library fee is valid till *{valid_till}*.\nPlease renew on time to keep your seat {seat}.\n\n{library}\n{contact}'},
];
const TPL_KEYS=['name','father','id','seat','shift','month','due_months','count','amount','fee','valid_till','last_date','library','contact','address'];
const tpls=()=>{const S=D.settings;if(!Array.isArray(S.tpls)||!S.tpls.length)S.tpls=TPL_DEF.map(t=>({...t}));return S.tpls;};
const tplById=id=>tpls().find(t=>t.id===id)||tpls()[0];
// Kaun sa template: sirf is mahine ki fee = month, purani bhi = old, khatam hone wali = soon
function autoTpl(s){const st=stStatus(s);if(st.k==='soon')return 'soon';if(st.k==='due'&&st.u.length===1&&st.u[0]===curMonth())return 'month';return 'old';}
function fillTpl(text,s){
  const S=D.settings,st=stStatus(s),u=st.u||[],cm=curMonth(),day=Math.min(28,Math.max(1,+S.remDay||10));
  const v={name:s.name,father:s.father||'',id:s.code,seat:s.seat||'—',shift:s.shift||'',month:mName(u.includes(cm)||!u.length?cm:u[u.length-1]),
    due_months:mText(u)||'—',count:u.length,amount:rs(dueAmt(s)||monthRate(s)),fee:rs(monthRate(s)),valid_till:s.validTill?dmy(s.validTill):'—',
    last_date:dmy(cm+'-'+pad(day)),library:S.name,contact:S.contact||'',address:S.address||''};
  return String(text).replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m).replace(/\n{3,}/g,'\n\n').trim();
}
function remindText(s,tid){return fillTpl(tplById(tid||autoTpl(s)).text,s);}
const waRemind=(id,tid)=>{const s=stu(id);if(!s)return;s.remAt=today()+' '+nowTime();save();waOpen(s.mobile,remindText(s,tid));};

/* ================= NAVIGATION / KEYBOARD ================= */
// Gateway: 4 groups with dropdowns. Every item also has its own letter (works on Gateway and with Alt from anywhere).
const GROUPS=[
  ['M','Masters',[['S','New Admission','student'],['L','Student List','list'],['F','Fee Master','plans'],['H','Expense Heads','heads'],['O','Books (Book Master)','books'],['N','Sessions','sessions']]],
  ['T','Transactions',[['C','Fee Collect (Receipt)','collect'],['E','Expense Entry','expense'],['A','Attendance (In / Out)','att'],['J','Book Issue / Return','bookissue'],['Z','Fee Reminder (WhatsApp)','remind']]],
  ['R','Reports',[['B','Day Book','daybook'],['P','Receipt List / Reprint','receipts'],['D','Due List & Reminder','due'],['V','Income vs Expense','pl'],['X','Expense Report','exprep'],['W','Attendance Report (Month)','attrep'],['Y','Book Issue Register','bookreg']]],
  ['U','Utilities',[['I','Bulk Import (Excel / CSV)','import'],['G','Settings & Backup','settings'],['K','License / Activation','license'],['Q','Close ERP','quit']]],
];
const MENU=GROUPS.flatMap(g=>g[2].map(x=>[x[0],x[1],x[2],g[1]]));
const SCREENS={home:scrHome,student:scrStudent,list:scrList,plans:scrPlans,collect:scrCollect,att:scrAtt,due:scrDue,receipts:scrReceipts,
  heads:scrHeads,expense:scrExpense,remind:scrRemind,books:scrBooks,bookissue:scrBookIssue,bookreg:scrBookReg,sessions:scrSessions,pl:scrPL,exprep:scrExpRep,
  daybook:scrDaybook,attrep:scrAttRep,record:scrRecord,import:scrImport,settings:scrSettings,license:scrLicense,quit:scrQuit};
let curArg=null,cur='home',gwSel=0,gwOpen=-1,onSave=null,nav=null,keyH=null;
function go(s,arg){
  if(!D)return;
  cur=s;curArg=arg;onSave=null;nav=null;keyH=null;closeModal();$('#tip').style.display='none';
  const m=MENU.find(x=>x[2]===s);
  $('#scr').textContent=m?m[1]:'Gateway of Library';$('#libname').textContent=D.settings.name;
  main.scrollTop=0;SCREENS[s](arg);
  if(window.MOBILE)mobNav(s);
}
function drawSide(){$('#side').innerHTML=`<button onclick="go('home')"><u>Esc</u>Gateway</button>`+
  GROUPS.map(g=>`<div class="sg">${g[1]}</div>`+g[2].map(m=>`<button onclick="go('${m[2]}')"><u>Alt+${m[0]}</u>${m[1]}</button>`).join('')).join('')+
  `<div class="keys"><b>Library ERP v${esc(LIC&&LIC.version||'')}</b>${LIC&&LIC.vendorPhone?`<br>Support: ${esc(LIC.vendor)} ${esc(LIC.vendorPhone)}`:''}<br><kbd>Enter</kbd> next field<br><kbd>Ctrl+S</kbd> Save / Accept<br><kbd>↑</kbd><kbd>↓</kbd> select in list<br><kbd>Esc</kbd> back</div>`;}
function gwRows(){const R=[];GROUPS.forEach((g,gi)=>{R.push({g:gi});if(gi===gwOpen)g[2].forEach(it=>R.push({it}));});return R;}
function gwHtml(){return gwRows().map((r,i)=>r.it?`<div class="it sub${i===gwSel?' on':''}" onclick="go('${r.it[2]}')"><u>${r.it[0]}</u>${r.it[1]}</div>`:
  `<div class="gh${r.g===gwOpen?' open':''}${i===gwSel?' on':''}" onclick="gwToggle(${r.g})"><u>${GROUPS[r.g][0]}</u>${GROUPS[r.g][1]}<span>${r.g===gwOpen?'▾':'▸'}</span></div>`).join('');}
function gwDraw(){const e=$('#gwmenu');if(e)e.innerHTML=gwHtml();}
function gwToggle(gi){gwOpen=gwOpen===gi?-1:gi;gwSel=gwRows().findIndex(r=>r.g===gi)+(gwOpen===gi?1:0);gwDraw();}

document.addEventListener('keydown',e=>{
  if(!D)return;
  const a=document.activeElement,tg=a&&a.tagName,typing=['INPUT','SELECT','TEXTAREA'].includes(tg);
  if(e.key==='Escape'){e.preventDefault();if(isModal())closeModal();else if(cur!=='home')go('home');else if(gwOpen>=0){const g=gwOpen;gwOpen=-1;gwSel=g;gwDraw();}return;}
  if(isModal()){
    if(!e.ctrlKey&&!e.altKey&&!(typing&&tg!=='SELECT')){const b=$(`#mbox [data-k="${e.key.toUpperCase()}"]`);if(b){e.preventDefault();b.click();}}
    return;
  }
  if(e.ctrlKey&&(e.key==='s'||e.key==='S'||e.key==='Enter')){e.preventDefault();if(onSave)onSave();return;}
  if(e.altKey&&!e.ctrlKey){const m=MENU.find(x=>x[0]===e.key.toUpperCase());if(m){e.preventDefault();go(m[2]);return;}}
  if(keyH&&keyH(e,typing))return;
  if(cur==='home'&&!typing&&!e.ctrlKey&&!e.altKey&&!e.metaKey){
    const R=gwRows(),r=R[gwSel]||R[0];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();gwSel=(gwSel+(e.key==='ArrowDown'?1:R.length-1))%R.length;gwDraw();return;}
    if(e.key==='Enter'){e.preventDefault();if(r.it)go(r.it[2]);else gwToggle(r.g);return;}
    if(e.key==='ArrowRight'&&r.g!==undefined&&gwOpen!==r.g){e.preventDefault();gwToggle(r.g);return;}
    if(e.key==='ArrowLeft'&&gwOpen>=0){e.preventDefault();const g=gwOpen;gwOpen=-1;gwSel=g;gwDraw();return;}
    const k=e.key.toUpperCase(),gi=GROUPS.findIndex(g=>g[0]===k);if(gi>=0){e.preventDefault();gwToggle(gi);return;}
    const m=MENU.find(x=>x[0]===k);if(m){e.preventDefault();go(m[2]);return;}
  }
  if(nav&&tg!=='SELECT'&&tg!=='TEXTAREA'&&!(typing&&a.dataset.nav===undefined)){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();navMove(e.key==='ArrowDown'?1:-1);return;}
    const id=navId();
    if(e.key==='Enter'&&id&&nav.Enter){e.preventDefault();nav.Enter(id);return;}
    if(id&&nav[e.key]&&e.key!=='Enter'&&(e.key.startsWith('F')||!typing)){e.preventDefault();nav[e.key](id);return;}
  }
  if(e.key==='Enter'&&typing&&tg!=='TEXTAREA'&&a.type!=='button'){
    const form=a.closest('.form');if(!form)return;
    e.preventDefault();const f=fields(form),i=f.indexOf(a);
    if(i>=0&&i<f.length-1){f[i+1].focus();f[i+1].select&&f[i+1].select();}else if(onSave)onSave();
  }
});

const compact=n=>{n=+n||0;const a=Math.abs(n);return '₹'+(a>=1e7?r2(n/1e7)+'Cr':a>=1e5?r2(n/1e5)+'L':a>=1e3?r2(n/1e3)+'K':r2(n));};
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
// Column chart: rounded data-end, square baseline, hairline grid, value label only on highlighted bar
function colChart(data,{h=190,fmt=rs,tick=compact,color='#2a78d6',ints=false}={}){
  const top=Math.max(1,...data.map(d=>d.value)),W=520,pl=48,pr=8,pt=18,pb=24,iw=W-pl-pr,ih=h-pt-pb,max=ints?Math.max(4,Math.ceil(top/4)*4):niceMax(top);
  const band=iw/data.length,bw=Math.min(24,band*.55);let g='';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#ebe6d2" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${tick(max*i/4)}</text>`;}
  data.forEach((d,i)=>{const x=pl+band*i+(band-bw)/2,bh=ih*d.value/max,y=pt+ih-bh,r=Math.min(4,bh);
    const path=bh>0?`M${x},${pt+ih}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${pt+ih}Z`:'';
    g+=`<rect x="${pl+band*i}" y="${pt}" width="${band}" height="${ih}" fill="transparent" data-tip="${esc(d.label)}: ${esc(fmt(d.value))}"/>`;
    if(path)g+=`<path d="${path}" fill="${color}" pointer-events="none"/>`;
    g+=`<text x="${x+bw/2}" y="${h-6}" text-anchor="middle">${esc(d.label)}</text>`;
    if(d.hi)g+=`<text class="v" x="${x+bw/2}" y="${y-5}" text-anchor="middle">${esc(fmt(d.value))}</text>`;});
  return `<svg viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}
// Horizontal bars, single series, value at the tip
function barChart(data,{fmt=rs,color='#2a78d6'}={}){
  if(!data.length)return '<p class="muted small">No data yet.</p>';
  const W=320,rh=30,lw=60,max=Math.max(1,...data.map(d=>d.value)),iw=W-lw-70;let g='';
  data.forEach((d,i)=>{const y=i*rh+6,w=Math.max(2,iw*d.value/max),r=Math.min(4,w);
    g+=`<g data-tip="${esc(d.label)}: ${esc(fmt(d.value))}"><rect x="0" y="${i*rh}" width="${W}" height="${rh}" fill="transparent"/><text x="0" y="${y+13}">${esc(d.label)}</text>
      <path d="M${lw},${y}H${lw+w-r}Q${lw+w},${y} ${lw+w},${y+r}V${y+18-r}Q${lw+w},${y+18} ${lw+w-r},${y+18}H${lw}Z" fill="${color}"/>
      <text class="v" x="${lw+w+6}" y="${y+13}">${esc(fmt(d.value))}</text></g>`;});
  return `<svg viewBox="0 0 ${W} ${data.length*rh}" role="img">${g}</svg>`;
}
// Stacked status bar with 2px surface gaps
function statusBar(parts){
  const tot=sum(parts,'n');if(!tot)return '<p class="muted small">No active students yet.</p>';
  const W=320,h=22;let x=0,g='';
  parts.filter(p=>p.n).forEach(p=>{const w=W*p.n/tot;g+=`<rect x="${x}" y="0" width="${Math.max(1,w-2)}" height="${h}" rx="3" fill="${p.c}" data-tip="${esc(p.l)}: ${p.n} (${Math.round(p.n*100/tot)}%)"/>`;x+=w;});
  return `<svg viewBox="0 0 ${W} ${h}" role="img">${g}</svg><div class="legend">${parts.map(p=>`<span><i style="background:${p.c}"></i>${p.icon} ${esc(p.l)} <b>${p.n}</b></span>`).join('')}</div>`;
}

function setOrder(id,v){const p=plan(id);p.order=Math.max(0,parseInt(v,10)||0)||'';save();scrPlans();}
async function savePlan(){
  const name=val('p_name'),amount=num('p_amt'),days=Math.max(0,parseInt(val('p_days'),10)||0),note=val('p_note'),order=parseInt(val('p_ord'),10)||'';
  if(!name){toast('Enter the fee name','bad');return focusEl('#p_name');}
  if(D.plans.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==planEdit)){toast('A fee with this name already exists','bad');return;}
  if(planEdit){
    const p=plan(planEdit),old=+p.amount;Object.assign(p,{name,amount,days,note,order});
    const same=D.students.filter(s=>s.planId===p.id&&s.status!=='left'&&+s.fee===old);
    if(old!==amount&&same.length&&await ask(`${same.length} students pay ${rs(old)}. Change all of them to ${rs(amount)}?`))same.forEach(s=>s.fee=amount);
  }else D.plans.push({id:uid(),name,amount,days,note,order});
  planEdit=null;save();toast('Fee saved','ok');scrPlans();
}
async function bulkPlans(){
  const lines=$('#p_bulk').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean),add=[],bad=[];
  let ord=Math.max(0,...D.plans.map(x=>+x.order||0));
  lines.forEach((l,i)=>{const [n,a,d,o]=l.split(/\t|,/).map(x=>x.trim());
    if(!n||isNaN(+a)||a===''){bad.push(i+1);return;}
    if(D.plans.concat(add).some(x=>x.name.toLowerCase()===n.toLowerCase())){bad.push(i+1);return;}
    add.push({id:uid(),name:n,amount:+a,days:d===undefined||d===''?30:Math.max(0,parseInt(d,10)||0),order:parseInt(o,10)||++ord,note:''});});
  if(!add.length){toast('No valid line found'+(bad.length?` (invalid lines: ${bad.join(', ')})`:''),'bad');return;}
  if(!await ask(`Add ${add.length} fees?${bad.length?`<br><span class="red">Line ${bad.join(', ')} will be skipped (invalid or already exists).</span>`:''}`))return;
  D.plans.push(...add);save();toast(`${add.length} fees added`,'ok');scrPlans();
}
async function delPlan(id){
  const p=plan(id),users=D.students.filter(s=>s.planId===id);
  if(users.length){
    const others=plansSorted().filter(x=>x.id!==id&&+x.days>0);
    if(!others.length){toast('Create another monthly fee first, to move these students to','bad');return;}
    modal(`Delete fee — ${p.name}`,`<p style="font-size:15px"><b>${users.length}</b> students are on this fee. Move them to:</p>
      <select id="mv_to">${others.map(o=>`<option value="${o.id}">${esc(o.name)} — ${rs(o.amount)} / ${o.days} days</option>`).join('')}</select>
      <label style="margin-top:10px;font-size:14px;color:var(--ink)"><input type="checkbox" id="mv_fee" checked style="width:auto"> Also set their fee to the new fee's amount</label>
      <p class="muted small">Old receipts are not changed.</p>
      <div class="btns"><button class="btn bad" id="mv_go">Move & delete</button><button class="btn g" onclick="closeModal()">Cancel</button></div>`);
    $('#mv_go').onclick=()=>{const to=plan(val('mv_to'));
      users.forEach(s=>{s.planId=to.id;if($('#mv_fee').checked)s.fee=+to.amount;});
      D.plans=D.plans.filter(x=>x.id!==id);save();closeModal();toast(`${users.length} students moved to ${to.name}. Fee deleted.`,'ok');scrPlans();};
    return;
  }
  if(!await ask(`Delete the fee <b>${esc(p.name)}</b>?`))return;
  D.plans=D.plans.filter(x=>x.id!==id);save();scrPlans();
}
async function delUnusedPlans(){
  const L=D.plans.filter(p=>!D.students.some(s=>s.planId===p.id));
  if(!L.length){toast('Every fee has students — nothing to delete');return;}
  if(!await ask(`Delete these ${L.length} fees with no students?<br><span class="small">${L.map(p=>esc(p.name)+' ('+rs(p.amount)+')').join(', ')}</span>`))return;
  const ids=new Set(L.map(p=>p.id));D.plans=D.plans.filter(p=>!ids.has(p.id));save();toast(`${L.length} fees deleted`,'ok');scrPlans();
}

async function saveStudent(id){
  const s=id?stu(id):null;
  const v={code:val('s_code'),name:val('s_name'),father:val('s_father'),mobile:normPh(val('s_mobile')),address:val('s_address'),seat:val('s_seat'),
    shift:val('s_shift'),planId:val('s_plan'),fee:num('s_fee'),join:val('s_join')||today(),note:val('s_note')};
  const vt=val('s_valid');
  if(!v.code){toast('Enter Student ID','bad');return focusEl('#s_code');}
  if(!v.name){toast('Enter student name','bad');return focusEl('#s_name');}
  if(v.mobile.length!==10){toast('Mobile must be 10 digits','bad');return focusEl('#s_mobile');}
  if(D.students.some(x=>x.code===v.code&&x!==s)){toast('This Student ID already exists','bad');return focusEl('#s_code');}
  if(v.seat){const c=D.students.find(x=>x!==s&&x.status!=='left'&&x.seat.toLowerCase()===v.seat.toLowerCase()&&(x.shift||'')===(v.shift||''));
    if(c&&!await ask(`Seat ${esc(v.seat)} (${esc(v.shift||'—')}) is already taken by <b>${esc(c.name)}</b>. Save anyway?`))return focusEl('#s_seat');}
  if(s){
    Object.assign(s,v);if(!$('#s_valid').readOnly&&vt!==(s.validTill||'')){s.paid=monthsCovered(s.join,vt);syncValid(s);}
    if($('#s_status'))s.status=$('#s_status').value;
    save();toast('Student updated','ok');go('list');return;
  }
  const n={id:uid(),...v,paid:monthsCovered(v.join,vt),bal:0,status:'active',created:today()};syncValid(n);
  D.students.push(n);save();
  if(await ask(`<b>${esc(n.name)}</b> (ID ${esc(n.code)}) saved.<br>Fee ${rs(n.fee)}. Collect the fee now?`,'Yes, collect','Later'))go('collect',n.id);
  else scrStudent();
}

function attEdit(id,k){
  const a=(D.att[attDate]||{})[id];if(!a)return;
  const v=prompt(`${k==='in'?'In':'Out'} time (HH:MM, 24-hour)`,a[k]||nowTime());if(v===null)return;
  if(v&&!/^([01]?\d|2[0-3]):[0-5]\d$/.test(v.trim())){toast('Enter time like 09:30 or 17:45','bad');return;}
  a[k]=v.trim()?v.trim().padStart(5,'0'):'';save();drawAtt();
}
function attScan(q){
  q=String(q||'').trim();if(!q)return;
  const ql=q.toLowerCase(),qd=normPh(q),A=active();
  let m=A.filter(s=>String(s.code).toLowerCase()===ql);
  if(!m.length&&qd.length===10)m=A.filter(s=>s.mobile===qd);
  if(!m.length)m=A.filter(s=>String(s.seat||'').toLowerCase()===ql);
  const msg=$('#a_msg');
  if(!m.length){msg.innerHTML=`<span class="red">"${esc(q)}" — no active student found</span>`;return;}
  if(m.length>1){msg.innerHTML=`Seat ${esc(q)} has ${m.length} students: `+m.map(s=>`<button class="btn sm" onclick="attMark('${s.id}')">${esc(s.code)} ${esc(s.name)}</button>`).join(' ');return;}
  attMark(m[0].id);
}
function attMark(id){
  const s=stu(id),day=D.att[attDate]=D.att[attDate]||{},t=nowTime(),msg=$('#a_msg');let txt;
  if(!day[id]){day[id]={in:t,out:''};txt=`<span class="green">IN ${t}</span>`;}
  else if(!day[id].out){day[id].out=t;txt=`<span style="color:var(--bar);font-weight:600">OUT ${t} · ${dur(day[id].in,t)}</span>`;}
  else{txt=`<span class="muted">Already IN ${day[id].in} / OUT ${day[id].out}</span>`;}
  const st=stStatus(s);
  msg.innerHTML=`<b>${esc(s.code)} — ${esc(s.name)}</b> ${txt}${st.k==='due'?` <span class="tag due">Fee due! ${dueAmt(s)?rs(dueAmt(s)):''}</span>`:st.k==='soon'?` <span class="tag soon">${esc(st.t)}</span>`:''}`;
  save();drawAtt();if(!window.MOBILE)focusEl('#a_scan');
}
function attToggle(id){
  const day=D.att[attDate]=D.att[attDate]||{};
  if(day[id])delete day[id];else day[id]={in:attDate===today()?nowTime():'',out:''};
  save();drawAtt();
}
let repMonth=null;
function scrAttRep(){
  repMonth=repMonth||today().slice(0,7);
  main.innerHTML=title('Attendance Report',`Month <input type="month" id="m_mon" value="${repMonth}"><button class="btn sm g" onclick="attRepCsv()">CSV</button><button class="btn sm g" onclick="attTimesCsv()">In/Out time CSV</button><button class="btn sm g" onclick="printReport($('#m_out').innerHTML)">Print</button>`)+
  `<div class="card" style="padding:0;overflow:auto" id="m_out"></div>`;
  $('#m_mon').onchange=()=>{repMonth=$('#m_mon').value||today().slice(0,7);drawAttRep();};drawAttRep();
}
function attRepData(){
  const [y,m]=repMonth.split('-').map(Number),n=new Date(y,m,0).getDate(),t=today();
  const days=[...Array(n)].map((_,i)=>repMonth+'-'+pad(i+1));
  const L=D.students.filter(s=>s.status!=='left'||days.some(d=>(D.att[d]||{})[s.id])).sort((a,b)=>(parseInt(a.code,10)||0)-(parseInt(b.code,10)||0));
  return {days,rows:L.map(s=>{const marks=days.map(d=>!!(D.att[d]||{})[s.id]);
    const work=days.filter(d=>d<=t&&d>=(s.join||'')).length,p=marks.filter(Boolean).length;
    return {s,marks,p,a:Math.max(0,work-p),pct:work?Math.round(p*100/work):0};})};
}
function drawAttRep(){
  const {days,rows}=attRepData();
  $('#m_out').innerHTML=`<p style="padding:8px 10px;margin:0"><b>Attendance — ${repMonth}</b></p><table class="agrid"><thead><tr><th class="nm">ID</th><th class="nm">Name</th>${days.map(d=>`<th>${+d.slice(8)}</th>`).join('')}<th>P</th><th>A</th><th>%</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="nm">${esc(r.s.code)}</td><td class="nm">${esc(r.s.name)}</td>${r.marks.map((x,i)=>{const a=x&&D.att[days[i]][r.s.id];return x?`<td class="p" title="In ${esc(a.in||'—')} · Out ${esc(a.out||'—')}">P</td>`:'<td></td>';}).join('')}<td><b>${r.p}</b></td><td>${r.a}</td><td>${r.pct}%</td></tr>`).join('')||
  `<tr><td colspan="${days.length+5}" class="muted">No data</td></tr>`}</tbody></table>`;
}
function attTimesCsv(){const {days,rows}=attRepData(),L=[['Date','ID','Name','In','Out','Duration']];
  days.forEach(d=>rows.forEach(r=>{const a=(D.att[d]||{})[r.s.id];if(a)L.push([dmy(d),r.s.code,r.s.name,a.in||'',a.out||'',dur(a.in,a.out)]);}));
  dl(`attendance_in_out_${repMonth}.csv`,toCsv(L),'text/csv');}
function attRepCsv(){const {days,rows}=attRepData();
  dl(`attendance_${repMonth}.csv`,toCsv([['ID','Name','Seat',...days.map(d=>+d.slice(8)),'Present','Absent','%']].concat(rows.map(r=>[r.s.code,r.s.name,r.s.seat,...r.marks.map(x=>x?'P':''),r.p,r.a,r.pct]))),'text/csv');}

  if(f)dueFlt=f;remIdx=0;

function dueRows(){return active().filter(s=>{const k=stStatus(s).k;return dueFlt==='all'?(k!=='ok'||s.bal>0):dueFlt==='bal'?s.bal>0:k===dueFlt;})

function remindNext(){const L=dueRows();if(!L.length)return toast('Nothing pending');if(remIdx>=L.length){remIdx=0;toast('Sent to everyone — starting again');return;}

function dueCsv(){dl(`due_${today()}.csv`,toCsv([['ID','Name','Mobile','Seat','Valid Till','Status','Due']].concat(dueRows().map(s=>[s.code,s.name,s.mobile,s.seat,s.validTill,stStatus(s).t+(stStatus(s).u?' ('+mText(stStatus(s).u)+')':''),dueAmt(s)]))),'text/csv');}

let remFlt='month',remTpl='',remEdit='';
function remRows(){const cm=curMonth();
  return active().filter(s=>{const st=stStatus(s);
    if(remFlt==='month')return st.k==='due'&&st.u.includes(cm);
    if(remFlt==='old')return st.k==='due'&&st.u.some(m=>m<cm);
    if(remFlt==='soon')return st.k==='soon';
    return st.k==='due'||st.k==='soon'||s.bal>0;})
  .sort((a,b)=>dueAmt(b)-dueAmt(a));}
const sentToday=s=>(s.remAt||'').slice(0,10)===today();
function scrRemind(f){
  if(f)remFlt=f;const T=tpls();
  if(!remTpl||!T.some(t=>t.id===remTpl))remTpl='auto';
  const L=remRows(),left=L.filter(s=>!sentToday(s)&&normPh(s.mobile)).length;
  main.innerHTML=title('Fee Reminder',`<button class="btn sm g" onclick="go('due')">Due List (D)</button>`)+
  `<div class="card form"><div class="grid">
    <div><label>Send to</label><select id="rm_f">${[['month',"This month's fee due"],['old','Old fee pending'],['soon',`Fee expiring in ${D.settings.expDays} days`],['all','All pending']].map(([k,t])=>`<option value="${k}"${k===remFlt?' selected':''}>${t}</option>`).join('')}</select></div>
    <div><label>Message template</label><select id="rm_t"><option value="auto">Automatic (best for each student)</option>${T.map(t=>`<option value="${t.id}"${t.id===remTpl?' selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
  </div>
  <div class="remsum"><b>${L.length}</b> students · <b class="green">${L.length-left}</b> sent today · <b class="red">${left}</b> left</div>
  <div class="btns"><button class="btn wa" onclick="remNext()"${left?'':' disabled'}>Send next reminder (W)</button><button class="btn g" onclick="remTplBox()">Edit templates</button></div>
  ${L[0]?`<details style="margin-top:8px"><summary class="small muted">Message preview — ${esc(L[0].name)}</summary><pre class="rprev">${esc(remindText(L[0],remTpl==='auto'?'':remTpl))}</pre></details>`:''}
  <p class="small muted" style="margin:6px 0 0">WhatsApp opens one student at a time with the message ready — press Send in WhatsApp, come back and tap <b>Send next</b>.</p></div>
  <div class="slist">${L.map(s=>{const st=stStatus(s),ph=normPh(s.mobile),sent=sentToday(s);return `<div class="scard${sent?' done':''}"><div class="av">${esc((s.name||'?').trim().charAt(0).toUpperCase())}</div>
    <div class="sc"><b>${esc(s.name)}</b><small>ID ${esc(s.code)}${s.seat?' · Seat '+esc(s.seat):''} · ${ph?esc(ph):'<span class="red">no mobile</span>'}</small>
    <div>${st.u&&st.u.length?`<span class="tag due">${esc(mText(st.u))}</span> `:tag(s)+' '}<b class="red">${rs(dueAmt(s))}</b>${s.remAt?` <span class="muted small">${sent?'✓ sent today '+esc(s.remAt.slice(11)):'last sent '+dmy(s.remAt.slice(0,10))}</span>`:''}</div></div>
    <div class="sa"><button class="btn sm wa" onclick="remSend('${s.id}')"${ph?'':' disabled'}>${sent?'Again':'Send'}</button><button class="btn sm ok" onclick="go('collect','${s.id}')">Fee</button></div></div>`;}).join('')||'<div class="card muted">Nobody to remind 👍</div>'}</div>`;
  $('#rm_f').onchange=()=>scrRemind($('#rm_f').value);
  $('#rm_t').onchange=()=>{remTpl=$('#rm_t').value;scrRemind();};
  keyH=(e,typing)=>{if(!typing&&!e.ctrlKey&&!e.altKey&&(e.key==='w'||e.key==='W')){e.preventDefault();remNext();return true;}return false;};
}
function remSend(id){waRemind(id,remTpl==='auto'?'':remTpl);setTimeout(()=>{if(cur==='remind')scrRemind();},400);}
function remNext(){const s=remRows().find(x=>!sentToday(x)&&normPh(x.mobile));if(!s){toast('Everyone has been reminded today 👍','ok');return;}

function tplIns(k){const a=$('#tp_text'),i=a.selectionStart??a.value.length;a.value=a.value.slice(0,i)+k+a.value.slice(a.selectionEnd??i);a.focus();a.selectionStart=a.selectionEnd=i+k.length;}

async function cancelReceipt(id){
  const r=D.receipts.find(x=>x.id===id),s=stu(r.sid);
  if(D.receipts.some((x,i)=>x.sid===r.sid&&!x.cancel&&i>D.receipts.indexOf(r))){toast("Cancel this student's later receipt first",'bad');return;}
  if(!await ask(`Cancel receipt #${r.no} (${esc(r.name)}, ${rs(r.paid)})?`))return;
  r.cancel=true;
  if(s){const keep=new Set();D.receipts.filter(x=>x.sid===s.id&&!x.cancel).forEach(x=>(x.mlist||[]).forEach(m=>keep.add(m)));
    s.paid=(s.paid||[]).filter(m=>keep.has(m)||!(r.mlist||[]).includes(m));syncValid(s);s.bal=r.prevBal;}
  save();toast('Receipt cancelled');scrReceipts();
}

// Type-and-pick box (student / book). Returns keyboard handler for keyH.
function picker(inp,box,find,row,pick){
  let si=0,res=[];
  const draw=()=>{res=find(inp.value).slice(0,12);si=0;box.hidden=!inp.value.trim();
    box.innerHTML=res.map((x,i)=>`<div class="${i?'':'on'}" data-i="${i}">${row(x)}</div>`).join('')||'<div class="muted">No match</div>';
    box.querySelectorAll('[data-i]').forEach(d=>d.onmousedown=ev=>{ev.preventDefault();done(res[+d.dataset.i]);});};
  const done=x=>{box.hidden=true;inp.value='';pick(x);};
  inp.oninput=draw;inp.onblur=()=>setTimeout(()=>box.hidden=true,150);
  return e=>{
    if(document.activeElement!==inp)return false;
    if(e.key==='Enter'&&box.hidden&&inp.value.trim()){draw();}
    if(box.hidden)return false;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();si=Math.max(0,Math.min(res.length-1,si+(e.key==='ArrowDown'?1:-1)));
      box.querySelectorAll('[data-i]').forEach((d,i)=>d.classList.toggle('on',i===si));return true;}
    if(e.key==='Enter'){e.preventDefault();if(res[si])done(res[si]);return true;}
    return false;
  };
}

  const map={};Object.entries(COL).forEach(([k,al])=>{const i=hdr.findIndex(h=>al.includes(h));if(i>=0)map[k]=i;});
  if(map.title===undefined){toast('The first row must have headings — at least "Title"','bad');return;}
  const codes=new Set(D.books.map(b=>String(b.code).toLowerCase()));let next=+nextBookCode();
  const add=[],skip=[];
  rows.slice(1).forEach((r,i)=>{const g=k=>map[k]===undefined?'':String(r[map[k]]??'').trim();
    const title=g('title');if(!title){skip.push(`Row ${i+2}: no title`);return;}
    let code=g('code');if(!code){while(codes.has(String(next)))next++;code=String(next++);}
    if(codes.has(code.toLowerCase())){skip.push(`Row ${i+2}: Book No. ${code} already exists`);return;}
    codes.add(code.toLowerCase());
    add.push({id:uid(),code,title,author:g('author'),publisher:g('publisher'),category:g('category'),copies:Math.max(1,parseInt(g('copies'),10)||1),rack:g('rack'),price:+g('price').replace(/[^\d.]/g,'')||'',isbn:g('isbn'),created:today()});});
  if(!add.length){toast('No new book found'+(skip.length?' — '+skip[0]:''),'bad');return;}
  modal('Bulk upload — preview',`<p><b>${add.length}</b> books (${sum(add,'copies')} copies) will be added.${skip.length?` <span class="red">${skip.length} rows skipped.</span>`:''}</p>
    <div style="max-height:260px;overflow:auto"><table><thead><tr><th>Book No.</th><th>Title</th><th>Author</th><th>Category</th><th class="n">Copies</th></tr></thead><tbody>
    ${add.slice(0,200).map(b=>`<tr><td>${esc(b.code)}</td><td>${esc(b.title)}</td><td>${esc(b.author)}</td><td>${esc(b.category)}</td><td class="n">${b.copies}</td></tr>`).join('')}</tbody></table></div>
    ${skip.length?`<p class="small red">${skip.slice(0,8).map(esc).join('<br>')}${skip.length>8?'<br>…':''}</p>`:''}
    <div class="btns"><button class="btn ok" data-k="Y" id="bi_go">Add ${add.length} books (Y)</button><button class="btn g" data-k="N" onclick="closeModal()">Cancel (N)</button></div>`);
  $('#bi_go').onclick=()=>{D.books.push(...add);save();closeModal();toast(`${add.length} books added`,'ok');scrBooks();};
}

function saveIssue(){
  const s=stu(isSid),b=book(isBook),S=D.settings;
  if(!s){toast('Choose the student','bad');return focusEl('#is_s');}
  if(!b){toast('Choose the book','bad');return focusEl('#is_b');}
  if(!availOf(b)){toast('All copies of this book are issued','bad');return;}
  const mine=openIssues().filter(x=>x.sid===s.id);
  if(mine.length>=(+S.maxBooks||2)){toast(`${s.name} already has ${mine.length} books (max ${S.maxBooks}). Take one back first.`,'bad');return;}
  if(mine.some(x=>x.bookId===b.id)){toast(`${s.name} already has this book`,'bad');return;}
  const date=val('is_date')||today(),due=val('is_due')||addDays(date,+S.issueDays||15);

  D.issues.push(x);save();toast(`Issued: ${b.title} → ${s.name} (return by ${dmy(due)})`,'ok');

}

function expCopy(id){const e=D.expenses.find(x=>x.id===id);$('#x_head').value=e.headId;$('#x_amt').value=e.amount;$('#x_mode').value=e.mode;$('#x_to').value=e.paidTo||'';$('#x_note').value='';focusEl('#x_amt');}
function saveExpense(){
  const h=ehead(val('x_head')),amount=num('x_amt'),date=val('x_date')||today();
  if(!h){toast('Create an expense head first (Masters → Expense Heads)','bad');return;}
  if(amount<=0){toast('Enter the amount','bad');return focusEl('#x_amt');}
  const v={date,headId:h.id,head:h.name,amount,mode:val('x_mode'),paidTo:val('x_to'),note:val('x_note')};
  if(expEdit)Object.assign(D.expenses.find(x=>x.id===expEdit),v);
  else{const ss=D.settings.curSession;D.expenses.push({id:uid(),sess:ss,no:nextNo(D.expenses,ss),time:nowTime(),...v});}
  expEdit=null;save();
  const m=date.slice(0,7),f=sum(D.receipts.filter(r=>!r.cancel&&r.date.slice(0,7)===m),'paid'),x=sum(D.expenses.filter(e=>e.date.slice(0,7)===m),'amount');

let plSess=null;
function scrPL(sid){
  if(sid)plSess=sid;const x=sessById(plSess)||curSess();plSess=x.id;
  const end=x.to<today()?x.to:today(),months=x.from<=end?mRange(x.from.slice(0,7),end.slice(0,7)):[];
  const R=D.receipts.filter(r=>!r.cancel&&r.sess===x.id),E=D.expenses.filter(e=>e.sess===x.id);
  const rows=months.map(m=>({m,fee:sum(R.filter(r=>r.date.slice(0,7)===m),'paid'),exp:sum(E.filter(e=>e.date.slice(0,7)===m),'amount')}));
  const late={m:'late',fee:sum(R.filter(r=>r.date>x.to||r.date<x.from),'paid'),exp:sum(E.filter(e=>e.date>x.to||e.date<x.from),'amount')};
  if(late.fee||late.exp)rows.push(late);
  const tf=sum(rows,'fee'),te=sum(rows,'exp');
  main.innerHTML=title('Income vs Expense',`Session <select id="pl_s" style="width:auto">${D.sessions.slice().sort((a,b)=>b.from.localeCompare(a.from)).map(s=>`<option value="${s.id}"${s.id===x.id?' selected':''}>${esc(s.name)}${s.id===D.settings.curSession?' (current)':''}</option>`).join('')}</select>
    <button class="btn sm g" onclick="plCsv()">CSV</button><button class="btn sm g" onclick="printReport($('#pl_out').innerHTML)">Print</button>`)+
  `<div id="pl_out"><div class="kpis">
    <div class="kpi"><div class="l">Fee collected · ${esc(x.name)}</div><div class="v">${rs(tf)}</div></div>
    <div class="kpi"><div class="l">Expenses · ${esc(x.name)}</div><div class="v">${rs(te)}</div></div>
    <div class="kpi"><div class="l">${tf-te>=0?'Profit':'Loss'} · ${esc(x.name)}</div><div class="v ${tf-te>=0?'green':'red'}">${rs(Math.abs(tf-te))} ${tf-te>=0?'▲':'▼'}</div></div></div>
  <div class="card chart"><h4>Fee vs expense by month</h4><div class="sub">${dmy(x.from)} to ${dmy(x.to)}</div>${pairChart(rows.filter(r=>r.m!=='late').map(r=>({label:MON[+r.m.slice(5)-1],a:r.fee,b:r.exp})))}
    <div class="legend"><span><i style="background:#2a78d6"></i>Fee collected</span><span><i style="background:#eb6834"></i>Expenses</span></div></div>
  <div class="card" style="padding:0"><table><thead><tr><th>Month</th><th class="n">Fee collected</th><th class="n">Expenses</th><th>Profit / Loss</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${r.m==='late'?'Outside session dates (e.g. old dues collected later)':mName(r.m)}</td><td class="n">${rs(r.fee)}</td><td class="n">${rs(r.exp)}</td><td>${plTag(r.fee-r.exp)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">This session has not started yet.</td></tr>'}
  </tbody><tfoot><tr><td>Total</td><td class="n">${rs(tf)}</td><td class="n">${rs(te)}</td><td>${plTag(tf-te)}</td></tr></tfoot></table></div></div>`;
  $('#pl_s').onchange=()=>scrPL($('#pl_s').value);
}
function plCsv(){const x=sessById(plSess);const end=x.to<today()?x.to:today();
  const L=[['Month','Fee collected','Expenses','Profit / Loss']];mRange(x.from.slice(0,7),end.slice(0,7)).forEach(m=>{const f=sum(D.receipts.filter(r=>!r.cancel&&r.sess===x.id&&r.date.slice(0,7)===m),'paid'),e=sum(D.expenses.filter(y=>y.sess===x.id&&y.date.slice(0,7)===m),'amount');L.push([mName(m),f,e,f-e]);});
  dl(`income_vs_expense_${x.name}.csv`,toCsv(L),'text/csv');}
// Two series side by side (fee blue, expense orange)
function pairChart(data,{h=210}={}){
  if(!data.length)return '<p class="muted small">No data yet.</p>';
  const W=560,pl=48,pr=8,pt=12,pb=24,iw=W-pl-pr,ih=h-pt-pb,max=niceMax(Math.max(1000,...data.flatMap(d=>[d.a,d.b])));
  const band=iw/data.length,bw=Math.min(18,band*.32);let g='';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#ebe6d2"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${compact(max*i/4)}</text>`;}
  const bar=(x,v,c,tip)=>{const bh=ih*v/max,y=pt+ih-bh,r=Math.min(4,bh);return bh>0?`<path d="M${x},${pt+ih}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${pt+ih}Z" fill="${c}" data-tip="${esc(tip)}"/>`:'';};
  data.forEach((d,i)=>{const cx=pl+band*i+band/2;
    g+=`<rect x="${pl+band*i}" y="${pt}" width="${band}" height="${ih}" fill="transparent" data-tip="${esc(d.label)} — Fee ${rs(d.a)} · Expense ${rs(d.b)} · ${d.a-d.b>=0?'Profit':'Loss'} ${rs(Math.abs(d.a-d.b))}"/>`;
    g+=bar(cx-bw-1,d.a,'#2a78d6',`${d.label} fee: ${rs(d.a)}`)+bar(cx+1,d.b,'#eb6834',`${d.label} expense: ${rs(d.b)}`);
    g+=`<text x="${cx}" y="${h-6}" text-anchor="middle">${esc(d.label)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}

function logoPick(f){
  if(!f)return;if(!/^image\//.test(f.type)){toast('Choose an image (PNG / JPG)','bad');return;}
  const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{
      const k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      let u=c.toDataURL('image/png');if(u.length>90000)u=c.toDataURL('image/jpeg',.85);
      D.settings.logo=u;save();$('#g_logo').innerHTML=logoBox();toast('Logo saved','ok');};
    im.onerror=()=>toast('Could not read this image','bad');im.src=rd.result;};
  rd.readAsDataURL(f);
}

  try{INFO={...INFO,...await api('email-backup',{})};toast('Backup emailed','ok');}
  catch(err){INFO.lastEmailError=err.message;toast('Email failed: '+err.message,'bad');}
  showMailStatus();
}
function testPrint(){printHtml(rcptHtml({no:0,date:today(),time:nowTime(),sid:'',code:'1001',name:'Test Student',head:'Monthly Fee',months:1,mlist:[curMonth()],from:curMonth()+'-01',to:mEnd(curMonth()),
  fee:500,extra:'',extraAmt:0,disc:0,oldBal:0,total:500,paid:500,bal:0,mode:'Cash',note:''}),PAGE[D.settings.slip]);}
function restore(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=()=>{let d;try{d=JSON.parse(rd.result);}catch(e){toast('Invalid file','bad');return;}restoreData(d,'the backup');};
  rd.readAsText(f);
}
async function restoreData(d,what){
  if(!d||!d.settings||!Array.isArray(d.students)){toast('This is not a Library ERP backup','bad');return;}
  if(!await ask(`${what[0].toUpperCase()+what.slice(1)} has ${d.students.length} students and ${(d.receipts||[]).length} receipts.<br>Replace the current data with it?<br><span class="small muted">Your current data is first saved as a safety copy (before-restore file in the backups folder).</span>`))return;
  const nd=migrate(d);await saving;
  try{await api('restore',nd);}catch(e){toast('Restore failed: '+e.message,'bad');return;}
  D=nd;toast('Restored','ok');sessBar();go('home');
}

/* ================= QUIT ================= */
async function scrQuit(){
  scrHome();$('#scr').textContent='Gateway of Library';cur='home';
  if(!await ask('Close the ERP? All data is saved. Run Library ERP again to reopen it.','Yes, close','No'))return;
  await saving;try{await api('quit',{});}catch(e){}
  D=null;$('#side').innerHTML='';$('#lic').textContent='';$('#scr').textContent='Closed';
  main.innerHTML=`<div class="act card"><h3>ERP closed</h3><p>${window.MOBILE?'Open the <b>Library ERP</b> app again to continue.':'You can close this window now. To open it again, run <b>Library ERP</b> from the desktop.'}</p></div>`;
  setTimeout(()=>window.close(),800);
}

/* ================= LICENSE ================= */
// License expiry: exact time (ms). Server ki ghadi se sync.
let licOff=0;
const fmtDT=ms=>new Date(ms).toLocaleString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const licEnd=()=>LIC&&LIC.expiryMs?fmtDT(LIC.expiryMs):'';
function licLeftText(ms){const t=Math.max(0,Math.floor(ms/1000)),d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),sec=t%60;
  return (d?d+'d ':'')+pad(h)+':'+pad(m)+':'+pad(sec);}
function licBar(){const e=$('#lic');if(!LIC||!LIC.ok){e.textContent='';$('#cd').textContent='';return;}
  licOff=(LIC.serverNow||Date.now())-Date.now();
  e.textContent=LIC.lifetime?'License: Lifetime':`License: ${LIC.daysLeft>=1?LIC.daysLeft+' days':'less than 1 day'} (${licEnd()})`;e.className='lic'+(!LIC.lifetime&&LIC.daysLeft<=7?' low':'');licTick();}
// Countdown: aakhri 48 ghante mein dikhe; aakhri 24 ghante laal blink
function licTick(){
  const c=$('#cd');if(!c)return;
  if(!D||!LIC||!LIC.ok||LIC.lifetime||!LIC.expiryMs){c.textContent='';return;}
  const left=LIC.expiryMs-(Date.now()+licOff);
  if(left<=0){c.textContent='';LIC.ok=false;api('license').then(l=>{LIC=l;if(!l.ok)showActivate();else licBar();}).catch(()=>{});return;}
  if(left>48*3600e3){c.textContent='';return;}
  c.textContent='⏳ License ends in '+licLeftText(left);c.className='lic cd'+(left<=24*3600e3?' last':'');
  c.title='Expires '+licEnd()+' — enter a new key in K (License)';
}
setInterval(licTick,1000);
function scrLicense(){
  main.innerHTML=title('License / Activation')+`<div class="card" style="max-width:620px"><table class="info">
    ${LIC.vendor||LIC.vendorPhone?`<tr><td>Customer support</td><td><b>${esc(LIC.vendor)}</b> · <b>${esc(LIC.vendorPhone)}</b></td></tr>`:''}
    <tr><td>ERP version</td><td><b>v${esc(LIC.version||'')}</b></td></tr>
    <tr><td>Machine code</td><td><b style="font:700 18px Consolas,monospace">${esc(LIC.machine)}</b></td></tr>
    ${LIC.lifetime?`<tr><td>Validity</td><td><b class="green">Lifetime</b></td></tr>`:`<tr><td>Valid till</td><td><b>${licEnd()}</b></td></tr><tr><td>Plan</td><td>${esc(LIC.label||'')}</td></tr><tr><td>Days left</td><td><b class="${LIC.daysLeft<=7?'red':'green'}">${LIC.daysLeft}</b></td></tr>`}
    ${LIC.name?`<tr><td>Licensed to</td><td>${esc(LIC.name)}</td></tr>`:''}</table>
    <div class="form" style="margin-top:12px"><label>New activation key (to renew)</label><textarea id="k_key" rows="3" style="font:12px Consolas,monospace"></textarea>
    <div class="btns"><button class="btn" onclick="doActivate(val('k_key'))">Activate (Ctrl+S)</button>${LIC.vendorPhone?`<button class="btn wa" onclick="askKey()">Request key on WhatsApp</button>`:''}</div></div></div>`;
  onSave=()=>doActivate(val('k_key'));focusEl('#k_key');
}
const supportHtml=()=>LIC&&(LIC.vendor||LIC.vendorPhone)?`<div class="hint" style="margin:10px 0"><b>Customer support:</b> ${esc(LIC.vendor)} · <b>${esc(LIC.vendorPhone)}</b></div>`:'';
function askKey(){waOpen(LIC.vendorPhone,`I need a Library ERP activation key.\nMachine code: ${LIC.machine}${D&&D.settings?'\nLibrary: '+D.settings.name:''}`);}
async function doActivate(key){
  if(!key){toast('Paste the key','bad');return;}
  try{LIC=await api('activate',{key});toast(`Activated — ${LIC.lifetime?'Lifetime':(LIC.label||'')+' (till '+licEnd()+')'}`,'ok');await boot();}
  catch(e){toast(e.message,'bad');}
}
function showActivate(){
  D=null;$('#side').innerHTML='';$('#scr').textContent='Activation';$('#lic').textContent='';
  const why={new:'This software is not activated.',invalid:'The activation key is not valid for this computer.',expired:`The license expired on ${LIC.expiryMs?fmtDT(LIC.expiryMs):''}.`,
    clock:'The computer date/time has been set back. Set the correct date and open again.'}[LIC.reason]||'';
  main.innerHTML=`<div class="act card"><h2 style="margin-top:0;color:var(--bar)">Library ERP — Activation <span class="muted" style="font-size:13px">v${esc(LIC.version||'')}</span></h2>
    <p class="${LIC.reason==='new'?'':'red'}">${why}</p>
    <p>Send your <b>Machine code</b> to the vendor. They will give you an <b>Activation Key</b>.</p>
    <div class="mcode">${esc(LIC.machine)}</div>
    ${supportHtml()}
    <div class="btns"><button class="btn g" onclick="navigator.clipboard.writeText('${LIC.machine}').then(()=>toast('Copied'))">Code copy</button>
      ${LIC.vendorPhone?`<button class="btn wa" onclick="waOpen(LIC.vendorPhone,'I need a Library ERP activation key.\\nMachine code: ${LIC.machine}')">Send on WhatsApp</button>`:''}</div>
    <label style="margin-top:16px">Paste the activation key here</label><textarea id="k_key" rows="4" style="font:12px Consolas,monospace" autofocus></textarea>
    <div class="btns"><button class="btn ok" id="k_go">Activate (Ctrl+Enter)</button>${LIC.reason==='new'?'':'<a class="btn g" href="/api/export" download style="text-decoration:none">Download my data</a>'}</div></div>`;
  const go_=()=>doActivate(val('k_key'));$('#k_go').onclick=go_;
  $('#k_key').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||!e.shiftKey)){e.preventDefault();go_();}};
  focusEl('#k_key');
}

/* ================= BOOT ================= */
async function boot(){
  try{LIC=await api('license');}
  catch(e){main.innerHTML=`<div class="act card"><h3>Cannot connect to the server</h3><p>Open Library ERP from the desktop icon (LibraryERP.exe).</p></div>`;return;}
  if(!LIC.ok)return showActivate();
  let data=null;try{data=await api('data');}catch(e){toast(e.message,'bad');return;}
  D=migrate(data);if(!data)save();
  drawSide();licBar();sessBar();
  if(!LIC.lifetime&&LIC.daysLeft<=7)toast(LIC.daysLeft>=1?`License expires in ${LIC.daysLeft} days — please renew (K)`:`License expires at ${licEnd()} — please renew (K)`,'bad');
  go('home');duePopup();
}
function duePopup(){
  let k='';try{k=localStorage.getItem('liberp_due_popup');}catch(e){}
  if(k===today())return;
  const L=active().filter(s=>stStatus(s).k==='due').sort((a,b)=>stStatus(b).od-stStatus(a).od);
  if(!L.length)return;
  try{localStorage.setItem('liberp_due_popup',today());}catch(e){}
  modal(`Fee reminder — ${L.length} students have fees due`,`<table><thead><tr><th>ID</th><th>Name</th><th>Due months</th><th class="n">Amount</th><th></th></tr></thead><tbody>
    ${L.slice(0,12).map(s=>`<tr><td>${esc(s.code)}</td><td><b>${esc(s.name)}</b></td><td class="small red">${esc(mText(stStatus(s).u))}</td><td class="n">${rs(dueAmt(s))}</td>
      <td class="n" style="white-space:nowrap"><button class="btn sm wa" onclick="waRemind('${s.id}')">WhatsApp</button> <button class="btn sm ok" onclick="go('collect','${s.id}')">Fee</button></td></tr>`).join('')}</tbody></table>
    ${L.length>12?`<p class="muted small">…and ${L.length-12} more. See the Due List.</p>`:''}
    <div class="btns"><button class="btn" data-k="D" autofocus onclick="go('due','due')">Open Due List (D)</button><button class="btn g" data-k="L" onclick="closeModal()">Later (L)</button></div>`);
}
setInterval(async()=>{if(!D)return;try{LIC=await api('license');if(!LIC.ok)showActivate();else licBar();}catch(e){}},30*60e3);
window.addEventListener('beforeunload',()=>{if(D)navigator.sendBeacon('/api/data',new Blob([JSON.stringify(D)],{type:'application/json'}));});
boot();
</script>
