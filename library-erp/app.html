<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library ERP</title>
<style>
:root{
  --bar:#2b4c7e; --bar2:#1f3a63; --bg:#fffdf0; --panel:#fff; --line:#d9d2b0; --ink:#1d1d1d; --muted:#6b6b6b;
  --hi:#fff3b0; --ok:#1e7d32; --bad:#c62828; --warn:#ef6c00; --side:#e9eef6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.4 "Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid #bdb59a;border-radius:3px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #f5c400;background:var(--hi)}
button:focus-visible{outline:3px solid #f5c400;outline-offset:2px}
input[readonly]{background:#f6f3e4}
#top{background:var(--bar);color:#fff;display:flex;align-items:center;gap:14px;padding:6px 14px}
#top b{font-size:17px;letter-spacing:.3px}
#top .scr{background:var(--bar2);padding:2px 10px;border-radius:3px;font-size:13px}
#top .lic{font-size:12px;padding:2px 8px;border-radius:3px;background:#ffffff22}
#top .lic.low{background:var(--bad)}#top .lic:empty{display:none}
#top .clock{margin-left:auto;font-size:13px;opacity:.9}
#wrap{flex:1;display:flex;min-height:0}
#main{flex:1;overflow:auto;padding:14px}
#side{width:190px;background:var(--side);border-left:1px solid var(--line);overflow:auto;padding:6px}
#side button{display:flex;width:100%;text-align:left;background:#fff;border:1px solid #bccbe0;margin:0 0 4px;padding:6px 8px;border-radius:3px;font-size:13px}
#side button:hover{background:var(--hi)}
#side button u{font-weight:700;color:var(--bar);text-decoration:none;width:42px;flex:none}
#side .keys{font-size:11px;color:var(--muted);padding:6px 4px;border-top:1px solid #bccbe0;margin-top:6px}
.title{background:var(--bar);color:#fff;padding:6px 12px;font-weight:600;display:flex;align-items:center;gap:10px;margin:-14px -14px 14px;flex-wrap:wrap}
.title .r{margin-left:auto;font-weight:400;font-size:13px;display:flex;gap:6px;align-items:center}
.title input,.title select{width:auto;padding:2px 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:12px}
.card h4{margin:0 0 8px;color:var(--bar)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.grid .w2{grid-column:span 2}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:start}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>.fix{flex:none;width:auto}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
label i{color:var(--bad);font-style:normal}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:6px 8px;border-bottom:1px solid #eee8cf;text-align:left;vertical-align:middle}
th{background:#f3eed3;font-weight:600;font-size:13px;position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#fffbe0}
tr.sel td{background:var(--hi)!important;box-shadow:inset 0 1px 0 #e0c200,inset 0 -1px 0 #e0c200}
tr.cx td{color:#999;text-decoration:line-through}
tfoot td{font-weight:700;background:#f8f4de}
.btn{background:var(--bar);color:#fff;border:0;padding:8px 14px;border-radius:3px}
.btn:hover{background:var(--bar2)}
.btn.g{background:#fff;color:var(--bar);border:1px solid var(--bar)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.wa{background:#1fa855}
.btn.sm{padding:3px 8px;font-size:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.muted{color:var(--muted)}.red{color:var(--bad);font-weight:600}.green{color:var(--ok);font-weight:600}
.small{font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600;white-space:nowrap}
.tag.ok{background:#e3f4e5;color:var(--ok)}.tag.due{background:#fde2e2;color:var(--bad)}.tag.soon{background:#ffe9cc;color:#b45309}.tag.left{background:#eee;color:#666}
.hint{background:#eef3fb;border:1px solid #c9d6ea;border-radius:4px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.hint b{color:var(--bar)}
kbd{background:#fff;border:1px solid #bbb;border-bottom-width:2px;border-radius:3px;padding:0 4px;font:11px Consolas,monospace}
/* gateway */
.gw{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start;padding-top:10px}
.gwbox{width:340px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px #0001}
.gwbox h3{margin:0;background:var(--bar);color:#fff;text-align:center;padding:8px;font-size:15px}
.gwbox .sec{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 18px 2px}
.gwbox .it{padding:5px 18px;cursor:pointer;display:flex;gap:6px}
.gwbox .it u{color:var(--bad);font-weight:700;text-decoration:none}
.gwbox .it.on,.gwbox .it:hover{background:var(--hi)}
.stats{width:310px}
.stat{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px dashed #e6dfbf}
.stat b{font-variant-numeric:tabular-nums}
.stat.link{cursor:pointer}.stat.link:hover{background:var(--hi)}
/* student picker */
.pick{position:relative}
#sugg{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #bdb59a;z-index:5;max-height:300px;overflow:auto;box-shadow:0 6px 18px #0002}
#sugg div{padding:6px 10px;cursor:pointer;border-bottom:1px solid #f1ecd6}
#sugg div.on,#sugg div:hover{background:var(--hi)}
.info td{border:0;padding:3px 6px}.info td:first-child{color:var(--muted);width:40%}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .big{font-size:22px;font-weight:700;color:var(--bar);border-top:2px solid var(--bar);margin-top:4px;padding-top:6px}
.scan{font-size:20px;padding:10px 12px}
.agrid td,.agrid th{padding:3px 2px;text-align:center;font-size:11px;border:1px solid #eee8cf}
.agrid td.nm,.agrid th.nm{text-align:left;white-space:nowrap;padding:3px 6px}
.agrid .p{color:var(--ok);font-weight:700}
.err td{background:#fff0f0}
/* dashboard */
.dash{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
.dash .gwbox{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:default}
.kpi.link{cursor:pointer}.kpi.link:hover{border-color:#e0c200;background:#fffdf3}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;margin:2px 0;font-variant-numeric:tabular-nums}
.kpi.hero .v{font-size:30px;color:var(--bar)}
.kpi .s{font-size:12px;color:var(--muted)}
.meter{height:12px;background:#d6e6fa;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:#2a78d6;border-radius:6px}
.charts{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.chart h4{margin:0 0 2px}.chart .sub{font-size:12px;color:var(--muted);margin-bottom:6px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{font:11px "Segoe UI",Arial,sans-serif;fill:#6b6b6b}
.chart svg text.v{fill:#1d1d1d;font-weight:600}
.chart svg [data-tip]{cursor:pointer}.chart svg [data-tip]:hover{opacity:.82}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
#tip{position:fixed;pointer-events:none;background:#1d1d1d;color:#fff;font-size:12px;padding:5px 9px;border-radius:4px;z-index:70;display:none;white-space:nowrap}
@media (max-width:1100px){.dash{grid-template-columns:1fr}.charts{grid-template-columns:1fr}}
/* month chips */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.mc{display:flex;align-items:flex-start;gap:6px;border:1px solid #cfc7a6;border-radius:4px;padding:6px 8px;background:#fff;cursor:pointer;font-size:13px;margin:0;color:var(--ink)}
.mc input{width:auto;margin:2px 0 0}
.mc small{display:block;font-size:11px;color:var(--muted)}
.mc.paid{background:#e3f4e5;border-color:#9ccfa3;cursor:default}.mc.paid small{color:var(--ok)}
.mc.due{background:#fdecec;border-color:#f0b4b4}.mc.due small{color:var(--bad)}
.mc.on{background:var(--hi);border-color:#e0c200;font-weight:600}
.mc:focus-within{outline:2px solid #f5c400}
.xgrid{display:flex;flex-wrap:wrap;gap:6px}
/* modal */
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.open{display:flex}
#mbox{background:#fff;border-radius:4px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 10px 40px #0004}
#mbox h3{margin:0;background:var(--bar);color:#fff;padding:9px 14px;font-size:15px}
#mbox .in{padding:14px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 20px;border-radius:4px;display:none;z-index:60;font-size:15px}
#toast.bad{background:var(--bad)}#toast.ok{background:var(--ok)}
/* activation */
.act{max-width:560px;margin:40px auto}
.mcode{font:700 30px Consolas,monospace;letter-spacing:3px;text-align:center;background:#f3eed3;border:2px dashed var(--bar);padding:12px;border-radius:6px;user-select:all}
#print{display:none}
@media (max-width:900px){.two{grid-template-columns:1fr}#side{display:none}}
/* ===== receipt slip ===== */
.rcpt{font:12px/1.35 "Courier New",monospace;color:#000;padding:2mm 0}
.rcpt.w58{width:48mm;font-size:11px}.rcpt.w80{width:72mm}
.rcpt .c{text-align:center}.rcpt .r{text-align:right}
.rcpt td.r{white-space:nowrap}
.rcpt .h{font-size:16px;font-weight:700}
.rcpt .tt{font-weight:700;border-top:1px dashed #000;border-bottom:1px dashed #000;margin:4px 0;padding:2px 0;letter-spacing:1px}
.rcpt table{background:none;width:100%}
.rcpt td,.rcpt th{padding:1px 0;border:0;font-size:inherit;background:none!important;vertical-align:top}
.rcpt th{border-bottom:1px dashed #000!important;text-align:left}
.rcpt tfoot td{font-weight:400}
.rcpt tfoot tr:first-child td{border-top:1px dashed #000}
.rcpt .bg td{font-size:1.25em;font-weight:700}
.rcpt .vt{margin:4px 0;border:1px solid #000;padding:2px}
.rcpt .ft{margin-top:4px;font-size:.9em}
.rcpt.big{font:13px/1.5 Arial,sans-serif;border:1.5px solid #000;padding:5mm}
.rcpt.wA6{width:93mm}.rcpt.wA5{width:128mm;font-size:14px}.rcpt.wA4{width:180mm;font-size:15px}
.rcpt.big .h{font-size:1.8em}
.rcpt.big .tt{border-top-style:solid;border-bottom-style:solid;font-size:1.1em}
.rcpt.big td,.rcpt.big th{padding:3px 4px}
.rcpt.big .it td,.rcpt.big .it th{border:1px solid #000!important}
.rcpt .sign{display:flex;justify-content:space-between;margin-top:12mm;font-size:.9em}
.rcpt .sign span{border-top:1px solid #000;padding-top:2px;min-width:30%;text-align:center}
.rep{font:12px Arial,sans-serif;color:#000}
.rep table td,.rep table th{border:1px solid #999;padding:3px 5px}
@media print{
  body{display:block;background:#fff}
  #top,#wrap,#modal,#toast{display:none!important}
  #print{display:block}
}
</style>
</head>
<body>
<div id="top"><b id="libname">Library ERP</b><span class="scr" id="scr">Gateway of Library</span><span class="lic" id="lic"></span><span class="clock" id="clock"></span></div>
<div id="wrap"><div id="main"><p class="muted">Loading…</p></div><div id="side"></div></div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>
<div id="tip"></div>
<div id="print"></div>
<script>
/* ================= HELPERS ================= */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const dmy=d=>d?d.split('-').reverse().join('-'):'';
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const diff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const r2=n=>Math.round((+n||0)*100)/100;
const rs=n=>'₹'+r2(n).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((s,x)=>s+(+(typeof f==='function'?f(x):x[f])||0),0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $=s=>document.querySelector(s);
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
const num=id=>+val(id)||0;
const normPh=p=>{p=String(p||'').replace(/\D/g,'');return p.length>10?p.slice(-10):p;};
const MODES=['Cash','UPI','Card','Bank'];
const main=$('#main');

const DEF_SET={name:'My Library',address:'',contact:'',footer:'Fee non-refundable. Thank you!',slip:'80',autoPrint:true,autoWa:false,
  waMode:'web',owner:'',shifts:'Morning,Evening,Full Day',expDays:3,
  mail:{user:'',pass:'',to:'',auto:true,host:'smtp.gmail.com',port:465}};
function seed(){return {settings:{...DEF_SET,mail:{...DEF_SET.mail}},plans:[],students:[],receipts:[],att:{},seq:{rcpt:0}};}
function migrate(s){
  s=s&&s.settings?s:seed();
  s.settings={...DEF_SET,...s.settings,mail:{...DEF_SET.mail,...(s.settings.mail||{})}};
  ['plans','students','receipts'].forEach(k=>s[k]=s[k]||[]);s.att=s.att||{};s.seq=s.seq||{rcpt:0};
  // Purana data: period (from-to) se paid mahine banao
  s.receipts.forEach(r=>{if(!r.mlist)r.mlist=r.from&&r.to?monthsCovered(r.from,r.to):[];});
  s.students.forEach(st=>{
    if(!Array.isArray(st.paid)){
      const P=new Set();s.receipts.filter(r=>r.sid===st.id&&!r.cancel).forEach(r=>r.mlist.forEach(m=>P.add(m)));
      if(!P.size&&st.validTill&&st.join)monthsCovered(st.join,st.validTill).forEach(m=>P.add(m));
      st.paid=[...P].sort();
    }
    syncValid(st);
  });
  return s;
}

let D=null,LIC=null,INFO={};
async function api(p,body){
  const r=await fetch('/api/'+p,body===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;
}
let saving=Promise.resolve();
function save(){
  const snap=JSON.stringify(D);
  saving=saving.then(()=>fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:snap}))
    .then(r=>{if(!r.ok)return r.json().then(j=>{throw new Error(j.error);});})
    .catch(e=>toast('Could not save data: '+e.message,'bad'));
  return saving;
}

function toast(t,cls){const e=$('#toast');e.textContent=t;e.className=cls||'';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',cls==='bad'?4000:2200);}
let askRes=null,lastFocus=null;
function modal(title,html){if(!isModal())lastFocus=document.activeElement;$('#mbox').innerHTML=`<h3>${esc(title)}</h3><div class="in">${html}</div>`;$('#modal').classList.add('open');
  setTimeout(()=>{const f=$('#mbox [autofocus]')||$('#mbox input,#mbox select,#mbox button');f&&f.focus();},30);}
function closeModal(){if(!isModal())return;$('#modal').classList.remove('open');
  setTimeout(()=>{if(isModal())return;const f=lastFocus&&document.contains(lastFocus)&&lastFocus!==document.body?lastFocus:main.querySelector('input,select,textarea');f&&f.focus();},10);if(askRes){const r=askRes;askRes=null;r(false);}}
const isModal=()=>$('#modal').classList.contains('open');
function ask(msg,yes='Yes',no='No'){return new Promise(res=>{
  modal('Confirm',`<p style="font-size:15px">${msg}</p><div class="btns"><button class="btn" data-k="Y" autofocus id="ay">${yes} (Y)</button><button class="btn g" data-k="N" id="an">${no} (N)</button></div>`);
  askRes=res;$('#ay').onclick=()=>{askRes=null;closeModal();res(true);};$('#an').onclick=()=>closeModal();});}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(text instanceof Blob?text:new Blob([text],{type:type||'text/plain'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
const csvCell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
const toCsv=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');

function waOpen(num,text){
  let n=String(num||'').replace(/\D/g,'');
  if(n.length===10)n='91'+n;
  if(!n){toast('Mobile number missing','bad');return;}
  const t=encodeURIComponent(text);
  if(D.settings.waMode==='app')location.href=`whatsapp://send?phone=${n}&text=${t}`;
  else window.open(`https://wa.me/${n}?text=${t}`,'_blank');
}
function words(n){
  n=Math.round(+n||0);if(!n)return 'Zero';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:'');
  const three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
  const o=[],cr=Math.floor(n/1e7),l=Math.floor(n%1e7/1e5),th=Math.floor(n%1e5/1e3),h=n%1e3;
  if(cr)o.push(three(cr)+' Crore');if(l)o.push(two(l)+' Lakh');if(th)o.push(two(th)+' Thousand');if(h)o.push(three(h));
  return o.join(' ');
}

/* ================= MONTHS ================= */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mName=m=>MON[+m.slice(5)-1]+' '+m.slice(0,4);
const mAdd=(m,n)=>{let y=+m.slice(0,4),k=+m.slice(5)-1+n;y+=Math.floor(k/12);k=((k%12)+12)%12;return y+'-'+pad(k+1);};
const mEnd=m=>ymd(new Date(+m.slice(0,4),+m.slice(5),0));
const curMonth=()=>today().slice(0,7);
function mRange(a,b){const o=[];for(let m=a;m<=b&&o.length<600;m=mAdd(m,1))o.push(m);return o;}
// Date range ke mahine: aakhri mahina tab gina jab usme 15+ din cover hon
function monthsCovered(from,to){
  if(!from||!to||to<from)return [];
  let a=from.slice(0,7),b=to.slice(0,7);
  if(b>a&&+to.slice(8)<15)b=mAdd(b,-1);
  return mRange(a,b);
}
// "Oct 2026 – Dec 2026 (3 mahine)"
function mText(list){
  if(!list||!list.length)return '';
  const L=[...list].sort(),g=[];let st=L[0],pv=L[0];
  for(const m of L.slice(1)){if(m===mAdd(pv,1)){pv=m;continue;}g.push([st,pv]);st=pv=m;}g.push([st,pv]);
  return g.map(([a,b])=>a===b?mName(a):`${mName(a)} – ${mName(b)}`).join(', ')+(L.length>1?` (${L.length} months)`:'');
}

/* ================= STUDENT LOGIC ================= */
const plan=id=>D.plans.find(p=>p.id===id);
const stu=id=>D.students.find(s=>s.id===id);
const byOrder=(a,b)=>(+a.order||999)-(+b.order||999)||a.name.localeCompare(b.name);
const plansSorted=()=>D.plans.slice().sort(byOrder);
const periodic=()=>plansSorted().filter(p=>+p.days>0);
const oneTime=()=>plansSorted().filter(p=>!(+p.days>0));
const active=()=>D.students.filter(s=>s.status!=='left');
function nextCode(){return String(Math.max(1000,...D.students.map(s=>parseInt(s.code,10)||0))+1);}
// Ek mahine ki fee (90 din wale plan ki fee / 3)
function monthRate(s,pid){
  const p=plan(pid||s.planId);if(!p)return 0;
  const amt=(!pid||pid===s.planId)?+s.fee:+p.amount;
  return +p.days>31?Math.round(amt*30/p.days):amt;
}
function syncValid(s){const p=(s.paid||[]).slice().sort();s.paid=p;s.validTill=p.length?mEnd(p[p.length-1]):'';}
function unpaidMonths(s){
  const P=new Set(s.paid||[]);
  return mRange((s.join||today()).slice(0,7),curMonth()).filter(m=>!P.has(m));

function stStatus(s){
  if(s.status==='left')return {k:'left',t:'Left'};

  if(u.length)return {k:'due',t:u.length===1?`${mName(u[0])} due`:`${u.length} months due`,od:u.length,u};
  const left=diff(today(),s.validTill);
  if(left<=(+D.settings.expDays||0))return {k:'soon',t:left?left+' days left':'Ends today',left};

}

function dueAmt(s){const st=stStatus(s);return (st.k==='due'?st.od*monthRate(s):0)+(+s.bal||0);}

const compact=n=>{n=+n||0;const a=Math.abs(n);return '₹'+(a>=1e7?r2(n/1e7)+'Cr':a>=1e5?r2(n/1e5)+'L':a>=1e3?r2(n/1e3)+'K':r2(n));};
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
// Column chart: rounded data-end, square baseline, hairline grid, value label only on highlighted bar
function colChart(data,{h=190,fmt=rs,tick=compact,color='#2a78d6',ints=false}={}){
  const top=Math.max(1,...data.map(d=>d.value)),W=520,pl=48,pr=8,pt=18,pb=24,iw=W-pl-pr,ih=h-pt-pb,max=ints?Math.max(4,Math.ceil(top/4)*4):niceMax(top);
  const band=iw/data.length,bw=Math.min(24,band*.55);let g='';
  for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#ebe6d2" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${tick(max*i/4)}</text>`;}
  data.forEach((d,i)=>{const x=pl+band*i+(band-bw)/2,bh=ih*d.value/max,y=pt+ih-bh,r=Math.min(4,bh);
    const path=bh>0?`M${x},${pt+ih}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${pt+ih}Z`:'';
    g+=`<rect x="${pl+band*i}" y="${pt}" width="${band}" height="${ih}" fill="transparent" data-tip="${esc(d.label)}: ${esc(fmt(d.value))}"/>`;
    if(path)g+=`<path d="${path}" fill="${color}" pointer-events="none"/>`;
    g+=`<text x="${x+bw/2}" y="${h-6}" text-anchor="middle">${esc(d.label)}</text>`;
    if(d.hi)g+=`<text class="v" x="${x+bw/2}" y="${y-5}" text-anchor="middle">${esc(fmt(d.value))}</text>`;});
  return `<svg viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}
// Horizontal bars, single series, value at the tip
function barChart(data,{fmt=rs,color='#2a78d6'}={}){
  if(!data.length)return '<p class="muted small">No data yet.</p>';
  const W=320,rh=30,lw=60,max=Math.max(1,...data.map(d=>d.value)),iw=W-lw-70;let g='';
  data.forEach((d,i)=>{const y=i*rh+6,w=Math.max(2,iw*d.value/max),r=Math.min(4,w);
    g+=`<g data-tip="${esc(d.label)}: ${esc(fmt(d.value))}"><rect x="0" y="${i*rh}" width="${W}" height="${rh}" fill="transparent"/><text x="0" y="${y+13}">${esc(d.label)}</text>
      <path d="M${lw},${y}H${lw+w-r}Q${lw+w},${y} ${lw+w},${y+r}V${y+18-r}Q${lw+w},${y+18} ${lw+w-r},${y+18}H${lw}Z" fill="${color}"/>
      <text class="v" x="${lw+w+6}" y="${y+13}">${esc(fmt(d.value))}</text></g>`;});
  return `<svg viewBox="0 0 ${W} ${data.length*rh}" role="img">${g}</svg>`;
}

function statusBar(parts){

  parts.filter(p=>p.n).forEach(p=>{const w=W*p.n/tot;g+=`<rect x="${x}" y="0" width="${Math.max(1,w-2)}" height="${h}" rx="3" fill="${p.c}" data-tip="${esc(p.l)}: ${p.n} (${Math.round(p.n*100/tot)}%)"/>`;x+=w;});
  return `<svg viewBox="0 0 ${W} ${h}" role="img">${g}</svg><div class="legend">${parts.map(p=>`<span><i style="background:${p.c}"></i>${p.icon} ${esc(p.l)} <b>${p.n}</b></span>`).join('')}</div>`;
}

async function savePlan(){
  const name=val('p_name'),amount=num('p_amt'),days=Math.max(0,parseInt(val('p_days'),10)||0),note=val('p_note'),order=parseInt(val('p_ord'),10)||'';
  if(!name){toast('Enter the fee name','bad');return focusEl('#p_name');}
  if(D.plans.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.id!==planEdit)){toast('A fee with this name already exists','bad');return;}
  if(planEdit){
    const p=plan(planEdit),old=+p.amount;Object.assign(p,{name,amount,days,note,order});
    const same=D.students.filter(s=>s.planId===p.id&&s.status!=='left'&&+s.fee===old);
    if(old!==amount&&same.length&&await ask(`${same.length} students pay ${rs(old)}. Change all of them to ${rs(amount)}?`))same.forEach(s=>s.fee=amount);
  }else D.plans.push({id:uid(),name,amount,days,note,order});
  planEdit=null;save();toast('Fee saved','ok');scrPlans();

async function bulkPlans(){
  const lines=$('#p_bulk').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean),add=[],bad=[];
  let ord=Math.max(0,...D.plans.map(x=>+x.order||0));
  lines.forEach((l,i)=>{const [n,a,d,o]=l.split(/\t|,/).map(x=>x.trim());
    if(!n||isNaN(+a)||a===''){bad.push(i+1);return;}
    if(D.plans.concat(add).some(x=>x.name.toLowerCase()===n.toLowerCase())){bad.push(i+1);return;}
    add.push({id:uid(),name:n,amount:+a,days:d===undefined||d===''?30:Math.max(0,parseInt(d,10)||0),order:parseInt(o,10)||++ord,note:''});});
  if(!add.length){toast('No valid line found'+(bad.length?` (invalid lines: ${bad.join(', ')})`:''),'bad');return;}
  if(!await ask(`Add ${add.length} fees?${bad.length?`<br><span class="red">Line ${bad.join(', ')} will be skipped (invalid or already exists).</span>`:''}`))return;
  D.plans.push(...add);save();toast(`${add.length} fees added`,'ok');scrPlans();
}

let colSid=null;
function scrCollect(sid){
  colSid=sid||null;
  main.innerHTML=title('Fee Collect — Receipt')+
  `<div class="card pick"><label>Select student (name / ID / mobile / seat) — <kbd>↓</kbd> <kbd>Enter</kbd></label><input id="sq" autocomplete="off" placeholder="Start typing…"><div id="sugg" hidden></div></div><div id="colbody"></div>`;
  const sq=$('#sq'),sg=$('#sugg');let si=0,res=[];
  const draw=()=>{res=findStudents(sq.value).slice(0,12);si=0;
    sg.hidden=!sq.value.trim();sg.innerHTML=res.map((s,i)=>`<div class="${i?'':'on'}" data-i="${i}">${esc(s.code)} — <b>${esc(s.name)}</b> <span class="muted">${esc(s.mobile)} · Seat ${esc(s.seat||'—')}</span> ${tag(s)}</div>`).join('')||'<div class="muted">No match</div>';
    sg.querySelectorAll('[data-i]').forEach(d=>d.onmousedown=ev=>{ev.preventDefault();pick(res[+d.dataset.i].id);});};
  const pick=id=>{sg.hidden=true;sq.value='';colSid=id;drawCollect();};
  sq.oninput=draw;sq.onblur=()=>setTimeout(()=>sg.hidden=true,150);
  keyH=(e)=>{

    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();si=Math.max(0,Math.min(res.length-1,si+(e.key==='ArrowDown'?1:-1)));
      sg.querySelectorAll('[data-i]').forEach((d,i)=>d.classList.toggle('on',i===si));return true;}

  };

function drawCollect(){
  const s=stu(colSid);if(!s)return;
  const per=periodic(),one=oneTime(),hist=D.receipts.filter(r=>r.sid===s.id).slice(-6).reverse();
  const first=!D.receipts.some(r=>r.sid===s.id&&!r.cancel);
  const P=new Set(s.paid||[]),cm=curMonth(),due=unpaidMonths(s);
  const paidBy={};D.receipts.filter(r=>r.sid===s.id&&!r.cancel).forEach(r=>(r.mlist||[]).forEach(m=>paidBy[m]=r.no));
  const last=(s.paid||[]).slice(-1)[0]||cm;
  const jm=(s.join||today()).slice(0,7);let start=[mAdd(cm,-5),due[0]||cm].sort()[0];if(start<jm)start=jm;

async function saveReceipt(){
  const s=stu(colSid);if(!s)return;
  const p=plan(val('c_plan')),mlist=[...main.querySelectorAll('.mgrid input[data-m]:checked')].map(e=>e.dataset.m).sort();
  const ex=[...main.querySelectorAll('.xgrid input[data-x]:checked')].map(e=>plan(e.dataset.x)).filter(Boolean);
  if(mlist.length&&!p){toast('Create a monthly fee in Fee Master','bad');return;}
  const fee=num('c_fee'),extraAmt=num('c_extraamt'),disc=num('c_disc'),oldBal=+s.bal||0,total=Math.max(0,fee+extraAmt+oldBal-disc),paid=num('c_paid');
  if(!mlist.length&&!ex.length&&!oldBal&&!await ask('No month or fee is ticked. Create the receipt anyway?'))return;
  if(paid<=0&&!await ask('Received amount is ₹0. Create the receipt anyway?'))return focusEl('#c_paid');
  if(paid>total&&!await ask(`Received (${rs(paid)}) is more than the total (${rs(total)}). Continue?`))return focusEl('#c_paid');
  const r={id:uid(),no:++D.seq.rcpt,date:val('c_date')||today(),time:nowTime(),sid:s.id,code:s.code,name:s.name,
    head:mlist.length?p.name:'',mlist,months:mlist.length,from:mlist.length?mlist[0]+'-01':'',to:mlist.length?mEnd(mlist[mlist.length-1]):'',fee,
    extras:ex.map(x=>({name:x.name,amt:+x.amount})),extra:ex.map(x=>x.name).join(', '),extraAmt,disc,oldBal,total,paid,bal:r2(total-paid),mode:val('c_mode'),note:val('c_note'),
    prevValid:s.validTill||'',prevBal:oldBal};
  D.receipts.push(r);s.bal=r.bal;s.paid=[...new Set([...(s.paid||[]),...mlist])];syncValid(s);
  save();toast(`Receipt #${r.no} saved`,'ok');
  if(D.settings.autoPrint)printReceipt(r.id);
  if(D.settings.autoWa)waReceipt(r.id);
  scrCollect();afterReceipt(r);
}
function afterReceipt(r){

    <div class="btns"><button class="btn" data-k="P" onclick="printReceipt('${r.id}')">Print (P)</button><button class="btn wa" data-k="W" onclick="waReceipt('${r.id}')">WhatsApp (W)</button>

function rcptText(r){
  const S=D.settings,s=stu(r.sid)||{},L=[`*${S.name}*`,`Fee Receipt No: ${r.no}${r.cancel?' (CANCELLED)':''}`,`Date: ${dmy(r.date)}`,'',`Name: ${r.name} (ID ${r.code})`];
  if(s.seat)L.push(`Seat: ${s.seat}${s.shift?' | '+s.shift:''}`);
  if(r.mlist&&r.mlist.length)L.push(`${r.head}: ${rs(r.fee)}`,`*Fee months: ${mText(r.mlist)}*`);else if(r.fee)L.push(`Fee: ${rs(r.fee)}`);

let attDate=null;
function scrAtt(){
  attDate=attDate||today();
  main.innerHTML=title('Attendance',`Date <input type="date" id="a_date" value="${attDate}"><button class="btn sm g" onclick="go('attrep')">Month Report (M)</button>`)+
  `<div class="card"><label>Type Student ID / Seat / Mobile and press <kbd>Enter</kbd> — first time IN, second time OUT</label>

  <div class="card" style="padding:0"><table><thead><tr><th>ID</th><th>Name</th><th>Seat / Shift</th><th>In</th><th>Out</th><th>Duration</th><th>Status</th><th></th></tr></thead><tbody id="a_tb"></tbody></table></div>`;
  $('#a_date').onchange=()=>{attDate=$('#a_date').value||today();drawAtt();};
  $('#a_scan').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();attScan($('#a_scan').value);$('#a_scan').value='';}};
  drawAtt();focusEl('#a_scan');

function drawAtt(){
  const day=D.att[attDate]||{},L=active().slice().sort((a,b)=>(day[b.id]?1:0)-(day[a.id]?1:0)||(parseInt(a.code,10)||0)-(parseInt(b.code,10)||0));
  const P=L.filter(s=>day[s.id]).length,inside=L.filter(s=>day[s.id]&&!day[s.id].out).length;
  $('#a_tb').innerHTML=`<tr><td colspan="8" class="muted">Present: <b class="green">${P}</b> · Inside now: <b>${inside}</b> · Absent: <b class="red">${L.length-P}</b> · Total: ${L.length}</td></tr>`+
  L.map(s=>{const a=day[s.id];return `<tr><td>${esc(s.code)}</td><td><b>${esc(s.name)}</b> ${stStatus(s).k==='due'?'<span class="tag due">Fee due</span>':''}</td>
    <td>${esc(s.seat||'—')} ${s.shift?'<span class="muted small">'+esc(s.shift)+'</span>':''}</td>
    <td>${a?`<a href="#" title="Edit time" onclick="attEdit('${s.id}','in');return false"><b class="green">${esc(a.in||'—')}</b></a>`:''}</td>
    <td>${a?(a.out?`<a href="#" title="Edit time" onclick="attEdit('${s.id}','out');return false"><b>${esc(a.out)}</b></a>`:'<span class="tag soon">Inside</span>'):''}</td>
    <td>${a?dur(a.in,a.out):''}</td>
    <td>${a?'<span class="tag ok">Present</span>':'<span class="tag left">Absent</span>'}</td>
    <td class="n" style="white-space:nowrap">${!a?`<button class="btn sm ok" onclick="attToggle('${s.id}')">Present (In)</button>`:
      `${a.out?'':`<button class="btn sm" onclick="attMark('${s.id}')">Out</button> `}<button class="btn sm g" onclick="attToggle('${s.id}')">Absent</button>`}</td></tr>`;}).join('')||'<tr><td colspan="8" class="muted">No active students.</td></tr>';
}
function attEdit(id,k){
  const a=(D.att[attDate]||{})[id];if(!a)return;
  const v=prompt(`${k==='in'?'In':'Out'} time (HH:MM, 24-hour)`,a[k]||nowTime());if(v===null)return;
  if(v&&!/^([01]?\d|2[0-3]):[0-5]\d$/.test(v.trim())){toast('Enter time like 09:30 or 17:45','bad');return;}
  a[k]=v.trim()?v.trim().padStart(5,'0'):'';save();drawAtt();
}
function attScan(q){
  q=String(q||'').trim();if(!q)return;
  const ql=q.toLowerCase(),qd=normPh(q),A=active();
  let m=A.filter(s=>String(s.code).toLowerCase()===ql);
  if(!m.length&&qd.length===10)m=A.filter(s=>s.mobile===qd);
  if(!m.length)m=A.filter(s=>String(s.seat||'').toLowerCase()===ql);
  const msg=$('#a_msg');
  if(!m.length){msg.innerHTML=`<span class="red">"${esc(q)}" — no active student found</span>`;return;}
  if(m.length>1){msg.innerHTML=`Seat ${esc(q)} has ${m.length} students: `+m.map(s=>`<button class="btn sm" onclick="attMark('${s.id}')">${esc(s.code)} ${esc(s.name)}</button>`).join(' ');return;}
  attMark(m[0].id);
}
function attMark(id){
  const s=stu(id),day=D.att[attDate]=D.att[attDate]||{},t=nowTime(),msg=$('#a_msg');let txt;
  if(!day[id]){day[id]={in:t,out:''};txt=`<span class="green">IN ${t}</span>`;}
  else if(!day[id].out){day[id].out=t;txt=`<span style="color:var(--bar);font-weight:600">OUT ${t} · ${dur(day[id].in,t)}</span>`;}
  else{txt=`<span class="muted">Already IN ${day[id].in} / OUT ${day[id].out}</span>`;}
  const st=stStatus(s);
  msg.innerHTML=`<b>${esc(s.code)} — ${esc(s.name)}</b> ${txt}${st.k==='due'?` <span class="tag due">Fee due! ${dueAmt(s)?rs(dueAmt(s)):''}</span>`:st.k==='soon'?` <span class="tag soon">${esc(st.t)}</span>`:''}`;
  save();drawAtt();focusEl('#a_scan');
}
function attToggle(id){
  const day=D.att[attDate]=D.att[attDate]||{};
  if(day[id])delete day[id];else day[id]={in:attDate===today()?nowTime():'',out:''};
  save();drawAtt();
}

  const norm=h=>String(h).toLowerCase().replace(/[^a-z]/g,'');
  const hdr=rows[0].map(norm),map={};
  Object.entries(ICOLS).forEach(([k,al])=>{const i=hdr.findIndex(h=>al.includes(h));if(i>=0)map[k]=i;});
  if(map.name===undefined){toast('The first row must have headings — at least "Name"','bad');return;}
  const codes=new Set(D.students.map(s=>s.code));let next=+nextCode();
  impRows=rows.slice(1).map((r,ix)=>{
    const g=k=>map[k]===undefined?'':String(r[map[k]]??'').trim(),x={line:ix+2,err:[],warn:[]};
    x.name=g('name');x.father=g('father');x.mobile=normPh(g('mobile'));x.address=g('address');x.seat=g('seat');x.shift=g('shift');x.planName=g('plan');
    x.fee=g('fee')===''?null:+g('fee').replace(/[^\d.]/g,'');x.paid=+g('paid').replace(/[^\d.]/g,'')||0;x.bal=+g('bal').replace(/[^\d.]/g,'')||0;
    x.join=parseDate(g('join'));x.paidtill=parseDate(g('paidtill'));x.code=g('code');
    if(!x.name)x.err.push("Name missing");
    if(x.join===null){x.err.push('Invalid join date');}else if(!x.join)x.join=today();
    if(x.paidtill===null)x.err.push('Invalid paid till date');
    if(x.mobile&&x.mobile.length!==10)x.warn.push('Mobile is not 10 digits');if(!x.mobile)x.warn.push('No mobile');
    if(x.code&&codes.has(x.code))x.err.push('ID '+x.code+' already exists');
    if(!x.code){while(codes.has(String(next)))next++;x.code=String(next++);}codes.add(x.code);
    const p=x.planName?D.plans.find(p=>p.name.toLowerCase()===x.planName.toLowerCase()&&+p.days>0):periodic()[0];
    if(!p&&!x.planName&&!periodic().length&&x.fee===null)x.err.push('Give a Fee or Plan');
    x.plan=p||null;if(x.fee===null)x.fee=p?+p.amount:0;
    if(!p)x.warn.push(`New plan will be created: ${x.planName||'Monthly'}`);
    return x;});
  const ok=impRows.filter(x=>!x.err.length).length;
  $('#i_out').innerHTML=`<div class="card"><b>${impRows.length}</b> rows · <span class="green">${ok} OK</span> · <span class="red">${impRows.length-ok} with errors (will be skipped)</span></div>
  <div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Line</th><th>ID</th><th>Name</th><th>Mobile</th><th>Seat</th><th>Plan</th><th class="n">Fee</th><th>Join</th><th>Paid till</th><th class="n">Paid</th><th class="n">Balance</th><th>Issue</th></tr></thead><tbody>
  ${impRows.map(x=>`<tr class="${x.err.length?'err':''}"><td>${x.line}</td><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.mobile)}</td><td>${esc(x.seat)}</td><td>${esc(x.plan?x.plan.name:x.planName||'Monthly')}</td>
    <td class="n">${rs(x.fee)}</td><td>${dmy(x.join||'')}</td><td>${dmy(x.paidtill||'')}</td><td class="n">${x.paid?rs(x.paid):''}</td><td class="n">${x.bal?rs(x.bal):''}</td>
    <td class="small">${x.err.map(e=>`<span class="red">${esc(e)}</span>`).concat(x.warn.map(esc)).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`;
  $('#i_go').disabled=!ok;
}
async function impRun(){
  const good=impRows.filter(x=>!x.err.length);if(!good.length){toast('Click Preview first','bad');return;}
  if(!await ask(`Import ${good.length} students?`))return;
  let rc=0;
  good.forEach(x=>{
    let p=x.plan;
    if(!p){const nm=x.planName||'Monthly';p=D.plans.find(q=>q.name.toLowerCase()===nm.toLowerCase());
      if(!p){p={id:uid(),name:nm,amount:x.fee,days:30,note:'From import'};D.plans.push(p);}}
    const s={id:uid(),code:x.code,name:x.name,father:x.father,mobile:x.mobile,address:x.address,seat:x.seat,shift:x.shift,planId:p.id,fee:x.fee,
      join:x.join,paid:monthsCovered(x.join,x.paidtill),bal:x.bal,status:'active',note:'',created:today()};
    if(x.paid>0){
      if(!s.paid.length)s.paid=[x.join.slice(0,7)];
      const ml=s.paid.slice();
      D.receipts.push({id:uid(),no:++D.seq.rcpt,date:x.join,time:'',sid:s.id,code:s.code,name:s.name,head:p.name,mlist:ml,months:ml.length,from:ml[0]+'-01',to:mEnd(ml[ml.length-1]),fee:x.paid,extra:'',extraAmt:0,disc:0,
        oldBal:0,total:x.paid+x.bal,paid:x.paid,bal:x.bal,mode:'Cash',note:'Import (opening)',prevValid:'',prevBal:0});
      rc++;}
    syncValid(s);
    D.students.push(s);});
  save();toast(`${good.length} students imported${rc?`, ${rc} receipts`:''}`,'ok');impRows=[];go('list');
}

/* ================= SETTINGS & BACKUP ================= */
async function scrSettings(){
  const S=D.settings,M=S.mail;
  main.innerHTML=title('Settings & Backup')+
  `<div class="form"><div class="card"><h4>Library details (printed on the slip)</h4><div class="grid">
    <div class="w2"><label>Library name <i>*</i></label><input id="g_name" value="${esc(S.name)}"></div>
    <div><label>Contact number</label><input id="g_contact" value="${esc(S.contact)}"></div>
    <div><label>Owner WhatsApp (for reports)</label><input id="g_owner" value="${esc(S.owner)}"></div>
    <div class="w2"><label>Address</label><input id="g_address" value="${esc(S.address)}"></div>
    <div class="w2"><label>Slip footer text</label><input id="g_footer" value="${esc(S.footer)}"></div>
    <div class="w2"><label>Shifts (comma separated)</label><input id="g_shifts" value="${esc(S.shifts)}"></div>
    <div><label>Show "expiring soon" this many days before</label><input id="g_exp" type="number" min="0" value="${S.expDays}"></div>
  </div></div>
  <div class="card"><h4>Receipt slip</h4><div class="grid">
    <div><label>Slip size</label><select id="g_slip">${[['58','58 mm thermal'],['80','80 mm thermal'],['A6','A6 (105×148 mm)'],['A5','A5 (half A4)'],['A4','A4']].map(([k,t])=>`<option value="${k}"${S.slip===k?' selected':''}>${t}</option>`).join('')}</select></div>
    <div><label>Print after save</label><select id="g_ap"><option value="1">Yes</option><option value="0"${S.autoPrint?'':' selected'}>No</option></select></div>
    <div><label>WhatsApp after save</label><select id="g_aw"><option value="0">No</option><option value="1"${S.autoWa?' selected':''}>Yes</option></select></div>
    <div><label>Open WhatsApp in</label><select id="g_wam"><option value="web">WhatsApp Web (browser)</option><option value="app"${S.waMode==='app'?' selected':''}>WhatsApp Desktop App</option></select></div>
  </div><div class="btns"><button class="btn g" onclick="saveSettings(true).then(testPrint,()=>{})">Test print</button></div></div>
  <div class="card"><h4>Email backup (Gmail)</h4>
    <div class="hint">Turn on <b>2-Step Verification</b> in Gmail → create a 16-letter <b>App Password</b> at <b>myaccount.google.com/apppasswords</b>. Your normal Gmail password will not work here.</div>
    <div class="grid">
    <div><label>Gmail ID (sender)</label><input id="g_mu" value="${esc(M.user)}" placeholder="library@gmail.com"></div>
    <div><label>App Password</label><input id="g_mp" type="password" value="${esc(M.pass)}" autocomplete="new-password"></div>
    <div class="w2"><label>Send backup to (comma for many)</label><input id="g_mt" value="${esc(M.to)}"></div>
    <div><label>Send automatically every day</label><select id="g_ma"><option value="1">Yes (once a day)</option><option value="0"${M.auto?'':' selected'}>No</option></select></div>
  </div><div class="btns"><button class="btn" onclick="sendEmailBackup()">Email backup now</button></div><p class="small" id="g_mailst"></p></div>
  <div class="btns" style="margin-bottom:14px"><button class="btn ok" onclick="saveSettings().catch(()=>{})">Save Settings (Ctrl+S)</button></div></div>
  <div class="card"><h4>Data backup / restore</h4>
    <div class="btns"><a class="btn g" href="/api/export" download style="text-decoration:none">Backup download (.json)</a><button class="btn g" onclick="exportStudents()">Students CSV / Excel</button>
    <label class="btn g" style="margin:0;color:var(--bar);font-size:14px">Restore backup<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label></div>
    <p class="small muted" id="g_info"></p></div>`;
  onSave=()=>saveSettings().catch(()=>{});focusEl('#g_name');
  try{INFO=await api('info');}catch(e){}
  if($('#g_info'))$('#g_info').innerHTML=`Data folder: <b>${esc(INFO.dataDir||'')}</b><br>Daily local backup: <b>${esc(INFO.backupDir||'')}</b> (kept 60 days)`;
  showMailStatus();
}
function showMailStatus(){const e=$('#g_mailst');if(!e)return;
  e.innerHTML=(INFO.lastEmail?`Last email backup: <b class="green">${new Date(INFO.lastEmail).toLocaleString('en-IN')}</b>`:'No email backup sent yet.')+
    (INFO.lastEmailError?`<br><span class="red">Pichhli galti: ${esc(INFO.lastEmailError)}</span>`:'');}
function saveSettings(quiet){
  const S=D.settings,name=val('g_name');
  if(!name){toast('Enter the library name','bad');focusEl('#g_name');return Promise.reject();}
  Object.assign(S,{name,contact:val('g_contact'),owner:normPh(val('g_owner')),address:val('g_address'),footer:val('g_footer'),shifts:val('g_shifts'),
    expDays:Math.max(0,parseInt(val('g_exp'),10)||0),slip:val('g_slip'),autoPrint:val('g_ap')==='1',autoWa:val('g_aw')==='1',waMode:val('g_wam')});
  S.mail={...S.mail,user:val('g_mu'),pass:$('#g_mp').value.replace(/\s+/g,''),to:val('g_mt'),auto:val('g_ma')==='1'};
  $('#libname').textContent=S.name;if(!quiet)toast('Settings saved','ok');
  return save();
}
async function sendEmailBackup(){
  await saveSettings(true);const e=$('#g_mailst');e.innerHTML='Sending…';
  try{INFO={...INFO,...await api('email-backup',{})};toast('Backup emailed','ok');}
  catch(err){INFO.lastEmailError=err.message;toast('Email failed: '+err.message,'bad');}
  showMailStatus();
}
function testPrint(){printHtml(rcptHtml({no:0,date:today(),time:nowTime(),sid:'',code:'1001',name:'Test Student',head:'Monthly Fee',months:1,mlist:[curMonth()],from:curMonth()+'-01',to:mEnd(curMonth()),
  fee:500,extra:'',extraAmt:0,disc:0,oldBal:0,total:500,paid:500,bal:0,mode:'Cash',note:''}),PAGE[D.settings.slip]);}
function restore(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=async()=>{let d;try{d=JSON.parse(rd.result);}catch(e){toast('Invalid file','bad');return;}
    if(!d||!d.settings||!Array.isArray(d.students)){toast('This is not a Library ERP backup','bad');return;}
    if(!await ask(`The backup has ${d.students.length} students and ${(d.receipts||[]).length} receipts. Replace the current data with it?`))return;
    D=migrate(d);await save();toast('Restored','ok');go('home');};
  rd.readAsText(f);
}

/* ================= QUIT ================= */
async function scrQuit(){
  scrHome();$('#scr').textContent='Gateway of Library';cur='home';
  if(!await ask('Close the ERP? All data is saved. Run Library ERP again to reopen it.','Yes, close','No'))return;
  await saving;try{await api('quit',{});}catch(e){}
  D=null;$('#side').innerHTML='';$('#lic').textContent='';$('#scr').textContent='Closed';
  main.innerHTML=`<div class="act card"><h3>ERP closed</h3><p>You can close this window now. To open it again, run <b>Library ERP</b> from the desktop.</p></div>`;
  setTimeout(()=>window.close(),800);
}

/* ================= LICENSE ================= */
function licBar(){const e=$('#lic');if(!LIC||!LIC.ok){e.textContent='';return;}
  e.textContent=LIC.lifetime?'License: Lifetime':`License: ${LIC.daysLeft} days (${dmy(LIC.expiry)})`;e.className='lic'+(!LIC.lifetime&&LIC.daysLeft<=7?' low':'');}
function scrLicense(){
  main.innerHTML=title('License / Activation')+`<div class="card" style="max-width:620px"><table class="info">
    <tr><td>Machine code</td><td><b style="font:700 18px Consolas,monospace">${esc(LIC.machine)}</b></td></tr>
    ${LIC.lifetime?`<tr><td>Validity</td><td><b class="green">Lifetime</b></td></tr>`:`<tr><td>Valid till</td><td><b>${dmy(LIC.expiry)}</b></td></tr><tr><td>Days left</td><td><b class="${LIC.daysLeft<=7?'red':'green'}">${LIC.daysLeft}</b></td></tr>`}
    ${LIC.name?`<tr><td>Licensed to</td><td>${esc(LIC.name)}</td></tr>`:''}</table>
    <div class="form" style="margin-top:12px"><label>New activation key (to renew)</label><textarea id="k_key" rows="3" style="font:12px Consolas,monospace"></textarea>
    <div class="btns"><button class="btn" onclick="doActivate(val('k_key'))">Activate (Ctrl+S)</button>${LIC.vendorPhone?`<button class="btn wa" onclick="askKey()">Request key on WhatsApp</button>`:''}</div></div></div>`;
  onSave=()=>doActivate(val('k_key'));focusEl('#k_key');
}
function askKey(){waOpen(LIC.vendorPhone,`I need a Library ERP activation key.\nMachine code: ${LIC.machine}${D&&D.settings?'\nLibrary: '+D.settings.name:''}`);}
async function doActivate(key){
  if(!key){toast('Paste the key','bad');return;}
  try{LIC=await api('activate',{key});toast(`Activated — ${LIC.lifetime?'Lifetime':LIC.daysLeft+' days'}`,'ok');await boot();}
  catch(e){toast(e.message,'bad');}
}
function showActivate(){
  D=null;$('#side').innerHTML='';$('#scr').textContent='Activation';$('#lic').textContent='';
  const why={new:'This software is not activated.',invalid:'The activation key is not valid for this computer.',expired:`The license expired on ${dmy(LIC.expiry)}.`,
    clock:'The computer date/time has been set back. Set the correct date and open again.'}[LIC.reason]||'';
  main.innerHTML=`<div class="act card"><h2 style="margin-top:0;color:var(--bar)">Library ERP — Activation</h2>
    <p class="${LIC.reason==='new'?'':'red'}">${why}</p>
    <p>Send your <b>Machine code</b> to the vendor. They will give you an <b>Activation Key</b>.</p>
    <div class="mcode">${esc(LIC.machine)}</div>
    ${LIC.vendor||LIC.vendorPhone?`<p class="muted">Contact: <b>${esc(LIC.vendor)}</b> ${esc(LIC.vendorPhone)}</p>`:''}
    <div class="btns"><button class="btn g" onclick="navigator.clipboard.writeText('${LIC.machine}').then(()=>toast('Copied'))">Code copy</button>
      ${LIC.vendorPhone?`<button class="btn wa" onclick="waOpen(LIC.vendorPhone,'I need a Library ERP activation key.\\nMachine code: ${LIC.machine}')">Send on WhatsApp</button>`:''}</div>
    <label style="margin-top:16px">Paste the activation key here</label><textarea id="k_key" rows="4" style="font:12px Consolas,monospace" autofocus></textarea>
    <div class="btns"><button class="btn ok" id="k_go">Activate (Ctrl+Enter)</button>${LIC.reason==='new'?'':'<a class="btn g" href="/api/export" download style="text-decoration:none">Download my data</a>'}</div></div>`;
  const go_=()=>doActivate(val('k_key'));$('#k_go').onclick=go_;
  $('#k_key').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||!e.shiftKey)){e.preventDefault();go_();}};
  focusEl('#k_key');
}

/* ================= BOOT ================= */
async function boot(){
  try{LIC=await api('license');}
  catch(e){main.innerHTML=`<div class="act card"><h3>Cannot connect to the server</h3><p>Open Library ERP from the desktop icon (LibraryERP.exe).</p></div>`;return;}
  if(!LIC.ok)return showActivate();
  let data=null;try{data=await api('data');}catch(e){toast(e.message,'bad');return;}
  D=migrate(data);if(!data)save();
  drawSide();licBar();
  if(!LIC.lifetime&&LIC.daysLeft<=7)toast(`License expires in ${LIC.daysLeft} days — please renew (K)`,'bad');
  go('home');duePopup();
}
function duePopup(){
  let k='';try{k=localStorage.getItem('liberp_due_popup');}catch(e){}
  if(k===today())return;
  const L=active().filter(s=>stStatus(s).k==='due').sort((a,b)=>stStatus(b).od-stStatus(a).od);
  if(!L.length)return;
  try{localStorage.setItem('liberp_due_popup',today());}catch(e){}
  modal(`Fee reminder — ${L.length} students have fees due`,`<table><thead><tr><th>ID</th><th>Name</th><th>Due months</th><th class="n">Amount</th><th></th></tr></thead><tbody>
    ${L.slice(0,12).map(s=>`<tr><td>${esc(s.code)}</td><td><b>${esc(s.name)}</b></td><td class="small red">${esc(mText(stStatus(s).u))}</td><td class="n">${rs(dueAmt(s))}</td>
      <td class="n" style="white-space:nowrap"><button class="btn sm wa" onclick="waRemind('${s.id}')">WhatsApp</button> <button class="btn sm ok" onclick="go('collect','${s.id}')">Fee</button></td></tr>`).join('')}</tbody></table>
    ${L.length>12?`<p class="muted small">…and ${L.length-12} more. See the Due List.</p>`:''}
    <div class="btns"><button class="btn" data-k="D" autofocus onclick="go('due','due')">Open Due List (D)</button><button class="btn g" data-k="L" onclick="closeModal()">Later (L)</button></div>`);
}
setInterval(async()=>{if(!D)return;try{LIC=await api('license');if(!LIC.ok)showActivate();else licBar();}catch(e){}},30*60e3);
window.addEventListener('beforeunload',()=>{if(D)navigator.sendBeacon('/api/data',new Blob([JSON.stringify(D)],{type:'application/json'}));});
boot();
</script>
