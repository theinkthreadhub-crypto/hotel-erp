name: Library ERP EXE

on:
  push:
    paths: ['library-erp/**', '.github/workflows/library-erp-exe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: library-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: LibraryERP-windows
          path: library-erp/dist/*.exe
      # Pakka link: releases/download/library-erp-latest/LibraryERP.exe (har push par nayi exe)
      - name: Publish latest release
        if: github.ref == 'refs/heads/liberp'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete library-erp-latest --yes --cleanup-tag || true
          gh release create library-erp-latest dist/LibraryERP.exe \
            --target "${{ github.sha }}" --title "Library ERP (latest)" \
            --notes "Customer ke liye LibraryERP.exe. Commit ${{ github.sha }}. Activation key LibraryKeygen se banayein."
