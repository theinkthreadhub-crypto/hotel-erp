name: Library ERP EXE

on:
  push:
    paths: ['library-erp/**', '.github/workflows/library-erp-exe.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: library-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: LibraryERP-windows
          path: library-erp/dist/*.exe
