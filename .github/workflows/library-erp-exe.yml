name: Library ERP EXE

on:
  push:
    paths: ['library-erp/**', '.github/workflows/library-erp-exe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: library-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: LibraryERP-windows
          path: library-erp/dist/*.exe

  # Installer (NSIS 64-bit) + pakka download link
  setup:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library-erp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LibraryERP-windows
          path: library-erp/dist
      - run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - run: makensis -V2 -DVERSION=$(node -p "require('./package.json').version") installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: LibraryERP-Setup
          path: library-erp/dist/LibraryERP-Setup.exe
      # releases/download/library-erp-latest/LibraryERP-Setup.exe (har push par naya)
      - name: Publish latest release
        if: github.ref == 'refs/heads/liberp'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete library-erp-latest --yes --cleanup-tag || true
          gh release create library-erp-latest dist/LibraryERP-Setup.exe dist/LibraryERP.exe \
            --target "${{ github.sha }}" --title "Library ERP (latest)" \
            --notes "LibraryERP-Setup.exe = install karne wala (recommended). LibraryERP.exe = bina install. Commit ${{ github.sha }}."
