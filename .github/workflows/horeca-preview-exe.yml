name: HoReCa One Windows Preview EXE (no release)
on:
  push:
    branches:
      - feat/horeca-one-premium-22-modules
    paths:
      - hotel_erp.html
      - app_main.py
      - setu_security.py
      - setu_media.py
      - installer/horeca_preview_hook.py
      - .github/workflows/horeca-preview-exe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install preview build dependencies
        run: python -m pip install --upgrade pyinstaller pywebview certifi
      - name: Check Python sources
        run: python -m py_compile app_main.py setu_security.py setu_media.py installer/horeca_preview_hook.py
      - name: Build isolated preview EXE
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name HoReCa-One-Preview --icon favicon.ico
          --runtime-hook installer/horeca_preview_hook.py
          --add-data "hotel_erp.html;."
          --add-data "manifest.json;."
          --add-data "sw.js;."
          --add-data "icon-192.png;."
          --add-data "icon-512.png;."
          --add-data "logo.png;."
          --add-data "favicon.ico;."
          --add-data "food;food"
          app_main.py
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/HoReCa-One-Preview.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  HoReCa-One-Preview.exe" | Set-Content -Encoding ascii dist/HoReCa-One-Preview.sha256.txt
      - name: Publish isolated private preview prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "horeca-one-preview-20261031-rc1"
          $notes = "TEST BUILD ONLY. Isolated local data in HoReCaOnePreview/Data, port 8161. This does not replace the production ERP. Dummy data only; not certified for customer use."
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/HoReCa-One-Preview.exe dist/HoReCa-One-Preview.sha256.txt --clobber
          } else {
            gh release create $tag dist/HoReCa-One-Preview.exe dist/HoReCa-One-Preview.sha256.txt --target ${{ github.sha }} --title "HoReCa One Preview RC1 — Testing Only" --notes $notes --prerelease --latest=false
          }
