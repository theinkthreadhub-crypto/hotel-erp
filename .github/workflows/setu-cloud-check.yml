name: Setu Cloud check

# Read-only: is the Cloudflare login set, and what is live on setu-cloud (Hotel Setu Cloud)? Deploys nothing.
on:
  push:
    paths: ['.github/workflows/setu-cloud-check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare secrets present?
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "CLOUDFLARE_API_TOKEN set: $([ -n "$TOKEN" ] && echo yes || echo NO)"
          echo "CLOUDFLARE_ACCOUNT_ID set: $([ -n "$ACC" ] && echo yes || echo NO)"
      - name: Cloudflare login and setu-cloud deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no token, skipping"; exit 0; fi
          npx --yes wrangler@4 whoami || true
          npx --yes wrangler@4 deployments list --name setu-cloud || echo "setu-cloud is not deployed on this account"
          echo "---- secret NAMES on setu-cloud (values are never shown) ----"
          npx --yes wrangler@4 secret list --name setu-cloud | grep -o '"name": *"[^"]*"' || true
      - name: What answers on the internet
        run: |
          echo "setu-cloud /api/ping:"; curl -s -m 15 https://setu-cloud.theinkthreadhub.workers.dev/api/ping || echo "(no answer)"; echo
          echo "setu-cloud /api/counter/link (400 install id = new code; hotel code required = old code):"
          curl -s -m 15 -X POST -H 'Content-Type: application/json' -d '{}' https://setu-cloud.theinkthreadhub.workers.dev/api/counter/link || echo "(no answer)"; echo
          echo "setu-cloud /admin.html:"; curl -s -m 15 -o /dev/null -w "%{http_code}\n" https://setu-cloud.theinkthreadhub.workers.dev/admin.html || true
          echo "hotel SHRIM011 on the cloud (name + version = it exists):"; curl -s -m 15 -H 'X-Setu-Hotel: SHRIM011' https://setu-cloud.theinkthreadhub.workers.dev/api/ping || true; echo
          echo "new admin page live (expect 1+):"; curl -s -m 15 -L https://setu-cloud.theinkthreadhub.workers.dev/admin.html | grep -c "Keygen setup" || true
          echo "Master Key in the live admin page (expect 1+):"; curl -s -m 15 -L https://setu-cloud.theinkthreadhub.workers.dev/admin.html | grep -c "Master Key banao" || true
          echo "admin page cache header:"; curl -sI -m 15 https://setu-cloud.theinkthreadhub.workers.dev/admin | grep -i "cache-control" || true
          echo "keygen endpoint without key (expect 401):"; curl -s -m 15 -o /dev/null -w "%{http_code}\n" -X POST -d '{}' https://setu-cloud.theinkthreadhub.workers.dev/api/admin/keygen || true
          echo "library setu-erp /api ping:"; curl -s -m 15 -o /dev/null -w "%{http_code}\n" https://setu-erp.theinkthreadhub.workers.dev/view || true
      - name: Release checks on the live Worker (read-only, creates nothing)
        run: |
          U=https://setu-cloud.theinkthreadhub.workers.dev
          echo "self-registration closed (expect 403 REGISTRATION_CLOSED):"
          curl -s -m 15 -w " [%{http_code}]\n" -X POST -H 'Content-Type: application/json' -d '{}' $U/api/hotel/register || true
          echo "password route exists (unknown hotel, expect 404):"
          curl -s -m 15 -w " [%{http_code}]\n" -X POST -H 'Content-Type: application/json' -d '{"hotelId":"ZZZZ0000","password":"x","newPassword":"y"}' $U/api/hotel/password || true
          echo "Super Admin Login Card live (expect 1+):"; curl -s -m 15 -L $U/admin.html | grep -c "Login Card" || true
          echo "POS choose-password step live (expect 1+):"; curl -s -m 15 -L $U/hotel_erp.html | grep -c "exist_change_box" || true
          echo "service worker cache:"; curl -s -m 15 $U/sw.js | grep -o "setu-pos-v[0-9]*" | head -1 || true
          echo "paise arithmetic live (expect 1+):"; curl -s -m 15 -L $U/hotel_erp.html | grep -c "const linePaise = i =>" || true
          echo "download manifest (EXE for counter PCs, must be unchanged):"; curl -s -m 15 $U/download/latest.json || true; echo
      - name: What hotel.setupro.in serves (read-only)
        run: |
          D=https://hotel.setupro.in
          echo "page status:"; curl -s -m 15 -o /dev/null -w "%{http_code}\n" "$D/hotel_erp.html" || true
          echo "service worker cache (cloud now: setu-pos-v103):"; curl -s -m 15 "$D/sw.js" | grep -o "setu-pos-v[0-9]*" | head -1 || true
          echo "paise arithmetic in its page (1+ = current):"; curl -s -m 15 -L "$D/hotel_erp.html" | grep -c "const linePaise = i =>" || true
          echo "vendor login step in its page (1+ = current):"; curl -s -m 15 -L "$D/hotel_erp.html" | grep -c "exist_change_box" || true
          echo "admin page via hotel.setupro.in/admin (200 + title = routed):"; curl -s -m 15 -L --max-redirs 5 -o a.html -w "%{http_code}\n" "$D/admin" || true; grep -o "<title>[^<]*" a.html | head -1 || true
          echo "table QR route /q/ (200 = routed):"; curl -s -m 15 -L -o /dev/null -w "%{http_code}\n" "$D/q/TEST0000/00000000000000000000000000000000" || true
          echo "installer route /download/latest.json:"; curl -s -m 15 "$D/download/latest.json" | head -c 160 || true; echo
          echo "api goes to the cloud:"; curl -s -m 15 "$D/api/ping" || true; echo
          echo "who answers:"; curl -sI -m 15 "$D/hotel_erp.html" | grep -iE "^server:|^x-vercel|^cf-ray" || true

