# Builds the HoReCa One Super Admin desktop app for Windows (vendor only) and publishes it as a GitHub pre-release
# from the release branch. The app opens https://hotel.setupro.in/admin in its own window.
name: Build Super Admin EXE

on:
  push:
    paths: ['admin_desktop/**', 'installer/super-admin-setup.iss', '.github/workflows/build-super-admin-exe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller pywebview
      - name: Stamp version and build the EXE
        shell: pwsh
        run: |
          $v = "1.0.${{ github.run_number }}"
          (Get-Content admin_desktop/super_admin.py) -replace "APP_VERSION = 'dev'", "APP_VERSION = '$v'" | Set-Content admin_desktop/super_admin.py
          python -m PyInstaller --noconfirm --onefile --windowed --icon "favicon.ico" --name "HoReCa-One-Super-Admin" --add-data "favicon.ico;." admin_desktop/super_admin.py
          if (-not (Test-Path dist/HoReCa-One-Super-Admin.exe)) { exit 1 }
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile installer\MicrosoftEdgeWebview2Setup.exe
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=1.0.${{ github.run_number }}" installer\super-admin-setup.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Smoke test (installs silently, the program starts)
        shell: pwsh
        run: |
          $p = Start-Process Output\HoReCa-One-Super-Admin-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\HoReCaOneSuperAdmin\HoReCa-One-Super-Admin.exe"
          if (-not (Test-Path $exe)) { throw 'not installed' }
          $app = Start-Process $exe -PassThru
          Start-Sleep 12
          if ($app.HasExited) { throw "the program closed by itself (exit $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force
          Write-Host "Installed and running OK"
      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash Output/HoReCa-One-Super-Admin-Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  HoReCa-One-Super-Admin-Setup.exe" | Out-File -Encoding ascii Output/HoReCa-One-Super-Admin-Setup.exe.sha256
          Write-Host "SUPER ADMIN SETUP SHA-256: $h"
      - name: Publish (pre-release)
        if: github.ref_name == 'feature/horeca-one-phase34a-safety'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "super-admin-desktop-v1.0.${{ github.run_number }}"
          gh release create $tag Output/HoReCa-One-Super-Admin-Setup.exe Output/HoReCa-One-Super-Admin-Setup.exe.sha256 --prerelease --target ${{ github.sha }} --title "HoReCa One Super Admin for Windows 1.0.${{ github.run_number }}" --notes "Vendor desktop app: opens https://hotel.setupro.in/admin. Unsigned: Windows SmartScreen -> More info -> Run anyway."
          if ($LASTEXITCODE -ne 0) { exit 1 }
