name: Setu Cloud Worker deploy

# liberp branch par library-erp/cloud ka koi bhi badlav push hote hi Cloudflare par apne aap deploy.
# Secrets (GitHub repo -> Settings -> Secrets and variables -> Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [liberp]
    paths: ['library-erp/cloud/**', 'library-erp/summary.js', 'library-erp/license.js', 'library-erp/tools/**', '.github/workflows/library-erp-worker.yml']
  workflow_dispatch:

concurrency:
  group: setu-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library-erp/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Embed HTML pages into worker.js
        run: node embed.js
      - name: Syntax check
        run: node --check worker.js
      - name: Smoke test (local D1, no real keys/data)
        run: node smoke.js
        timeout-minutes: 10
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
