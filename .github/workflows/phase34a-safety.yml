name: HoReCa One Phase 3.4a Safety CI
on:
  push:
    branches: [feature/horeca-one-phase34a-safety]
  pull_request:
    branches: [feature/horeca-one-phase3-cloud-sync]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install licence verification dependency
        run: python -m pip install 'cryptography>=42,<48'
      - name: Syntax check
        run: |
          python -m py_compile setu_sqlite.py horeca_license_verify.py tests/phase34a_safety_test.py
          node --check cloud/src/worker.js
      - name: Phase 3.4a security tests
        run: python tests/phase34a_safety_test.py
      - name: Phase 3.5 counter to LAN integration tests
        run: python tests/phase35_counter_integration_test.py
      - name: Phase 3.5b browser native QR and UI regression tests
        run: |
          node tests/phase35b_native_qr_ui_test.mjs
          python tests/test_horeca_one_ui.py
      - name: Existing inbound and SQLite regression tests
        run: |
          python tests/sync_phase3_inbound_test.py
          python tests/sync_phase3_outbox_test.py
          python tests/sqlite_phase2b_test.py
      - name: Counter dispatcher and legacy SQLite tests
        run: |
          python tests/sync_phase3_dispatcher_test.py
          python tests/sqlite_phase2_test.py
      - name: Financial accounting and guard regressions
        run: |
          node tests/guard-records.test.mjs
          node tests/run_accounting_p0_suite.cjs
      - name: Cloud change feed regression tests
        run: node --loader ./tests/cf_loader.mjs tests/cloud_sync_inbound_test.mjs
      - name: Cloud reporting and ingestion tests
        run: |
          node --loader ./tests/cf_loader.mjs tests/cloud_sync_ingestion_test.mjs
          node --loader ./tests/cf_loader.mjs tests/cloud_reports_test.mjs

  windows-counter-smoke:
    name: Windows EXE isolated counter smoke
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install self-contained build tools
        run: python -m pip install pyinstaller pywebview certifi "cryptography>=42,<48"
      - name: Windows local QR, KOT and SQLite tests
        run: python tests/phase35_counter_integration_test.py
      - name: Build isolated EXE without publishing a release
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name "HoReCaOne-QA" --add-data "hotel_erp.html;." --add-data "manifest.json;." --add-data "sw.js;." --add-data "icon-192.png;." --add-data "icon-512.png;." --add-data "logo.png;." --add-data "favicon.ico;." app_main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }
      - name: Boot EXE in local SQLite mode, verify HTTP server
        shell: pwsh
        run: |
          $env:SETU_STORAGE = "sqlite"
          $env:SETU_BACKUP = "off"
          $dataDir = Join-Path $env:RUNNER_TEMP "horeca-qa-data"
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist/HoReCaOne-QA.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "horeca-qa-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "horeca-qa-stderr.log"
          $proc = Start-Process -FilePath $exe -ArgumentList @("--server", "--port", "8177", "--data", $dataDir) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i=0; $i -lt 25; $i++) {
              $proc.Refresh()
              if ($proc.HasExited) { throw "Counter EXE crashed during startup (exit $($proc.ExitCode))" }
              try {
                # /api/version requires a logged-in staff session (401 is correct).
                # /api/ping is the intentionally public readiness endpoint.
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:8177/api/ping" -TimeoutSec 3 -NoProxy
                if ($response.setu -eq $true) { $ready = $true; break }
                Write-Host "Counter responded but did not identify as HoReCa One"
              } catch {
                if ($i % 5 -eq 0) { Write-Host "Counter polling: $($_.Exception.Message)" }
                Start-Sleep -Seconds 2
              }
            }
            if (-not $ready) { throw "Counter public readiness endpoint did not become ready" }
            if (-not (Test-Path (Join-Path $dataDir "setu.sqlite"))) {
              throw "SQLite database not created in isolated test data folder"
            }
            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8177/hotel_erp.html" -TimeoutSec 10 -NoProxy
            if ($page.StatusCode -ne 200) { throw "Main POS HTML not available" }
            Write-Output "Windows EXE server smoke PASS (SQLite engine and POS HTML)"
          } catch {
            Write-Host "Windows EXE smoke diagnostic:"
            if (Test-Path $stdout) { Get-Content $stdout -Tail 80 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 80 }
            Get-NetTCPConnection -LocalPort 8177 -ErrorAction SilentlyContinue | Format-Table | Out-String | Write-Host
            throw
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

  cloudflare-local-smoke:
    name: Local Wrangler startup smoke (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Worker and assets
        working-directory: cloud
        run: |
          npm ci --no-audit --no-fund
          node scripts/copy-assets.mjs
          node --check src/worker.js
      - name: Boot isolated Worker in local Miniflare runtime
        working-directory: cloud
        run: |
          set -eu
          npx wrangler dev --local --port 8787 --log-level error --var ADMIN_KEY:synthetic-local-only > /tmp/horeca-wrangler.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 35); do
            status=$(curl -sS --connect-timeout 2 -m 3 -o /tmp/horeca-resp.txt -w '%{http_code}' http://127.0.0.1:8787/api/ping 2>/dev/null || true)
            if [ "$status" = 200 ] || [ "$status" = 400 ] || [ "$status" = 404 ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Wrangler failed to start or returned a server error:"
            cat /tmp/horeca-wrangler.log
            exit 1
          fi
          echo "Local Wrangler startup PASS: HTTP $status"
