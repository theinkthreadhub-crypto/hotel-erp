name: Setu Cloud D1 weekly export

# Har Sunday D1 database ka poora export (SQL) GitHub artifact me 60 din ke liye. Disaster recovery ke liye.
# Token ko D1 permission chahiye: Cloudflare token me "Account > D1 > Edit" (ya Read) jodein.
# Restore: npx wrangler d1 execute setu_erp --remote --file=setu_erp.sql  (naye/khali database par)
on:
  schedule:
    - cron: '17 21 * * 6'    # Sunday ~02:47 IST
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library-erp/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export D1
        run: npx --yes wrangler@3 d1 export setu_erp --remote --output=setu_erp.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Compress
        run: gzip -9 setu_erp.sql && ls -la setu_erp.sql.gz
      - uses: actions/upload-artifact@v4
        with:
          name: setu_erp-d1-export-${{ github.run_number }}
          path: library-erp/cloud/setu_erp.sql.gz
          retention-days: 60
